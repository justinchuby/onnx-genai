name: Squad Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would happen without pushing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  dev-to-preview:
    name: Promote dev → preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The guard has to survive `git checkout preview` below. It is a tracked
      # file, so switching branches removes it from the working tree unless the
      # target branch happens to have it -- and `preview` gets it only via the
      # very merge this script performs. Staging a copy outside the tree breaks
      # that circle, and is the better semantics anyway: the guard that runs is
      # the one on the ref you dispatched, not whichever older copy is sitting
      # on the branch being promoted. A guard that lives on the branch it
      # polices can be weakened by the promotion it is meant to police.
      - name: Stage the promotion guard outside the working tree
        run: |
          install -m 0755 scripts/squad_promote_guard.sh "$RUNNER_TEMP/squad_promote_guard.sh"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state (dry run info)
        run: |
          echo "=== dev HEAD ===" && git log origin/dev -1 --oneline
          echo "=== preview HEAD ===" && git log origin/preview -1 --oneline
          echo "=== Files that would be stripped ==="
          bash "$RUNNER_TEMP/squad_promote_guard.sh" strip-list "origin/preview..origin/dev"

      - name: Merge dev → preview (strip forbidden paths)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git checkout preview
          bash "$RUNNER_TEMP/squad_promote_guard.sh" merge-dev

          # Strip forbidden paths from the merge commit. Fatal if it fails: this
          # is the step that keeps team-only paths off the release branch, and
          # the commit-and-push below does not re-check it.
          bash "$RUNNER_TEMP/squad_promote_guard.sh" strip

          # Commit if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: promote dev → preview (v$(node -e "console.log(require('./package.json').version)"))"
            git push origin preview
            echo "✅ Pushed preview branch"
          else
            echo "ℹ️ Nothing to commit — preview is already up to date"
          fi

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."

  preview-to-main:
    name: Promote preview → main (release)
    needs: dev-to-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The guard has to survive `git checkout preview` below. It is a tracked
      # file, so switching branches removes it from the working tree unless the
      # target branch happens to have it -- and `preview` gets it only via the
      # very merge this script performs. Staging a copy outside the tree breaks
      # that circle, and is the better semantics anyway: the guard that runs is
      # the one on the ref you dispatched, not whichever older copy is sitting
      # on the branch being promoted. A guard that lives on the branch it
      # polices can be weakened by the promotion it is meant to police.
      - name: Stage the promotion guard outside the working tree
        run: |
          install -m 0755 scripts/squad_promote_guard.sh "$RUNNER_TEMP/squad_promote_guard.sh"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state
        run: |
          echo "=== preview HEAD ===" && git log origin/preview -1 --oneline
          echo "=== main HEAD ===" && git log origin/main -1 --oneline
          echo "=== Version ===" && node -e "console.log('v' + require('./package.json').version)"

      - name: Validate preview is release-ready
        run: |
          git checkout preview
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::Version $VERSION not found in CHANGELOG.md — update before releasing"
            exit 1
          fi
          echo "✅ Version $VERSION has CHANGELOG entry"

          # Verify no forbidden files on preview
          bash "$RUNNER_TEMP/squad_promote_guard.sh" verify-clean

      - name: Merge preview → main
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git checkout main
          git merge origin/preview --no-ff -m "chore: promote preview → main (v$(node -e "console.log(require('./package.json').version)"))"
          git push origin main
          echo "✅ Pushed main — squad-release.yml will tag and publish the release"

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."
