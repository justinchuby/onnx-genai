name: Miri

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/miri.yml
      - crates/onnx-runtime-ep-api/**
      - crates/onnx-runtime-ep-cpu/**
      - crates/onnx-runtime-session/**
      - crates/onnx-runtime-capi/**
      - crates/onnx-runtime-memory/**
      - crates/onnx-runtime-dlpack/**
  push:
    branches:
      - main
      - ci/**
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/miri.yml
      - crates/onnx-runtime-ep-api/**
      - crates/onnx-runtime-ep-cpu/**
      - crates/onnx-runtime-session/**
      - crates/onnx-runtime-capi/**
      - crates/onnx-runtime-memory/**
      - crates/onnx-runtime-dlpack/**
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

concurrency:
  # Match CI: PRs group by PR number, pushes by SHA; schedule/manual get a
  # separate suffix so scheduled drift checks cannot cancel or be cancelled by PRs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  miri:
    name: Miri unsafe-crate soundness
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install nightly Miri toolchain
        run: rustup toolchain install nightly --profile minimal --component miri

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      - name: Run Miri on tractable unsafe crates
        shell: bash
        run: |
          set -euo pipefail

          run_miri() {
            local label="$1"
            shift
            local start end
            start=$(date +%s)
            echo "::group::Miri: ${label}"
            "$@"
            end=$(date +%s)
            echo "MIRI_TIMING ${label}: $((end - start))s"
            echo "::endgroup::"
          }

          # Keep Stacked Borrows (Miri default) instead of Tree Borrows so the raw
          # pointer ownership checks stay maximally strict. Only ep-api/session/C
          # API tests that write temporary registry/model/sidecar files disable
          # isolation.
          run_miri "onnx-runtime-memory full" \
            cargo +nightly miri test --locked -p onnx-runtime-memory
          run_miri "onnx-runtime-dlpack full" \
            cargo +nightly miri test --locked -p onnx-runtime-dlpack

          # onnx-runtime-ep-api has Linux-only legacy plugin-loader tests that
          # compile and dlopen C fixtures; Miri cannot execute that native path.
          # Cover the pure Rust ABI/DeviceBuffer/registry/tensor/weight surfaces.
          run_miri "onnx-runtime-ep-api abi" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib abi::
          run_miri "onnx-runtime-ep-api epcontext" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib epcontext::
          run_miri "onnx-runtime-ep-api kernel" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib kernel::
          run_miri "onnx-runtime-ep-api provider" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib provider::tests
          run_miri "onnx-runtime-ep-api registry" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib registry::tests
          run_miri "onnx-runtime-ep-api tensor" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib tensor::tests
          run_miri "onnx-runtime-ep-api weight" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib weight::tests
          run_miri "onnx-runtime-ep-api mock EP integration" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --test mock_ep

          # onnx-runtime-ep-cpu has OS affinity and Rayon-heavy tests that are not
          # Miri-tractable. Cover the pure unsafe allocator, copy, dtype, and
          # strided-view surfaces directly instead of claiming full-crate coverage.
          #
          # The task runtime is the exception worth paying for: it is a lock-free
          # pool whose safety argument is a claim protocol over four atomics, and
          # Miri is the only tool here that checks that argument rather than the
          # code's behaviour on one machine. It needs isolation off because
          # `core_topology` reads sysfs, and it is slow (~5 min) because it runs
          # real threads under Stacked Borrows.
          run_miri "onnx-runtime-ep-cpu task runtime" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib task_runtime::

          # `-Zmiri-num-cpus` is load-bearing for aliasing coverage, not a
          # tuning knob. Miri reports `available_parallelism() == 1` by default,
          # so `resolve_width` gives a one-lane pool and every fan-out above
          # degrades to `Backend::Serial`: the step type-checks the unsafe
          # blocks but never runs two tasks against each other. That is how
          # #1377's whole-row retag passed a lane that claimed to cover this
          # module.
          #
          # Scoped to the single test that needs real concurrency rather than
          # applied to all of `task_runtime::`, because multi-CPU Miri
          # multiplies the runtime of the whole module and this module is
          # already the slowest step in the lane.
          #
          # Verified both ways: with the flag, widening the retag in that test
          # to the whole row reports "Data race detected between (1) retag write
          # ... and (2) retag write of type `[u64]`"; without it, the same bad
          # shape passes.
          #
          # `-Zmiri-ignore-leaks` is required *because* `-Zmiri-num-cpus=4`
          # works. The pool is a process-lifetime global whose workers park
          # rather than join, so once this test actually spawns them Miri's
          # exit check fails the step with "the main thread terminated without
          # waiting for all remaining threads" even though the test itself
          # passes. At the default one CPU this test returns early on its
          # `pool_width() < 2` guard and spawns nothing, which is why it only
          # started failing once the lane became load-bearing.
          #
          # The flag disables Miri's exit-time leak checks -- both the memory
          # leak checker and the remaining-threads check. It does not touch
          # data-race, aliasing, or validity detection, which run during
          # execution: with the flag set, widening the retag still reports the
          # data race above, so the falsifier is intact. Little is given up
          # here because the global pool is rooted in a `OnceLock` static and
          # so is never leak-reported anyway.
          #
          # This does not blind the lane to a broken `shutdown()`. The broad
          # `task_runtime::` step above runs without the flag and does spawn
          # real workers (`TaskPool::new(4)`/`new(8)` in `pool.rs`); it stays
          # green only because those are *local* pools that join on drop.
          run_miri "onnx-runtime-ep-cpu task runtime concurrent retag" \
            env MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-num-cpus=4 -Zmiri-ignore-leaks" cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib task_runtime::tests::concurrent_tasks_retag_only_their_own_range
          # The lib step above covers the pool's own unsafe. It does not cover
          # `tests/`, and that is the gap #1377 actually escaped through: every
          # other step in this lane is `--lib`, so an integration test could
          # carry undefined behaviour indefinitely without any lane compiling
          # it, let alone running it. This step closes that.
          #
          # Tree Borrows rather than Stacked Borrows because this test drives
          # the pool through Rayon, and `crossbeam-epoch` (Rayon's dependency)
          # violates Stacked Borrows in `internal.rs:562` -- a third-party
          # issue we cannot fix and should not suppress by skipping the test.
          # Tree Borrows still catches the defect this exists for, which is the
          # only thing that makes the substitution acceptable.
          #
          # `-Zmiri-ignore-leaks` because the task pool's workers are resident
          # by design and are still alive at exit; Miri otherwise fails the run
          # for "main thread terminated without waiting for all threads".
          #
          # The test is `#[ignore]`d (it is a measurement), so it needs
          # `--ignored`, and its constants shrink under `cfg(miri)` to keep the
          # aliasing shape at ~7s instead of the native measurement scale.
          #
          # Verified both ways: as written it reports `test result: ok`;
          # restoring #1377's whole-row retag reports "Undefined Behavior: Data
          # race detected between (1) non-atomic write on thread `nxrt-task-2`
          # and (2) retag read of type `[u64]` on thread `nxrt-task-0`".
          run_miri "onnx-runtime-ep-cpu task runtime nested dispatch (integration)" \
            env MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-num-cpus=4 -Zmiri-tree-borrows -Zmiri-ignore-leaks" cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --test task_runtime_latency -- --ignored nested_dispatch_slot_pressure
          run_miri "onnx-runtime-ep-cpu strided" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib strided::tests
          run_miri "onnx-runtime-ep-cpu provider" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib provider::tests
          run_miri "onnx-runtime-ep-cpu dtype" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib dtype::tests

          run_miri "onnx-runtime-session tensor" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib tensor::tests
          run_miri "onnx-runtime-session sequence" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib sequence::tests
          run_miri "onnx-runtime-session executor bounds" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib view_bounds
          run_miri "onnx-runtime-session executor checked sizes" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib checked_
          run_miri "onnx-runtime-session prefetch/device binding" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib prefetch
          run_miri "onnx-runtime-session persistent device binding" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib device_binding_tests

          run_miri "onnx-runtime-capi lib" \
            cargo +nightly miri test --locked -p onnx-runtime-capi --lib
          for filter in \
            accessors_reject_null_value_handle \
            create_tensor_wrong_byte_len_is_rejected \
            null_out_pointers_are_rejected \
            null_session_handle_is_invalid_argument_not_crash \
            release_is_null_tolerant \
            create_session_with_invalid_embed_mode_is_invalid_argument \
            create_session_with_unknown_option_is_invalid_argument \
            create_session_with_ep_context_options_succeeds
          do
            run_miri "onnx-runtime-capi ${filter}" \
              env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-capi --test capi "$filter"
          done
