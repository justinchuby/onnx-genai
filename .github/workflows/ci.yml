name: CI

on:
  push:
    branches:
      - main
      - ci/**
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Blocking, like the clippy gate below. The sweep this exception was
      # waiting on has landed, so an unformatted tree is now a failure rather
      # than a note nobody reads.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # A release publishes crates one at a time against crates.io, so one
      # listed before something it depends on fails partway through and leaves
      # the registry half-updated. Cheap to check here; expensive to discover
      # during a release.
      - name: Check publish order
        run: python3 scripts/check_publish_order.py

      - name: Check the profile table matches the samples
        run: python3 scripts/check_profile_table.py

      - name: Check platform-specific kernel files are named accordingly
        run: python3 scripts/check_platform_naming.py

      - name: Check dispatch branches have reachability tests
        run: python3 scripts/check_dispatch_reachability.py

      # Rust warnings are errors: clippy is blocking for every pure/offline crate.
      # To add a crate, first confirm its normal+dev dependency tree contains no
      # ort-sys/CUDA dependency, then add it here and to the portable test lane.
      # mlas-sys is Linux-only, which is fine in this ubuntu quality job.
      - name: Run clippy on all offline crates
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p mlas-sys
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-ir
          -p onnx-runtime-optimizer
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-quantization
          -p onnx-runtime-tracer
          -p onnx-runtime-session
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
          -- -D warnings

      # onnx-genai-engine's native decode path only compiles when this feature
      # is on. Without this step a refactor can leave it uncompilable while
      # every other job still passes -- which is exactly what happened when
      # native_decode.rs and engine.rs were split into module trees.
      - name: Check the native backend compiles
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-engine --features native-backend
          -- -D warnings

  rust-portable:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
          # Native GitHub-hosted Windows 11 ARM64 runner.
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          # macos-latest is the standard GitHub-hosted Apple Silicon runner.
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # rustc warnings are errors on every portable test build and the Windows
      # ARM64 clippy gate, including the Linux-only mlas-sys step below.
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade numpy onnxscript

      # Never replace these explicit packages with bare `cargo test` or
      # `--workspace`: that selects onnx-genai-ort-sys, whose build script
      # downloads a native ONNX Runtime distribution. Add a crate here only
      # after `cargo tree -p <crate> -e normal,dev` confirms no ort-sys,
      # onnx-runtime-ep-cuda, or cudarc dependency. CUDA tests stay compile-only
      # below because GitHub-hosted runners have no GPU.
      - name: Test cross-platform offline crates
        run: >-
          cargo test --locked
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python

      - name: Clippy Windows ARM64 offline crates
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: >-
          cargo clippy --locked --all-targets
          --target aarch64-pc-windows-msvc
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
          -- -D warnings

      # The vendored MLAS feasibility spike is offline, but its build script is
      # intentionally x86_64 Linux-only (GAS assembly and Linux headers).
      - name: Test Linux-only offline crates
        if: runner.os == 'Linux'
        run: cargo test --locked -p mlas-sys

  miri:
    name: Miri unsafe-crate soundness
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine whether Miri-relevant files changed
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
          else
            base=""
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base commit $base is unavailable; running Miri."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(Cargo\.toml|Cargo\.lock|\.github/workflows/ci\.yml|crates/(onnx-runtime-ep-api|onnx-runtime-ep-cpu|onnx-runtime-session|onnx-runtime-capi|onnx-runtime-memory|onnx-runtime-dlpack)/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Miri when unsafe-crate surface is unchanged
        if: steps.changes.outputs.run != 'true'
        run: echo "No Miri-covered crate, Cargo, or CI file changed; scheduled and main runs still execute the full Miri set."

      - name: Install nightly Miri toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install nightly --profile minimal --component miri

      - uses: actions/cache@v4
        if: steps.changes.outputs.run == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      - name: Run Miri on tractable unsafe crates
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          run_miri() {
            local label="$1"
            shift
            local start end
            start=$(date +%s)
            echo "::group::Miri: ${label}"
            "$@"
            end=$(date +%s)
            echo "MIRI_TIMING ${label}: $((end - start))s"
            echo "::endgroup::"
          }

          # Keep Stacked Borrows (Miri default) instead of Tree Borrows so the raw
          # pointer ownership checks stay maximally strict. Only session/C API
          # tests that write temporary plugin/model files disable isolation.
          run_miri "onnx-runtime-memory full" \
            cargo +nightly miri test --locked -p onnx-runtime-memory
          run_miri "onnx-runtime-dlpack full" \
            cargo +nightly miri test --locked -p onnx-runtime-dlpack
          # onnx-runtime-ep-api has Linux-only legacy plugin-loader tests that
          # compile and dlopen C fixtures; Miri cannot execute that native path.
          # Cover the pure Rust ABI/DeviceBuffer/registry/tensor/weight surfaces.
          run_miri "onnx-runtime-ep-api abi" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib abi::
          run_miri "onnx-runtime-ep-api epcontext" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib epcontext::
          run_miri "onnx-runtime-ep-api kernel" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib kernel::
          run_miri "onnx-runtime-ep-api provider" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib provider::tests
          run_miri "onnx-runtime-ep-api registry" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib registry::tests
          run_miri "onnx-runtime-ep-api tensor" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib tensor::tests
          run_miri "onnx-runtime-ep-api weight" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --lib weight::tests
          run_miri "onnx-runtime-ep-api mock EP integration" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-api --test mock_ep

          # onnx-runtime-ep-cpu has OS affinity and Rayon-heavy tests that are not
          # Miri-tractable. Cover the pure unsafe allocator, copy, dtype, and
          # strided-view surfaces directly instead of claiming full-crate coverage.
          run_miri "onnx-runtime-ep-cpu strided" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib strided::tests
          run_miri "onnx-runtime-ep-cpu provider" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib provider::tests
          run_miri "onnx-runtime-ep-cpu dtype" \
            cargo +nightly miri test --locked -p onnx-runtime-ep-cpu --lib dtype::tests

          run_miri "onnx-runtime-session tensor" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib tensor::tests
          run_miri "onnx-runtime-session sequence" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib sequence::tests
          run_miri "onnx-runtime-session executor bounds" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib view_bounds
          run_miri "onnx-runtime-session executor checked sizes" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib checked_
          run_miri "onnx-runtime-session prefetch/device binding" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib prefetch
          run_miri "onnx-runtime-session persistent device binding" \
            env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-session --lib device_binding_tests

          run_miri "onnx-runtime-capi lib" \
            cargo +nightly miri test --locked -p onnx-runtime-capi --lib
          for filter in \
            accessors_reject_null_value_handle \
            create_tensor_wrong_byte_len_is_rejected \
            null_out_pointers_are_rejected \
            null_session_handle_is_invalid_argument_not_crash \
            release_is_null_tolerant \
            create_session_with_invalid_embed_mode_is_invalid_argument \
            create_session_with_unknown_option_is_invalid_argument \
            create_session_with_ep_context_options_succeeds
          do
            run_miri "onnx-runtime-capi ${filter}" \
              env MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test --locked -p onnx-runtime-capi --test capi "$filter"
          done

  cli-ort:
    name: CLI ORT coverage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux bindgen dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) {
            "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          }

      # The portable lane must stay offline, but the CLI is the user-facing ORT
      # entry point and its REPL contract tests catch token-budget regressions.
      # Keep this isolated so the native ORT download is intentional, pinned by
      # ort-sys checksums, and paid only by the crate that needs it.
      - name: Build onnx-genai-cli
        run: cargo build --locked -p onnx-genai-cli
      - name: Expose downloaded ORT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ort = Get-ChildItem -Path target\debug\build -Recurse -Filter onnxruntime.dll |
            Where-Object { $_.FullName -like '*ort-prebuilt*' } |
            Select-Object -First 1
          if (-not $ort) {
            throw 'onnx-genai-ort-sys did not leave a downloaded onnxruntime.dll under target\debug\build'
          }
          Copy-Item $ort.FullName target\debug\onnxruntime.dll -Force
          Copy-Item $ort.FullName target\debug\deps\onnxruntime.dll -Force
          $ort.DirectoryName >> $env:GITHUB_PATH
      - name: Test onnx-genai-cli
        run: cargo test --locked -p onnx-genai-cli
      - name: Clippy onnx-genai-cli
        run: cargo clippy --locked -p onnx-genai-cli --all-targets -- -D warnings

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade numpy onnxscript
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect Rust coverage
        run: >-
          cargo llvm-cov --locked --codecov --output-path codecov.json
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p mlas-sys
          -p onnx-runtime-loader
          -p onnx-std
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  cuda-compile:
    name: CUDA compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CUDA uses dynamic loading, so compile coverage needs no GPU or toolkit,
      # but ep-cuda tests require a CUDA runtime/GPU and must not join the
      # portable test lane. This lane intentionally excludes macOS, where CUDA
      # is unsupported. ORT-linked crates also stay out of portable tests because
      # onnx-genai-ort-sys downloads native ORT; onnx-runtime-python's feature
      # check here provides compile coverage for that integration path.
      - name: Check CUDA execution provider and Python feature
        run: >-
          cargo check --locked
          -p onnx-runtime-ep-cuda
          -p onnx-runtime-python
          --features onnx-runtime-python/cuda

      - name: Clippy CUDA execution provider
        run: cargo clippy -p onnx-runtime-ep-cuda --features cuda -- -D warnings
