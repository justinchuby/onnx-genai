name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Keep CI on Rust stable deliberately: this follows Rust's stability promise
      # without freezing security fixes; the cache key records the resolved rustc release.
      - name: Install Rust stable toolchain
        id: rust-toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Keep the key to OS + rustc release + Cargo.lock.
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-

      # Blocking, like the clippy gate below. The sweep this exception was
      # waiting on has landed, so an unformatted tree is now a failure rather
      # than a note nobody reads.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # A release publishes crates one at a time against crates.io, so one
      # listed before something it depends on fails partway through and leaves
      # the registry half-updated. Cheap to check here; expensive to discover
      # during a release.
      - name: Check publish order
        run: python3 scripts/check_publish_order.py

      - name: Check the profile table matches the samples
        run: python3 scripts/check_profile_table.py

      - name: Check platform-specific kernel files are named accordingly
        run: python3 scripts/check_platform_naming.py

      # Rust warnings are errors: clippy is blocking for every pure/offline crate.
      # To add a crate, first confirm its normal+dev dependency tree contains no
      # ort-sys/CUDA dependency, then add it here and to the portable test lane.
      # mlas-sys is Linux-only, which is fine in this ubuntu quality job.
      - name: Run clippy on all offline crates
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p mlas-sys
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-ir
          -p onnx-runtime-optimizer
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-quantization
          -p onnx-runtime-tracer
          -p onnx-runtime-session
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
          -- -D warnings

      # onnx-genai-engine's native decode path only compiles when this feature
      # is on. Without this step a refactor can leave it uncompilable while
      # every other job still passes -- which is exactly what happened when
      # native_decode.rs and engine.rs were split into module trees.
      - name: Check the native backend compiles
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-engine --features native-backend
          -- -D warnings

  rust-portable:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
          # Native GitHub-hosted Windows 11 ARM64 runner.
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          # macos-latest is the standard GitHub-hosted Apple Silicon runner.
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # rustc warnings are errors on every portable test build and the Windows
      # ARM64 clippy gate, including the Linux-only mlas-sys step below.
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Keep CI on Rust stable deliberately: this follows Rust's stability promise
      # without freezing security fixes; the cache key records the resolved rustc release.
      - name: Install Rust stable toolchain
        id: rust-toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default stable
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Keep the key to OS + rustc release + Cargo.lock.
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade numpy onnxscript
      # Installing from crates.io avoids the personally-owned install action;
      # cargo install costs build minutes but keeps provenance in Cargo.lock-style resolution.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      # Never replace these explicit packages with bare `cargo test` or
      # `--workspace`: that selects onnx-genai-ort-sys, whose build script
      # downloads a native ONNX Runtime distribution. Add a crate here only
      # after `cargo tree -p <crate> -e normal,dev` confirms no ort-sys,
      # onnx-runtime-ep-cuda, or cudarc dependency. CUDA tests stay compile-only
      # below because GitHub-hosted runners have no GPU.
      - name: Test cross-platform offline crates with coverage
        run: >-
          cargo llvm-cov --locked --codecov --output-path codecov-offline.json
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python

      - name: Upload offline coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: codecov-offline.json
          flags: offline
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Clippy Windows ARM64 offline crates
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: >-
          cargo clippy --locked --all-targets
          --target aarch64-pc-windows-msvc
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
          -- -D warnings

      # The vendored MLAS feasibility spike is offline, but its build script is
      # intentionally x86_64 Linux-only (GAS assembly and Linux headers).
      - name: Test Linux-only offline crates with coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --locked --codecov --output-path codecov-mlas.json -p mlas-sys

      - name: Upload MLAS coverage to Codecov
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: codecov-mlas.json
          flags: mlas
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  cli-ort:
    name: CLI ORT coverage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            coverage_flag: cli-ort-linux
          - name: Windows x86_64
            os: windows-latest
            coverage_flag: cli-ort-windows
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Keep CI on Rust stable deliberately: this follows Rust's stability promise
      # without freezing security fixes; the cache key records the resolved rustc release.
      - name: Install Rust stable toolchain
        id: rust-toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default stable
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Keep the key to OS + rustc release + Cargo.lock.
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-
      - name: Install Linux bindgen dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) {
            "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          }
      # Installing from crates.io avoids the personally-owned install action;
      # cargo install costs build minutes but keeps provenance in Cargo.lock-style resolution.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      # The portable lane must stay offline, but the CLI is the user-facing ORT
      # entry point and its REPL contract tests catch token-budget regressions.
      # Keep this isolated so the native ORT download is intentional, pinned by
      # ort-sys checksums, and paid only by the crate that needs it.
      - name: Build onnx-genai-cli
        run: cargo build --locked -p onnx-genai-cli
      - name: Expose downloaded ORT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ort = Get-ChildItem -Path target\debug\build -Recurse -Filter onnxruntime.dll |
            Where-Object { $_.FullName -like '*ort-prebuilt*' } |
            Select-Object -First 1
          if (-not $ort) {
            throw 'onnx-genai-ort-sys did not leave a downloaded onnxruntime.dll under target\debug\build'
          }
          Copy-Item $ort.FullName target\debug\onnxruntime.dll -Force
          Copy-Item $ort.FullName target\debug\deps\onnxruntime.dll -Force
          # cargo-llvm-cov may use its own target directory; pre-stage the same ORT DLL
          # there and run coverage with --no-clean so it is not removed before tests.
          New-Item -ItemType Directory -Force target\llvm-cov-target\debug\deps | Out-Null
          Copy-Item $ort.FullName target\llvm-cov-target\debug\onnxruntime.dll -Force
          Copy-Item $ort.FullName target\llvm-cov-target\debug\deps\onnxruntime.dll -Force
          $ort.DirectoryName >> $env:GITHUB_PATH
      - name: Test onnx-genai-cli with coverage
        run: cargo llvm-cov --locked --no-clean --codecov --output-path codecov-cli-ort.json -p onnx-genai-cli
      - name: Upload CLI ORT coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: codecov-cli-ort.json
          flags: ${{ matrix.coverage_flag }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Clippy onnx-genai-cli
        run: cargo clippy --locked -p onnx-genai-cli --all-targets -- -D warnings

  cuda-compile:
    name: CUDA compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Keep CI on Rust stable deliberately: this follows Rust's stability promise
      # without freezing security fixes; the cache key records the resolved rustc release.
      - name: Install Rust stable toolchain
        id: rust-toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Keep the key to OS + rustc release + Cargo.lock.
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-

      # CUDA uses dynamic loading, so compile coverage needs no GPU or toolkit,
      # but ep-cuda tests require a CUDA runtime/GPU and must not join the
      # portable test lane. This lane intentionally excludes macOS, where CUDA
      # is unsupported. ORT-linked crates also stay out of portable tests because
      # onnx-genai-ort-sys downloads native ORT; onnx-runtime-python's feature
      # check here provides compile coverage for that integration path.
      - name: Check CUDA execution provider and Python feature
        run: >-
          cargo check --locked
          -p onnx-runtime-ep-cuda
          -p onnx-runtime-python
          --features onnx-runtime-python/cuda

      - name: Clippy CUDA execution provider
        run: cargo clippy -p onnx-runtime-ep-cuda --features cuda -- -D warnings
