# CI deliberately runs tests on every platform on every PR, main push, nightly
# schedule, and manual dispatch. Coverage instrumentation runs where it is
# informative; Windows ARM64 keeps platform tests but skips coverage because the
# coverage signal duplicates x64/macOS while owning the critical path.
#
# `changes` classifies whether a pull_request/push touched anything other than
# docs/wiki content. When it did not, every Rust job below is skipped
# rather than run. GitHub reports a skipped job with conclusion "skipped",
# which counts as passing for required status checks (unlike a workflow that
# never triggers at all, which would leave a required check pending forever)
# -- see https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
# So "Fast (Linux x86_64)" and "Rust quality" -- the two required checks --
# still report a conclusion on every PR, just without doing the expensive
# work when nothing but docs changed. Schedule and workflow_dispatch runs get
# full CI: `changes` runs for them too and leaves docs_only=false, because it
# only diffs for pull_request and push. (It must run for them -- see the note
# on the job itself.)
name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    # This job must run for *every* event. It used to be gated on
    # `github.event_name == 'pull_request' || github.event_name == 'push'`,
    # with a comment claiming schedule and workflow_dispatch runs would skip
    # only this job and still get full CI. That was wrong: every job below is
    # `needs: changes` with a plain `if:` (no `always()`/`!cancelled()`), and
    # GitHub skips a job whose `needs` dependency was skipped, whatever its
    # own `if:` says. So gating this job skipped the entire workflow -- which
    # silently made both the nightly `schedule` and `workflow_dispatch` no-ops
    # that reported success without running a single check.
    #
    # There is nothing to gate on anyway: the classify step below only diffs
    # for pull_request and push, and leaves docs_only=false for every other
    # event, so schedule and workflow_dispatch get full CI by construction.
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify docs-only vs. code changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Defaults to docs_only=false (full CI) on any ambiguity: unknown
          # event, missing SHAs, an unusable diff range, or an empty diff.
          # Only an explicit, fully-classified all-docs diff flips it to true.
          docs_only=false

          is_docs_path() {
            case "$1" in
              docs/*|wiki/*|*.md|*.mdx|*.markdown|LICENSE|NOTICE)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }

          files=""
          case "$EVENT_NAME" in
            pull_request)
              if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
                files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
              fi
              ;;
            push)
              if [ -n "${BEFORE_SHA:-}" ] \
                && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null || true)"
              fi
              ;;
          esac

          if [ -n "$files" ]; then
            docs_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! is_docs_path "$f"; then
                docs_only=false
                break
              fi
            done <<< "$files"
          fi

          echo "Changed files ($EVENT_NAME):"
          echo "$files"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  fast-linux:
    name: Fast (Linux x86_64)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      # This lane runs `onnx-runtime-ep-cpu`'s placement falsifiers, so the
      # absence of what they need -- two physical cores, and a kernel that
      # accepts `sched_setaffinity` -- is a defect here rather than a fact about
      # somebody's laptop. Same shape as `NXRT_REQUIRE_ORT_TESTS` on `cli-ort`.
      # Deliberately unset elsewhere, so a contributor inside a 1-core container
      # still gets a stated skip instead of a red suite.
      NXRT_REQUIRE_PLACEMENT_TESTS: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          # The toolchain, and its components, come from rust-toolchain.toml so CI
          # and contributors resolve the same rustc. See that file for why.
          rustup toolchain install
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      - name: Resolve cargo cache target
        id: cache-target
        shell: bash
        run: |
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-cargo-registry-
      - name: Cache fast cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-fast-rust-${{ steps.rust-toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-fast-rust-${{ steps.rust-toolchain.outputs.version }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade numpy onnxscript
      - name: Native benchmark harness self-test
        # Needs no GPU, no CUDA toolkit and no runtime package, but it does need
        # numpy: the defect it guards is a numpy array compared against a list,
        # so a lane without numpy would skip the only cases that catch it.
        run: python scripts/benchmark_muse_native_local.py --self-test --require-numpy
      - name: Check formatting
        run: cargo fmt --all -- --check
      # This lane builds a subset of the workspace, so only that subset's
      # packages land in the registry cache. The MLAS-free merge gate in
      # onnx-runtime-ep-cpu-plugin asks `cargo metadata --offline` for the
      # *whole* workspace resolve, and fails loud rather than skipping when it
      # cannot read one — so a package no built crate happens to need (via
      # tokenizers, say) turns that gate red for a reason unrelated to MLAS.
      # Fetching the locked graph first keeps the gate hermetic and honest.
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Build Linux offline crates
        run: >-
          cargo build --locked
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p mlas-sys
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory -p onnx-runtime-virtual-memory -p onnx-runtime-memory-api -p onnx-runtime-memory-governor -p onnx-runtime-cuda-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
      # `profile_native` is the tool every decode benchmark in docs/benchmarks
      # is produced with, and nothing else in CI compiles it: the `-p` list
      # above does not reach a bin that needs `--features bench-native`, and
      # `benchmark.yml` only runs `--bench no_model` / `--bench model`. So an
      # engine API change breaks it silently and it is discovered by hand, which
      # is exactly what happened in #1878. Building (not running) it is cheap
      # and closes that gap.
      - name: Build the native profiling bin
        run: >-
          cargo build --locked
          -p onnx-genai-bench --features bench-native --bin profile_native
      - name: Test Linux offline crates
        run: >-
          cargo test --locked
          $(python .github/scripts/workspace_test_packages.py cargo-args offline-linux)
      - name: Clippy Linux offline crates
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p mlas-sys
          -p onnx-runtime-ir
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-optimizer
          -p onnx-runtime-quantization
          -p onnx-runtime-session
          -p onnx-runtime-tracer
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory -p onnx-runtime-virtual-memory -p onnx-runtime-memory-api -p onnx-runtime-memory-governor -p onnx-runtime-cuda-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
          -- -D warnings

  rust-quality:
    name: Rust quality
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The Rust toolchain is pinned in rust-toolchain.toml so a runner image
      # rolling forward cannot turn `-D warnings` red with no commit to blame,
      # and so a contributor sees the same lints CI does. The cache key still
      # records the resolved rustc release. See rust-toolchain.toml for why.
      - name: Install the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          # The toolchain, and its components, come from rust-toolchain.toml so CI
          # and contributors resolve the same rustc. See that file for why.
          rustup toolchain install
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Include OS, runner arch, actual target triple,
      # rustc release, cargo tool versions, and Cargo.lock so multi-arch runners
      # never restore each other's target/ or ~/.cargo/bin artifacts.
      - name: Resolve cargo cache target
        id: cache-target
        shell: bash
        run: |
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-

      # Blocking, like the clippy gate below. The sweep this exception was
      # waiting on has landed, so an unformatted tree is now a failure rather
      # than a note nobody reads.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # A release publishes crates one at a time against crates.io, so one
      # listed before something it depends on fails partway through and leaves
      # the registry half-updated. Cheap to check here; expensive to discover
      # during a release.
      - name: Check publish order
        run: python3 scripts/check_publish_order.py

      - name: Verify workspace test package coverage
        run: python .github/scripts/workspace_test_packages.py verify

      # `verify` above answers "is every crate in *some* lane", which stayed
      # green all the while six crates sat in a lane no ruleset enforces. This
      # answers the question that actually gates a merge: does a *required*
      # status check run them. #1982 put a failing `shape_dispatch_gate` on
      # `main` with both required checks green; #2015 is the general case.
      - name: Verify every workspace crate is tested by a required lane
        run: python .github/scripts/workspace_test_packages.py verify-required-tier

      # Both gates above are the kind that pass by seeing nothing, so each one
      # is asked to fail on demand and is judged on what it *names*, not on its
      # exit status: `python` missing exits 127 and every SystemExit in that
      # script exits 1, so a status alone cannot separate a verdict from a
      # crash. The first draft of this step was a shell `if` and did exactly
      # that -- it reported both gates as refusing while neither had run.
      # `--simulate-missing` had shipped with no caller since it was written.
      - name: Workspace test package gates can still detect (self-test)
        run: python .github/scripts/workspace_test_packages.py self-test

      - name: Check the profile table matches the samples
        run: python3 scripts/check_profile_table.py

      - name: Check platform-specific kernel files are named accordingly
        run: python3 scripts/check_platform_naming.py

      - name: Check dispatch branches have reachability tests
        run: python3 scripts/check_dispatch_reachability.py

      - name: Check dispatch manifest lint can still detect (self-test)
        run: python3 scripts/check_dispatch_manifest.py --self-test

      - name: Check dispatch manifest claims have proving counters
        run: python3 scripts/check_dispatch_manifest.py

      # Commands written into scripts and runbooks are never executed, so a
      # renamed feature or a deleted binary rots there indefinitely and only
      # surfaces when someone copies the line and blames their environment.
      - name: Check documented command lint can still detect (self-test)
        run: python3 scripts/check_documented_commands.py --self-test

      - name: Check documented cargo commands still resolve
        run: python3 scripts/check_documented_commands.py

      - name: Check feature-gated fast paths have fallback coverage
        run: python3 scripts/check_feature_gate_coverage.py

      # A documented environment variable that nothing parses produces no error
      # and no effect, so the mistake survives indefinitely. `device_policy`
      # went months that way (#678). This makes the gap a CI failure.
      - name: Check documented environment variables are implemented
        run: python3 .github/scripts/verify_documented_env_vars.py

      # A `#[test]` added to a CUDA target without an ignore runs on every
      # machine that has no GPU. The authoritative check for this is
      # verify_cuda_test_honesty.py, but it needs two full CUDA test builds and
      # so runs only on the CUDA lane -- which means an author learns about it
      # after merge, and only if that lane is green enough to be believed. It
      # was not: five such tests landed in three days (#1875, #1881, #1911,
      # #1909), each one reported by a lane already red for another reason.
      # This is the same rule read off the source in under a second, with no
      # CUDA toolchain, so every pull request gets the signal. It supplements
      # the inventory check and does not replace it -- it cannot see
      # macro-expanded tests, nor inventory parity between feature configs.
      #
      # The scan covers both halves of the class. The half above is loud: the
      # test runs and the lane reds. The other half is silent -- a `cfg` on
      # `gpu-tests` (on the test, on its `mod`, on the whole target, or as
      # manifest `required-features`) deletes the test from the base-config
      # inventory, so the lane is green because the tests are not there. #1927
      # lost thirteen that way and nothing reported it.
      - name: Check CUDA test source scan can still detect (self-test)
        run: python3 .github/scripts/verify_cuda_test_honesty.py --self-test

      - name: Check CUDA tests are ignored, not deleted by a cfg
        run: python3 .github/scripts/verify_cuda_test_honesty.py --source-scan

      # Rust warnings are errors: clippy is blocking for every pure/offline crate.
      # To add a crate, first confirm its normal+dev dependency tree contains no
      # ort-sys/CUDA dependency, then add it here and to the portable test lane.
      # mlas-sys is also checked by the Windows ARM64 job so MSVC/native
      # build-script regressions do not hide behind the Linux quality lane.
      - name: Run clippy on all offline crates
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-comfyui-config
          -p onnx-genai-metadata
          -p onnx-genai-genai-config
          -p onnx-genai-kv
          -p onnx-genai-runtime-config
          -p onnx-genai-scheduler
          -p onnx-runtime-protocol-trace
          -p mlas-sys
          -p onnx-runtime-ep-api
          -p onnx-runtime-ep-cpu
          -p onnx-runtime-ir
          -p onnx-runtime-optimizer
          -p onnx-runtime-loader
          -p onnx-runtime-shape-inference
          -p onnx-runtime-quantization
          -p onnx-runtime-tracer
          -p onnx-runtime-session
          -p onnx-genai-preprocess
          -p onnx-std
          -p onnx-genai-router
          -p onnx-runtime-memory -p onnx-runtime-virtual-memory -p onnx-runtime-memory-api -p onnx-runtime-memory-governor -p onnx-runtime-cuda-memory
          -p onnx-runtime-cpuinfo
          -p onnx-runtime-eager
          -p onnx-runtime-capi
          -p onnx-runtime-dlpack
          -p onnx-runtime-comm
          -p onnx-std-python
          -- -D warnings

      # Wrapped in `run_test_step` because the selector is a bare test NAME,
      # which libtest does not police: an exact-name filter that matches nothing
      # prints `ok. 0 passed` and exits 0. This step selects exactly one test,
      # so a rename retires it silently. #2055.
      - name: Check CPU EP MLAS-only feature configuration
        run: |
          # shellcheck source=scripts/test_step.sh
          . ./scripts/test_step.sh
          run_test_step "MLAS-only feature configuration" \
            cargo test --locked \
            -p onnx-runtime-ep-cpu \
            --no-default-features \
            --features mlas \
            optimization_registry_excludes_nchwc_without_cnn_ops

      # The MoE grouped driver hands several `*mut f32` out of one `&mut [f32]`
      # to `MlasGemmBatch`, and its bit-exactness falsifiers are the only thing
      # standing between a wrong batch offset and silently wrong logits.  Under
      # the default feature set those tests compile the non-MLAS fallback, so
      # the path that actually ships was going untested.  This runs them against
      # the real MLAS batched GEMM.
      # Guarded for the same reason (#2055), and this one matters most: the
      # filter is a MODULE PATH, so moving or renaming the module -- not just a
      # test -- empties it. Measured on this repo, `kernels::moe_renamed::`
      # reports `ok. 0 passed` and exits 0.
      - name: CPU EP MoE tests against real MLAS
        run: |
          # shellcheck source=scripts/test_step.sh
          . ./scripts/test_step.sh
          run_test_step "CPU EP MoE against real MLAS" \
            cargo test --locked \
            -p onnx-runtime-ep-cpu \
            --no-default-features \
            --features mlas \
            kernels::moe::

      # QLinearMatMul requantizes inside MLAS through the same output processor
      # ORT uses, and the tests that pin that fused path bit-for-bit against the
      # scalar loop only exist under `--features mlas`.  Nothing else in the
      # pipeline runs them: the coverage lane builds this crate without MLAS and
      # the ORT lane tests the plugin crate, not these unit tests.
      # Guarded for the same reason (#2055): module-path filter, and this is
      # the only place the fused MLAS requantize path is tested at all.
      - name: CPU EP QLinearMatMul tests against real MLAS
        run: |
          # shellcheck source=scripts/test_step.sh
          . ./scripts/test_step.sh
          run_test_step "CPU EP QLinearMatMul against real MLAS" \
            cargo test --locked \
            -p onnx-runtime-ep-cpu \
            --no-default-features \
            --features mlas \
            kernels::qlinear_matmul::

      # x86_64-apple-darwin changes target_arch but leaves target_os="macos",
      # so cfg(target_os) errors are invisible.  This step uses a genuine Linux
      # target that exercises BOTH dimensions.  PR #317 proved the gap.
      # The script also runs a second pass against aarch64-unknown-linux-gnu:
      # every other blocking lane builds target_arch="x86_64", so items that
      # are only reachable from cfg(target_arch="x86_64") code look live in all
      # of them and are dead code on ARM64 (#1037 broke both ARM64 lanes that
      # way).  That pass needs a real cross toolchain, not just a rustup
      # target: ort-sys runs bindgen for the target, so clang needs arm64 libc
      # headers, and onnx-runtime-cpuinfo's cmake build script compiles C for
      # the target.  Without them the script hard-fails on CI rather than
      # quietly checking a subset that excludes onnx-runtime-ep-cpu.
      - name: Install the aarch64 cross toolchain for the cross-arch pass
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      # The gate's submodule precondition, tested against fixture repository
      # roots with cargo/rustup shimmed -- about a second, and it is the only
      # thing that proves the check refuses BEFORE spending a clippy run rather
      # than after one. One of its cells runs the gate against this checkout,
      # so a precondition that started rejecting correct trees fails here
      # instead of on every developer's box. #1816.
      - name: Cross-compile gate preconditions (self-test)
        run: |
          shellcheck scripts/check_cross_compile.sh scripts/check_cross_compile_test.sh
          bash scripts/check_cross_compile_test.sh
      - name: Cross-target compile check (catches os- and arch-gating errors)
        run: bash scripts/check_cross_compile.sh

      # The merge gate is the one script whose failure mode is a green report:
      # if it ever treats an absent required check as a passing one, nothing
      # downstream notices, because the evidence it was supposed to collect is
      # exactly what is missing. Its suite is hermetic (`gh` is shimmed), so it
      # costs a second here and refuses to merge anything. #1966.
      - name: Merge gate can still refuse (self-test)
        run: |
          shellcheck scripts/merge_when_green.sh scripts/merge_when_green_test.sh
          bash scripts/merge_when_green_test.sh

      # The Miri lane and the three MLAS steps above select tests by name, and
      # libtest exits 0 on a filter that matches nothing -- so a renamed test
      # turns its step into a no-op that reports `ok`. `run_miri` and
      # `run_test_step` refuse that, and this suite is what proves they still
      # refuse, including a negative control that reproduces the pre-guard
      # behaviour. Hermetic (no cargo, no Miri), well under a second. Runs here
      # rather than in miri.yml so it is covered by a required lane instead of
      # by the lane it guards.
      - name: Test step wrapper still refuses an empty filter (self-test)
        run: |
          shellcheck scripts/test_step.sh scripts/test_step_test.sh
          bash scripts/test_step_test.sh

      # onnx-genai-engine's native decode path only compiles when this feature
      # is on. Without this step a refactor can leave it uncompilable while
      # every other job still passes -- which is exactly what happened when
      # native_decode.rs and engine.rs were split into module trees.
      #
      # onnx-genai-server was added after the same thing happened to it: a
      # `#[cfg(feature = "native-backend")]` test in `onnx-genai-server/src/tests.rs`
      # called `EngineDriver::generate` with the arity it had before a third
      # parameter was added, and `main` sat uncompilable under this feature while
      # Fast, Rust quality and every coverage lane stayed green (#1944). This
      # step covered only the engine crate, so the one place that would have
      # noticed did not look. The only job that did compile it is `CLI ORT`,
      # which is slow and has been red for unrelated reasons.
      - name: Check the native backend compiles
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-engine -p onnx-genai-server
          --features onnx-genai-engine/native-backend,onnx-genai-server/native-backend
          -- -D warnings

      # The mirror image of the step above, and the other half of the same hole.
      # That one turns the feature *on*, and it is the only `-D warnings` gate in
      # this file that names these crates -- `Run clippy on all offline crates`
      # cannot list them because they pull in `ort-sys`, and `CLI ORT`'s clippy
      # steps name `onnx-genai-cli`, so `-D warnings` does not reach a dependency
      # and dependencies do not build test targets anyway.
      #
      # So the *default* configuration of both crates was compiled by
      # `Test ORT-backed workspace crates` and linted by nothing. Measured, not
      # assumed: #1964 merged with `warning: function `test_session_decoder_runtime`
      # is never used` in a green `CLI ORT` log. That warning was harmless; a real
      # unused-code defect at default features has exactly the same signature and
      # the same fate, in a log only read once something else has already failed.
      #
      # Most of this is cache-warm from the step above, which shares the whole
      # dependency graph minus the feature. Both configurations are checked
      # separately rather than as a union, because default is what ships.
      - name: Check the default features compile clean
        run: >-
          cargo clippy --locked --all-targets
          -p onnx-genai-engine -p onnx-genai-server
          -- -D warnings

      # onnx-genai, -capi, -cli, -engine, -ort and -server were executed by no
      # required status check: `Fast (Linux x86_64)` derives its set as
      # everything *minus* these (they pull the ort-sys download), the test
      # steps above are all `-p onnx-runtime-ep-cpu`, and `CLI ORT` -- the only
      # lane that ran them -- is advisory. That is how #1982 landed a red
      # `shape_dispatch_gate` on `main` with every required check green, and it
      # left the server admission tests unenforced too. #2015.
      #
      # This is the same execution `CLI ORT (Linux x86_64)` used to perform,
      # moved rather than duplicated: that step is now Windows-only, so the
      # tests run on exactly the same platforms as before, one of them now
      # under a check that can actually block a merge. The two clippy steps
      # above already build this graph `--all-targets`, ORT download included,
      # so what is added here is codegen, linking and the run itself.
      #
      # NXRT_REQUIRE_ORT_TESTS mirrors the `CLI ORT` job env. No test in these
      # six crates reads it today; it is set so that the first one that does
      # cannot silently skip here after passing there.
      #
      # Serialized for the reason the `CLI ORT` step was: several integration
      # tests select sessions through process-wide environment variables.
      - name: Test ORT-backed workspace crates
        env:
          NXRT_REQUIRE_ORT_TESTS: "1"
        run: >-
          cargo test --locked
          $(python .github/scripts/workspace_test_packages.py cargo-args ort-backed)
          -- --test-threads=1

      # No shipped artifact links MLAS: the wheel builds it only when someone
      # opts in with NXRT_EP_CPU_RESEARCH_MLAS=1 on one of the platforms in
      # python/nxrt-ep-cpu/setup.py: MLAS_TARGETS, and release automation never
      # sets it. This lane is the only place the vendored C++/asm is compiled,
      # so it is what keeps the research reference usable -- a differential
      # measurement you cannot build is a measurement you do not have.
      - name: Build the CPU plugin cdylib with the MLAS research reference
        run: cargo build --locked -p onnx-runtime-ep-cpu-plugin --features mlas

  rust-coverage:
    name: Rust coverage (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            require_placement: "1"
          - name: Windows x86_64
            os: windows-latest
            require_placement: "1"
          - name: macOS arm64
            os: macos-latest
            # macOS has no thread-to-core affinity API, so placement is
            # unanswerable there by construction. Requiring it could only ever
            # produce a false failure, which is why the guard asserts the
            # affinity backend exists before asserting anything about cores.
            require_placement: ""
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      NXRT_REQUIRE_PLACEMENT_TESTS: ${{ matrix.require_placement }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          # The toolchain, and its components, come from rust-toolchain.toml so CI
          # and contributors resolve the same rustc. See that file for why.
          rustup toolchain install
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      - name: Resolve cargo cache target
        id: cache-target
        shell: bash
        run: |
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-cargo-registry-
      - name: Cache coverage cargo target and tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-coverage-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-coverage-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade numpy onnxscript
      - name: Install cargo-llvm-cov
        shell: bash
        run: |
          if cargo llvm-cov --version 2>/dev/null | grep -q "$CARGO_LLVM_COV_VERSION"; then
            echo "cargo-llvm-cov $CARGO_LLVM_COV_VERSION already installed"
          else
            cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked --force
          fi
      # Same reason as the fast-linux lane: the MLAS-free gate reads the whole
      # workspace resolve with `cargo metadata --offline`, so every package in
      # the lockfile has to be present before the subset build starts.
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      # Never replace these explicit packages with bare `cargo test` or
      # `--workspace`: that selects onnx-genai-ort-sys, whose build script
      # downloads a native ONNX Runtime distribution. The package list is
      # derived from cargo metadata and the commented deny-list in
      # `.github/scripts/workspace_test_packages.py`, so new offline workspace
      # crates are tested by default.
      # No shipped artifact links MLAS: the wheel builds it only when someone
      # opts in with NXRT_EP_CPU_RESEARCH_MLAS=1 on one of the platforms in
      # python/nxrt-ep-cpu/setup.py: MLAS_TARGETS, and release automation never
      # sets it. This lane is the only place the vendored C++/asm is compiled,
      # so it is what keeps the research reference usable -- a differential
      # measurement you cannot build is a measurement you do not have.
      - name: Build the CPU plugin cdylib with the MLAS research reference
        if: runner.os != 'Linux'
        run: cargo build --locked -p onnx-runtime-ep-cpu-plugin --features mlas

      - name: Test cross-platform offline crates with coverage
        run: >-
          cargo llvm-cov --locked --codecov --output-path codecov-offline.json
          $(python .github/scripts/workspace_test_packages.py cargo-args offline-cross-platform)
      - name: Upload offline coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: codecov-offline.json
          flags: offline
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      # Keep MLAS coverage on Linux; the Windows ARM64 lane below separately
      # validates that the native build script stays MSVC-compatible.
      - name: Test Linux-only offline crates with coverage
        if: runner.os == 'Linux'
        run: >-
          cargo llvm-cov --locked --codecov --output-path codecov-mlas.json
          $(python .github/scripts/workspace_test_packages.py cargo-args linux-only)
      - name: Upload MLAS coverage to Codecov
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: codecov-mlas.json
          flags: mlas
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  rust-windows-arm64:
    name: Rust (Windows ARM64)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-11-arm
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      CMAKE_GENERATOR: "Visual Studio 17 2022"
