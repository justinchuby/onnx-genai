  cli-ort:
    name: CLI ORT (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            coverage_flag: cli-ort-linux
          - name: Windows x86_64
            os: windows-latest
            coverage_flag: cli-ort-windows
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      NXRT_REQUIRE_ORT_TESTS: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The Rust toolchain is pinned in rust-toolchain.toml so a runner image
      # rolling forward cannot turn `-D warnings` red with no commit to blame,
      # and so a contributor sees the same lints CI does. The cache key still
      # records the resolved rustc release. See rust-toolchain.toml for why.
      - name: Install the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          # The toolchain, and its components, come from rust-toolchain.toml so CI
          # and contributors resolve the same rustc. See that file for why.
          rustup toolchain install
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Include OS, runner arch, actual target triple,
      # rustc release, cargo tool versions, and Cargo.lock so multi-arch runners
      # never restore each other's target/ or ~/.cargo/bin artifacts.
      - name: Resolve cargo cache target
        id: cache-target
        shell: bash
        run: |
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-cli-ort-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-cli-ort-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-
      - name: Install Linux bindgen dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) {
            "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          }
      # Installing from crates.io avoids the personally-owned install action;
      # cargo install costs build minutes on cache misses but keeps provenance in Cargo-style resolution.
      - name: Install cargo-llvm-cov
        shell: bash
        run: |
          if cargo llvm-cov --version 2>/dev/null | grep -q "$CARGO_LLVM_COV_VERSION"; then
            echo "cargo-llvm-cov $CARGO_LLVM_COV_VERSION already installed"
          else
            cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked --force
          fi

      # The portable lane must stay offline, but the CLI is the user-facing ORT
      # entry point and its REPL contract tests catch token-budget regressions.
      # Keep this isolated so the native ORT download is intentional, pinned by
      # ort-sys checksums, and paid only by the crate that needs it.
      - name: Build onnx-genai-cli
        run: cargo build --locked -p onnx-genai-cli
      - name: Expose downloaded ORT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ort = Get-ChildItem -Path target\debug\build -Recurse -Filter onnxruntime.dll |
            Where-Object { $_.FullName -like '*ort-prebuilt*' } |
            Select-Object -First 1
          if (-not $ort) {
            throw 'onnx-genai-ort-sys did not leave a downloaded onnxruntime.dll under target\debug\build'
          }
          Copy-Item $ort.FullName target\debug\onnxruntime.dll -Force
          Copy-Item $ort.FullName target\debug\deps\onnxruntime.dll -Force
          # cargo-llvm-cov may use its own target directory; pre-stage the same ORT DLL
          # there and run coverage with --no-clean so it is not removed before tests.
          New-Item -ItemType Directory -Force target\llvm-cov-target\debug\deps | Out-Null
          Copy-Item $ort.FullName target\llvm-cov-target\debug\onnxruntime.dll -Force
          Copy-Item $ort.FullName target\llvm-cov-target\debug\deps\onnxruntime.dll -Force
          $ort.DirectoryName >> $env:GITHUB_PATH
      - name: Test onnx-genai-cli with coverage
        run: cargo llvm-cov --locked --no-clean --codecov --output-path codecov-cli-ort.json -p onnx-genai-cli
      # These crates depend on the downloaded ONNX Runtime distribution above.
      # The set is still derived from the workspace inventory, not hand-copied
      # here; adding a new ORT-backed crate means classifying it in the script.
      # Serialize because several integration tests temporarily select sessions
      # through process-wide environment variables.
      #
      # Linux only runs this in `Rust quality` now (#2015): this job is advisory,
      # so while it was the sole executor a failure here could not block a merge.
      # Windows has no required lane that builds the ORT graph at all, so this
      # remains the only place these tests run on Windows and stays here.
      - name: Test ORT-backed workspace crates
        if: runner.os == 'Windows'
        run: >-
          cargo test --locked
          $(python .github/scripts/workspace_test_packages.py cargo-args ort-backed)
          -- --test-threads=1
      - name: Execute checked-in Mobius workflow packages
        env:
          MOBIUS_WORKFLOW_CONFORMANCE_DIR: ${{ github.workspace }}/tests/fixtures/onnx_genai_workflows
        run: >-
          cargo test --locked -p onnx-genai-engine
          --test onnx_genai_workflow_conformance
      # `native-backend` is CPU-runnable: it selects the native CPU EP/session
      # crates, while CUDA-only engine integration tests are behind
      # required-features = ["native-cuda"] and are not selected here.
      # Serialize these tests because native session selection uses process-wide
      # environment overrides; parallel execution can interfere across tests.
      - name: Test onnx-genai-engine native backend
        run: >-
          cargo test --locked -p onnx-genai-engine --features native-backend
          -- --test-threads=1
      # `!cancelled()` rather than the implicit `success()`: this is the only
      # job that sets `NXRT_REQUIRE_ORT_TESTS=1` with ORT present, so it is the
      # only place the EP-assignment falsifiers run fail-closed rather than
      # skipping themselves. (Other jobs do compile and run this crate, but
      # without ORT those tests skip internally.) An unrelated failure in an
      # earlier step would otherwise skip this one and leave the plugin's ORT
      # interop unverified for that run. The job still fails if either step
      # fails, so no gate is weakened.
      #
      # Tradeoff: this also runs after a *setup* failure — if the ORT download
      # in `Build onnx-genai-cli` fails, this step now goes red for that
      # reason rather than being skipped. It cannot false-green, so the cost is
      # an extra red on an already-red job.
      - name: Test onnx-runtime-ep-cpu-plugin (ORT gate)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked --no-fail-fast -p onnx-runtime-ep-cpu-plugin
      # The same suite with the research reference linked. The run above is the
      # shipped configuration, but precisely because it links nothing the tests
      # that care about linkage are vacuous there: the build-identity assertion
      # is trivially satisfied, the symbol-leakage check has nothing to leak,
      # and a testkit that rebuilds a feature-specific cdylib *without* its
      # features -- the defect fixed alongside this step -- is only observable
      # when features are requested. This lane is where they have teeth.
      - name: Test onnx-runtime-ep-cpu-plugin with the MLAS reference (ORT gate)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: >-
          cargo test --locked --no-fail-fast
          -p onnx-runtime-ep-cpu-plugin --features mlas
      - name: Upload CLI ORT coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: codecov-cli-ort.json
          flags: ${{ matrix.coverage_flag }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Clippy onnx-genai-cli
        run: cargo clippy --locked -p onnx-genai-cli --all-targets -- -D warnings
      # The step above builds these crates with their *default* features, under
      # which every `#[cfg(feature = "native-cuda")]` block evaluates to false
      # and is therefore never parsed as code -- it cannot be type-checked or
      # linted, so a defect there is invisible rather than red. #1632 closed
      # that hole for `onnx-genai-engine` on the CUDA job; these two crates
      # could not go there because both link the downloaded ONNX Runtime, which
      # that job deliberately excludes. This is their home instead.
      #
      # A separate step rather than adding the feature to the one above: the
      # default configuration is what ships, so it must keep being checked on
      # its own rather than being replaced by a union of both.
      #
      # `onnx-genai-cli/native-cuda` pulls in `onnx-genai-server/native-cuda`
      # transitively, but `-D warnings` is only enforced for packages named
      # with `-p`, so the server is listed explicitly.
      - name: Clippy onnx-genai-cli and onnx-genai-server with native CUDA
        run: >-
          cargo clippy --locked
          -p onnx-genai-cli -p onnx-genai-server
          --features onnx-genai-cli/native-cuda,onnx-genai-server/native-cuda
          --all-targets -- -D warnings

  cuda-compile-linux:
    name: CUDA compile (Linux x86_64)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The Rust toolchain is pinned in rust-toolchain.toml so a runner image
      # rolling forward cannot turn `-D warnings` red with no commit to blame,
      # and so a contributor sees the same lints CI does. The cache key still
      # records the resolved rustc release. See rust-toolchain.toml for why.
      - name: Install the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          # The toolchain, and its components, come from rust-toolchain.toml so CI
          # and contributors resolve the same rustc. See that file for why.
          rustup toolchain install
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # actions/cache is GitHub-owned, so it is acceptable where personally-owned
      # cargo cache actions are not. Include OS, runner arch, actual target triple,
      # rustc release, cargo tool versions, and Cargo.lock so multi-arch runners
      # never restore each other's target/ or ~/.cargo/bin artifacts.
      - name: Resolve cargo cache target
        id: cache-target
        shell: bash
        run: |
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-target.outputs.triple }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-tools-${{ env.CARGO_LLVM_COV_VERSION }}-

      # CUDA uses dynamic loading, so compile coverage needs no GPU or toolkit.
      # The CUDA integration tests are compiled and reported as ignored unless
      # the `gpu-tests` feature is enabled on a real CUDA runner. ORT-linked
      # crates stay out of portable tests because onnx-genai-ort-sys downloads
      # native ORT; onnx-runtime-python's feature check here provides compile
      # coverage for that integration path.
      - name: Check CUDA execution provider and Python feature
        run: >-
          cargo check --locked
          -p onnx-runtime-ep-cuda
          -p onnx-runtime-python
          --features onnx-runtime-python/cuda

      - name: Verify CUDA test inventory and skip honesty
        run: python .github/scripts/verify_cuda_test_honesty.py

      # The capture-sync source audit is a static check (it reads kernel sources,
      # touches no device) that the honesty checker deliberately does not police
      # as a GPU test. Run it explicitly here so a capture-unsafe synchronize()
      # still fails the CPU lane at PR time.
      - name: Audit CUDA kernel capture-sync contract
        run: cargo test --locked -p onnx-runtime-ep-cuda --features cuda --test capture_sync_contract

      # The int4 MatMulNBits parity oracle self-checks are pure-CPU (no device):
      # they validate the f64 dequant->GEMM ground truth and the justified
      # tolerance envelope the GPU numerics gate depends on. The honesty checker
      # deliberately does not police this target (it is in ALWAYS_RUN), so run it
      # explicitly here to keep the oracle math exercised on the CPU lane (#1177).
      - name: Verify int4 MatMulNBits numerics oracle
        run: cargo test --locked -p onnx-runtime-ep-cuda --features cuda --test matmul_nbits_marlin_oracle

      # The safe-point rejection rules are pure predicate logic over
      # ResizeSafePoint (no device). Same situation as the two targets above:
      # the honesty checker deliberately does not police a non-_gpu target, and
      # workspace_test_packages.py deny-lists this crate from every offline
      # lane, so without this step the target would be compiled and never run
      # (#1875).
      - name: Verify granule transition safe-point rules
        run: cargo test --locked -p onnx-runtime-ep-cuda --features cuda --test content_preserving_transition

      # Non-`_gpu` targets in this crate run in no other lane: the honesty
      # script skips them and workspace_test_packages.py deny-lists the crate
      # from the offline lanes. Without this step the relocated CPU-only tests
      # would compile and never execute, which is the failure they were moved
      # out of `_gpu` targets to avoid.
      - name: Verify expert route telemetry CPU oracle
        run: cargo test --locked -p onnx-runtime-ep-cuda --features cuda --test expert_route_telemetry_probe

      # `--all-targets` and `gpu-tests` are both load-bearing. Without them
      # clippy sees only the library's non-test code: every `#[cfg(test)]`
      # module and all 58 `*_gpu.rs` targets go unlinted, and a lint error can
      # sit on `main` indefinitely because no job ever parses those blocks. One
      # did -- an `approx_constant` error in `optimizer.rs`'s test module,
      # invisible to this step for as long as it omitted the flags.
      #
      # This costs an extra pass: clippy-driver caches separately from `cargo
      # test`, so the honesty check's `cuda,gpu-tests` build above is not
      # reused for this crate (its dependency builds are). The Windows CUDA
      # lane deliberately keeps the narrower invocation -- it does not build
      # the gpu-tests binaries at all, so the same change there would be a
      # full extra build for lints this Linux step already covers.
      - name: Clippy CUDA execution provider
        run: >-
          cargo clippy -p onnx-runtime-ep-cuda
          --all-targets --features cuda,gpu-tests -- -D warnings
      # (it appeared in ci.yml only inside a comment). That left ~167 cfg sites
      # -- native_decode/{mod,load,cuda,tensor}.rs, memory_authority.rs,
      # pipeline/* -- never type-checked, linted, or tested, so a change could
      # break or orphan any of them with every check still green. `main` in fact
      # already carried a `-D dead-code` violation there, found only by running
      # this command by hand (#1631).
      #
      # Check-only, like the step above: CUDA is dynamically loaded, so no GPU
      # and no CUDA toolkit are required. `--all-targets` matters -- the defect
      # this caught is invisible to `--lib` alone, because the accessor's only
      # caller lives in a `#[cfg(test)]` module.
      - name: Clippy engine native-CUDA integration
        run: >-
          cargo clippy --locked
          -p onnx-genai-engine
          --features native-cuda
          --all-targets
          -- -D warnings

