name: Diff guard

# PR #1026 was titled "docs: RTX/consumer GeForce perf-tuning catalog" and deleted
# 3,153 files / 1,157,751 lines -- everything except `docs/` -- leaving `main` with
# two tracked files. Nothing stopped it, and it was found by accident days later,
# when an unrelated `git worktree add origin/main` produced a tree with no
# Cargo.toml. Review reads a diff; nobody reads a diff that large, so the size
# itself has to be the signal.
#
# This job fails when a pull request deletes an implausible share of the tree. It
# is deliberately crude: it does not try to judge whether the deletion is correct,
# only to make a repository-scale deletion impossible to merge silently. A genuine
# large removal passes by adding the `bulk-delete-approved` label, which leaves a
# record of the decision on the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  deletion-ratio:
    name: Deletion ratio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on repository-scale deletions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Tracked files on the base commit, and files this PR deletes outright.
          tracked=$(git ls-tree -r --name-only "$BASE_SHA" | wc -l)
          deleted=$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l)

          echo "tracked on base: $tracked"
          echo "deleted by PR:   $deleted"

          if [ "$tracked" -eq 0 ]; then
            echo "Base commit has no tracked files; nothing to compare against."
            exit 0
          fi

          # Integer percent, rounded down.
          ratio=$(( deleted * 100 / tracked ))
          echo "deletion ratio:  ${ratio}%"

          # A PR that removes more than a quarter of the repository, or more than
          # 500 files, is not a change anyone reviewed line by line.
          if [ "$ratio" -lt 25 ] && [ "$deleted" -lt 500 ]; then
            echo "Within limits."
            exit 0
          fi

          case ",$LABELS," in
            *,bulk-delete-approved,*)
              echo "Deletion is large (${deleted} files, ${ratio}%) but carries the"
              echo "'bulk-delete-approved' label. Allowing."
              exit 0
              ;;
          esac

          echo "::error::This pull request deletes ${deleted} of ${tracked} tracked files (${ratio}%)."
          echo "::error::A deletion this large is almost always accidental -- PR #1026 deleted the"
          echo "::error::entire repository under a docs-only title. If the removal is intended, add"
          echo "::error::the 'bulk-delete-approved' label to record that decision, and say in the PR"
          echo "::error::description what is being removed and why."
          exit 1

  # A stray file at the repository root is the other change review reliably misses:
  # not too large to read, but a single added line in a diff of hundreds, and the
  # root is exactly where `git add -A` in a working tree picks up scratch. Four have
  # reached `main` this way -- .commitmsg/ (490b846c3), .commitmsg (#1881, removed by
  # #1999), .pris_v4.log (#1951, removed by #1975) and .body.md (#2026). Each repair
  # added one more pattern to .gitignore, and each time the next file was named
  # outside every pattern written for the previous one; .body.md landed hours after
  # two such fixes. Enumerating what belongs is the only form of this check that does
  # not have to predict the next filename.
  root-files:
    name: Root file allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on root-level files that are not on the allowlist
        run: |
          set -euo pipefail

          allow=.github/root-file-allowlist.txt
          if [ ! -f "$allow" ]; then
            echo "::error::$allow is missing. This check cannot run without it, and a"
            echo "::error::pass without it would be vacuous, so it fails instead."
            exit 1
          fi

          # Tracked files at the repository root: no directory separator in the path.
          actual=$(git ls-files | { grep -v '/' || true; } | LC_ALL=C sort)
          allowed=$(grep -vE '^[[:space:]]*(#|$)' "$allow" | LC_ALL=C sort)

          unlisted=$(LC_ALL=C comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$allowed"))
          stale=$(LC_ALL=C comm -13 <(printf '%s\n' "$actual") <(printf '%s\n' "$allowed"))

          rc=0

          if [ -n "$unlisted" ]; then
            rc=1
            echo "::error::Root-level file(s) not on the allowlist:"
            printf '%s\n' "$unlisted" | while IFS= read -r f; do echo "::error::  $f"; done
            echo "::error::If this is scratch: 'git rm --cached' it and add it to .gitignore."
            echo "::error::If it belongs at the root: add it to $allow in this PR."
          fi

          if [ -n "$stale" ]; then
            rc=1
            echo "::error::Allowlist entr(ies) for files not present at the root:"
            printf '%s\n' "$stale" | while IFS= read -r f; do echo "::error::  $f"; done
            echo "::error::Remove them from $allow. A stale entry pre-approves that exact"
            echo "::error::filename, so an allowlist that outlives what it describes is not a"
            echo "::error::record of decisions but a rubber stamp."
          fi

          if [ "$rc" -eq 0 ]; then
            n=$(printf '%s\n' "$allowed" | { grep -c . || true; })
            echo "Root is exactly the $n allowlisted file(s)."
          fi
          exit "$rc"
