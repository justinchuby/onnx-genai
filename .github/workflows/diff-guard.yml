name: Diff guard

# PR #1026 was titled "docs: RTX/consumer GeForce perf-tuning catalog" and deleted
# 3,153 files / 1,157,751 lines -- everything except `docs/` -- leaving `main` with
# two tracked files. Nothing stopped it, and it was found by accident days later,
# when an unrelated `git worktree add origin/main` produced a tree with no
# Cargo.toml. Review reads a diff; nobody reads a diff that large, so the size
# itself has to be the signal.
#
# This job fails when a pull request deletes an implausible share of the tree. It
# is deliberately crude: it does not try to judge whether the deletion is correct,
# only to make a repository-scale deletion impossible to merge silently. A genuine
# large removal passes by adding the `bulk-delete-approved` label, which leaves a
# record of the decision on the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  deletion-ratio:
    name: Deletion ratio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on repository-scale deletions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Tracked files on the base commit, and files this PR deletes outright.
          tracked=$(git ls-tree -r --name-only "$BASE_SHA" | wc -l)
          deleted=$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l)

          echo "tracked on base: $tracked"
          echo "deleted by PR:   $deleted"

          if [ "$tracked" -eq 0 ]; then
            echo "Base commit has no tracked files; nothing to compare against."
            exit 0
          fi

          # Integer percent, rounded down.
          ratio=$(( deleted * 100 / tracked ))
          echo "deletion ratio:  ${ratio}%"

          # A PR that removes more than a quarter of the repository, or more than
          # 500 files, is not a change anyone reviewed line by line.
          if [ "$ratio" -lt 25 ] && [ "$deleted" -lt 500 ]; then
            echo "Within limits."
            exit 0
          fi

          case ",$LABELS," in
            *,bulk-delete-approved,*)
              echo "Deletion is large (${deleted} files, ${ratio}%) but carries the"
              echo "'bulk-delete-approved' label. Allowing."
              exit 0
              ;;
          esac

          echo "::error::This pull request deletes ${deleted} of ${tracked} tracked files (${ratio}%)."
          echo "::error::A deletion this large is almost always accidental -- PR #1026 deleted the"
          echo "::error::entire repository under a docs-only title. If the removal is intended, add"
          echo "::error::the 'bulk-delete-approved' label to record that decision, and say in the PR"
          echo "::error::description what is being removed and why."
          exit 1

  # A stray entry at the repository root is the other change review reliably misses:
  # not too large to read, but a single added line in a diff of hundreds, and the
  # root is exactly where `git add -A` in a working tree picks up scratch.
  #
  # Six have reached `main`, found by walking every root path ever added and
  # subtracting the ones still here (`git log --diff-filter=A --name-only`), rather
  # than by collecting the ones somebody happened to report:
  #
  #   .msg.txt         39675330b  ~1.5h on main
  #   .wa64.log        83a51bfa6   ~17h
  #   .commitmsg/      faedea4d1    ~3m   <- a DIRECTORY, not a file
  #   .commitmsg       #1881        ~37h  (removed by #1999)
  #   .pris_v4.log     #1951        ~1.3h (removed by #1975)
  #   .body.md         #2026        ~2.8h (removed by #2036)
  #
  # Each repair added one more pattern to .gitignore, and each time the next name
  # fell outside every pattern written for the previous one -- .body.md landed hours
  # after two such fixes, and its intended name .pr-body.md was already ignored.
  # Enumerating what belongs is the only form of this check that does not have to
  # predict the next name.
  #
  # This compares root *entries*, files and directories alike. #2036 compared files
  # only, so `.commitmsg/m.txt` -- an instance its own header cited -- passed: the
  # path has a separator, so it was filtered out as "not at the root". Naming an
  # instance is not the same as testing its shape.
  root-files:
    name: Root file allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on root-level entries that are not on the allowlist
        run: |
          set -euo pipefail

          allow=.github/root-file-allowlist.txt
          if [ ! -f "$allow" ]; then
            echo "::error::$allow is missing. This check cannot run without it, and a"
            echo "::error::pass without it would be vacuous, so it fails instead."
            exit 1
          fi

          # Every tracked path's first segment: a root file contributes itself, a
          # nested file contributes its top-level directory. Comparing entries rather
          # than files is what makes a stray directory visible -- `.commitmsg/m.txt`
          # reached main and a files-only check cannot see it, because the only thing
          # at the root is a name that never appears in `ls-files` output at all.
          #
          # core.quotePath=false because git's default renders a non-ASCII name in an
          # octal-escaped, quoted form ("caf\303\251.txt"). Under the default a
          # contributor who adds the real name to the allowlist -- the documented way
          # to add a root entry -- is told both that their entry is unlisted and that
          # their entry is stale. The escape hatch has to work for the names people
          # actually use, not just for ASCII.
          actual=$(git -c core.quotePath=false ls-files | sed 's#/.*##' | LC_ALL=C sort -u)

          # Strip CR (a CRLF checkout would otherwise mismatch every entry), then
          # surrounding whitespace, then comments and blanks. Trailing whitespace on
          # an entry is invisible in review and would silently never match.
          allowed=$(sed -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$allow" \
                    | { grep -vE '^(#|$)' || true; } | LC_ALL=C sort)

          # Explicit, rather than letting `set -e` abort on the empty grep above: an
          # empty list cannot express "the root is correct", and failing silently
          # gives a red X with no diagnostic. It must also never reach `comm`, where
          # two empty inputs would compare equal and pass vacuously.
          if [ -z "$allowed" ]; then
            echo "::error::$allow has no entries. Every root file would be reported as"
            echo "::error::unlisted, and an empty list cannot express 'the root is"
            echo "::error::correct', so this fails rather than guessing which was meant."
            exit 1
          fi

          unlisted=$(LC_ALL=C comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$allowed"))
          stale=$(LC_ALL=C comm -13 <(printf '%s\n' "$actual") <(printf '%s\n' "$allowed"))

          rc=0

          if [ -n "$unlisted" ]; then
            rc=1
            echo "::error::Root-level entr(ies) not on the allowlist:"
            printf '%s\n' "$unlisted" | while IFS= read -r f; do
              if [ -d "$f" ]; then
                echo "::error::  $f/   (directory)"
              else
                echo "::error::  $f"
              fi
            done
            echo "::error::If this is scratch: 'git rm -r --cached' it and add it to .gitignore."
            echo "::error::If it belongs at the root: add it to $allow in this PR."
          fi

          if [ -n "$stale" ]; then
            rc=1
            echo "::error::Allowlist entr(ies) for names not present at the root:"
            printf '%s\n' "$stale" | while IFS= read -r f; do echo "::error::  $f"; done
            echo "::error::Remove them from $allow. A stale entry pre-approves that exact"
            echo "::error::filename, so an allowlist that outlives what it describes is not a"
            echo "::error::record of decisions but a rubber stamp."
          fi

          if [ "$rc" -eq 0 ]; then
            n=$(printf '%s\n' "$allowed" | { grep -c . || true; })
            echo "Root is exactly the $n allowlisted entr(ies)."
          fi
          exit "$rc"
