name: Build and publish Python wheels

on:
  workflow_dispatch:
    inputs:
      build_cuda:
        description: Build separate CUDA wheel artifacts (Linux/Windows only)
        type: boolean
        default: false
      publish:
        description: Publish CPU wheels to PyPI after building
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cpu-wheels:
    name: CPU wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archs: x86_64
          - name: Windows AMD64
            os: windows-latest
            archs: AMD64
          # No macOS x86_64 (Intel) wheel: upstream ONNX Runtime stopped
          # publishing an osx-x86_64 prebuilt after 1.22.x (v1.27.0 ships only
          # osx-arm64). We pin ORT 1.27.0 to match ORT_API_VERSION 27, so we
          # cannot downgrade to recover an Intel binary. A matrix entry here
          # could only ever 404 and fail, so it is dropped rather than left red.
          # See .squad/decisions.md and the README wheels note.
          # macos-14 is the GitHub-hosted Apple Silicon runner.
          - name: macOS arm64
            os: macos-14
            archs: arm64
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS: ${{ matrix.archs }}
      # maturin adds this Cargo feature to [tool.maturin].features (abi3-py310).
      CIBW_CONFIG_SETTINGS: ${{ matrix.cibw_config_settings }}
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.07.25-1
      # DXCore is a Windows API set resolved by the OS loader, not a DLL to vendor.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
        delvewheel repair --exclude ext-ms-win-dxcore-l1-1-0.dll
        -w {dest_dir} -v {wheel}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Keep wheel publishing on Rust stable deliberately: this follows Rust's
      # stability promise without freezing security fixes.
      - name: Install Rust stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pull manylinux image with retries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$CIBW_MANYLINUX_X86_64_IMAGE"
          for attempt in 1 2 3; do
            docker pull "$image" && exit 0
            echo "manylinux image pull attempt $attempt failed"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build and smoke-test CPU wheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: crates/onnx-runtime-python
          output-dir: wheelhouse

      - name: Upload CPU wheel
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  cuda-wheels:
    # Job-level `if:` is evaluated before matrix expansion, so a skipped job
    # cannot interpolate its own matrix values — a name like
    # "CUDA wheel scaffold (${{ matrix.name }})" renders the literal
    # "${{ matrix.name }}" in the checks list when this job is skipped (the
    # default). Keep the name matrix-free so it is stable and readable whether
    # the job runs or is skipped. GitHub still disambiguates the two runs.
    name: CUDA wheel scaffold
    if: github.event_name == 'workflow_dispatch' && inputs.build_cuda
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archs: x86_64
          - name: Windows AMD64
            os: windows-latest
            archs: AMD64
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS: ${{ matrix.archs }}
      # Pass the optional Cargo feature through cibuildwheel's PEP 517 frontend.
      CIBW_CONFIG_SETTINGS: "build-args='--features cuda'"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Keep wheel publishing on Rust stable deliberately: this follows Rust's
      # stability promise without freezing security fixes.
      - name: Install Rust stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The CUDA EP dynamically loads CUDA, so compilation needs no GPU. Release
      # promotion still requires CUDA-enabled self-hosted runners to verify the
      # driver/toolkit and nvidia-*-cu13 dependency set end to end.
      - name: Build and import-test CUDA wheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: crates/onnx-runtime-python
          output-dir: wheelhouse

      # CUDA and CPU currently share the nxrt distribution name and wheel tag.
      # Keep CUDA artifacts separate until release engineering chooses a distinct
      # distribution name, version suffix/index, and GPU validation environment.
      - name: Upload CUDA wheel candidate
        uses: actions/upload-artifact@v4
        with:
          name: cuda-wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # onnx-genai / onnx-genai-server wheels are built AND published from publish.yml
  # (the workflow PyPI trusts for these projects). Keeping them there lets the
  # wheels reuse the existing trusted publisher without a second PyPI registration.

  publish-cpu:
    name: Publish nxrt CPU wheels
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [cpu-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download nxrt CPU wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cpu-wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          skip-existing: true
