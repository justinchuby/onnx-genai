name: Windows ARM64 crash diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/windows_arm64_crash_self_test.c"
      - ".github/scripts/windows_arm64_diagnostic_helpers.ps1"
      - ".github/scripts/windows_arm64_wer_diagnostics.ps1"
      - ".github/scripts/test_windows_arm64_diagnostic_helpers.ps1"
      - ".github/workflows/windows-arm64-crash-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: windows-arm64-crash-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-smoke:
    name: WER capture smoke
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      DIAGNOSTIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DIAGNOSTIC_SHA }}
          persist-credentials: false

      - name: Verify diagnostic checkout
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:DIAGNOSTIC_SHA) {
            throw "Diagnostic checkout mismatch: expected $env:DIAGNOSTIC_SHA, got $actual."
          }
          Write-Host "DIAGNOSTIC_SHA=$actual"

      - name: Install Windows SDK debugger
        shell: pwsh
        run: |
          choco install windows-sdk-10-version-2004-windbg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Windows SDK debugger installation failed with exit code $LASTEXITCODE."
          }

      - name: Test optional registry diagnostics
        shell: pwsh
        run: .github\scripts\test_windows_arm64_diagnostic_helpers.ps1

      - name: Prove intentional access-violation capture and CDB symbols
        id: self-test
        shell: pwsh
        run: |
          & .github\scripts\windows_arm64_wer_diagnostics.ps1 `
            -Action SetupAndSelfTest `
            -DiagnosticRoot windows-arm64-smoke

      - name: Restore original HKLM WER state
        if: always()
        shell: pwsh
        run: |
          & .github\scripts\windows_arm64_wer_diagnostics.ps1 `
            -Action Cleanup `
            -DiagnosticRoot windows-arm64-smoke

      - name: Secret-scan bounded smoke evidence
        if: always()
        shell: pwsh
        run: |
          & .github\scripts\windows_arm64_wer_diagnostics.ps1 `
            -Action SecretScan `
            -DiagnosticRoot windows-arm64-smoke

      - name: Upload bounded smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-capture-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-arm64-smoke/artifacts
          if-no-files-found: error
          retention-days: 14

  exact-candidate:
    name: Exact candidate ${{ matrix.replica }}
    needs: capture-smoke
    strategy:
      fail-fast: false
      matrix:
        replica: [1]
    runs-on: windows-11-arm
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      NXRT_REQUIRE_PLACEMENT_TESTS: "1"
      TESTED_SHA: acc58ba4a2d1e381eb665f2f1954f70f14dec487
      DIAGNOSTIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DIAGNOSTIC_SHA }}
          path: diagnostics
          persist-credentials: false

      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          ref: acc58ba4a2d1e381eb665f2f1954f70f14dec487
          path: tested
          submodules: recursive
          persist-credentials: false

      - name: Record exact source attribution
        id: attribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tested = (& git -C tested rev-parse HEAD).Trim()
          $diagnostic = (& git -C diagnostics rev-parse HEAD).Trim()
          if ($tested -ne $env:TESTED_SHA) {
            throw "Test checkout mismatch: expected $env:TESTED_SHA, got $tested."
          }
          if ($diagnostic -ne $env:DIAGNOSTIC_SHA) {
            throw "Diagnostic checkout mismatch: expected $env:DIAGNOSTIC_SHA, got $diagnostic."
          }
          $root = New-Item -ItemType Directory -Force diagnostics\windows-arm64-run\artifacts\manifests
          [pscustomobject]@{
            tested_sha = $tested
            diagnostic_sha = $diagnostic
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_attempt = "${{ github.run_attempt }}"
            job = "${{ github.job }}"
            replica = ${{ matrix.replica }}
            runner_name = $env:RUNNER_NAME
            runner_arch = $env:RUNNER_ARCH
          } | ConvertTo-Json | Set-Content (Join-Path $root "attribution.json")
          "tested_sha=$tested" >> $env:GITHUB_OUTPUT
          "diagnostic_sha=$diagnostic" >> $env:GITHUB_OUTPUT
          Write-Host "TESTED_SHA=$tested"
          Write-Host "DIAGNOSTIC_SHA=$diagnostic"

      - name: Install Windows SDK debugger
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install windows-sdk-10-version-2004-windbg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Windows SDK debugger installation failed with exit code $LASTEXITCODE."
          }

      - name: Configure HKLM WER and prove capture end-to-end
        id: self-test
        shell: pwsh
        run: |
          & diagnostics\.github\scripts\windows_arm64_wer_diagnostics.ps1 `
            -Action SetupAndSelfTest `
            -DiagnosticRoot diagnostics\windows-arm64-run

      - name: Install exact candidate toolchain
        working-directory: tested
        shell: bash
        run: rustup toolchain install

      - name: Install exact candidate Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        working-directory: tested
        shell: bash
        run: python -m pip install --upgrade numpy onnxscript

      - name: Build mlas-sys on Windows ARM64
        working-directory: tested
        shell: bash
        run: cargo build --locked --target aarch64-pc-windows-msvc -p mlas-sys

      - name: Build CPU plugin with MLAS research reference
        working-directory: tested
        shell: bash
        run: cargo build --locked --target aarch64-pc-windows-msvc -p onnx-runtime-ep-cpu-plugin --features mlas

      - name: Run two exact broad Cargo executions
        id: broad-tests
        working-directory: tested
        shell: bash
        run: |
          mkdir -p ../diagnostics/windows-arm64-run/artifacts/logs
          exec > >(tee ../diagnostics/windows-arm64-run/artifacts/logs/broad-tests.log) 2>&1
          set +e
          packages="$(python .github/scripts/workspace_test_packages.py cargo-args offline-cross-platform)"
          resolver_status="$?"
          if [[ "$resolver_status" -ne 0 || -z "$packages" ]]; then
            echo "::error::lane 'offline-cross-platform' failed to resolve a non-empty package set"
            echo "resolver_exit=$resolver_status" >> "$GITHUB_OUTPUT"
            echo "attempt_1_exit=not-run" >> "$GITHUB_OUTPUT"
            echo "attempt_2_exit=not-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo test --locked $packages
          attempt_1="$?"
          echo "attempt_1_exit=$attempt_1" >> "$GITHUB_OUTPUT"
          cd ../diagnostics
          pwsh -NoProfile -File .github/scripts/windows_arm64_wer_diagnostics.ps1 -Action CheckForRealDump -DiagnosticRoot windows-arm64-run
          dump_1="$(tail -n 1 "$GITHUB_OUTPUT" | tr -d '\r')"
          cd ../tested
          if [[ "$attempt_1" -ne 0 || "$dump_1" == "real_dump=true" ]]; then
            echo "attempt_2_exit=stopped-after-failure-or-dump" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo test --locked -p onnx-runtime-ep-cpu --features mlas \
            --test native_vs_mlas_differential --no-run --message-format=json \
            > ../diagnostics/windows-arm64-run/artifacts/logs/focused-build.json
          target_exe="$(python -c 'import json,sys; xs=[json.loads(x) for x in open(sys.argv[1]) if x.startswith(\"{\")]; print(next(x[\"executable\"] for x in reversed(xs) if x.get(\"reason\")==\"compiler-artifact\" and x.get(\"target\",{}).get(\"name\")==\"native_vs_mlas_differential\" and x.get(\"executable\")))' ../diagnostics/windows-arm64-run/artifacts/logs/focused-build.json)"
          if [[ -z "$target_exe" || ! -f "$target_exe" || ! -f "${target_exe%.exe}.pdb" ]]; then
            echo "::error::failed to dynamically resolve focused executable/PDB pair"
            echo "attempt_2_exit=target-resolution-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target_windows="$(cygpath -w "$target_exe")"
          pwsh -NoProfile -File ../diagnostics/.github/scripts/windows_arm64_wer_diagnostics.ps1 \
            -Action ConfigureTarget -DiagnosticRoot ../diagnostics/windows-arm64-run \
            -TargetExecutable "$target_windows"

          echo "cargo test --locked -p onnx-runtime-ep-cpu --features mlas --test native_vs_mlas_differential -- --nocapture" \
            > ../diagnostics/windows-arm64-run/artifacts/manifests/focused-command.txt
          {
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "RUSTFLAGS=$RUSTFLAGS"
            echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
            echo "NXRT_REQUIRE_PLACEMENT_TESTS=$NXRT_REQUIRE_PLACEMENT_TESTS"
            rustc -vV
            cargo -vV
          } > ../diagnostics/windows-arm64-run/artifacts/manifests/focused-environment.txt
          cargo test --locked -p onnx-runtime-ep-cpu --features mlas \
            --test native_vs_mlas_differential -- --nocapture
          attempt_2="$?"
          echo "attempt_2_exit=$attempt_2" >> "$GITHUB_OUTPUT"
          if [[ "$attempt_2" -ne 0 ]]; then
            pwsh -NoProfile -File ../diagnostics/.github/scripts/windows_arm64_wer_diagnostics.ps1 \
              -Action WaitForTargetDump -DiagnosticRoot ../diagnostics/windows-arm64-run \
              -TargetExecutable "$target_windows"
            echo "dump_wait_exit=$?" >> "$GITHUB_OUTPUT"
          else
            echo "dump_wait_exit=not-needed" >> "$GITHUB_OUTPUT"
          fi
          cd ../diagnostics
          pwsh -NoProfile -File .github/scripts/windows_arm64_wer_diagnostics.ps1 -Action CheckForRealDump -DiagnosticRoot windows-arm64-run
          exit 0

      - name: Write execution manifest
        if: always()
        shell: pwsh
        run: |
          $manifest = "diagnostics\windows-arm64-run\artifacts\manifests\execution.json"
          [pscustomobject]@{
            tested_sha = "${{ steps.attribution.outputs.tested_sha }}"
            diagnostic_sha = "${{ steps.attribution.outputs.diagnostic_sha }}"
            replica = ${{ matrix.replica }}
            resolver_exit = "${{ steps.broad-tests.outputs.resolver_exit }}"
            attempt_1_exit = "${{ steps.broad-tests.outputs.attempt_1_exit }}"
            attempt_2_exit = "${{ steps.broad-tests.outputs.attempt_2_exit }}"
            broad_step_outcome = "${{ steps.broad-tests.outcome }}"
            self_test_outcome = "${{ steps.self-test.outcome }}"
          } | ConvertTo-Json | Set-Content $manifest
          Get-Content $manifest | Write-Host

      - name: Detect failure or real dump
        if: always()
        id: result
        shell: pwsh
        run: |
          $failed = "${{ steps.self-test.outcome }}" -ne "success"
          $attempt1 = "${{ steps.broad-tests.outputs.attempt_1_exit }}"
          $attempt2 = "${{ steps.broad-tests.outputs.attempt_2_exit }}"
          if ($attempt1 -ne "0" -or $attempt2 -ne "0") {
            $failed = $true
          }
          $realDumps = @(Get-ChildItem diagnostics\windows-arm64-run\dumps -Filter *.dmp -ErrorAction SilentlyContinue)
          if ($realDumps.Count -gt 0) {
            $failed = $true
          }
          "failed=$($failed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "real_dump_count=$($realDumps.Count)" >> $env:GITHUB_OUTPUT

      - name: Collect and secret-scan bounded failure artifacts
        if: always() && steps.result.outputs.failed == 'true'
        id: collect
        shell: pwsh
        run: |
          & diagnostics\.github\scripts\windows_arm64_wer_diagnostics.ps1 `
            -Action CollectFailure `
            -DiagnosticRoot diagnostics\windows-arm64-run `
            -TestedRoot tested

      - name: Restore original HKLM WER state
        if: always()
        shell: pwsh
        run: |
          & diagnostics\.github\scripts\windows_arm64_wer_diagnostics.ps1 `
            -Action Cleanup `
            -DiagnosticRoot diagnostics\windows-arm64-run

      - name: Upload failure artifacts
        if: always() && steps.result.outputs.failed == 'true' && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-crash-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: diagnostics/windows-arm64-run/artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Preserve nonzero diagnostic outcome
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.result.outputs.failed }}" -eq "true") {
            throw "Replica ${{ matrix.replica }} failed or captured a real dump; preserving the nonzero outcome."
          }
          if ("${{ steps.result.outputs.failed }}" -ne "false") {
            throw "Replica ${{ matrix.replica }} did not produce a trustworthy diagnostic result."
          }
          Write-Host "Replica ${{ matrix.replica }} completed two exact broad Cargo executions without a real dump."
