name: Benchmarks

# Kernel micro-benchmark regression gate. Runs on every PR, compares the PR
# head against its merge-base on the SAME runner in the SAME job, and FAILS
# the check on a statistically unambiguous regression.
#
# Design principles:
#   1. Ratios are reliable, absolutes are not.
#   2. Base is benchmarked FIRST (eats cold-start overhead). PR second (warm
#      runner). This creates a small systematic bias toward PR appearing faster,
#      which reduces false positives. A genuine regression must overcome this
#      bias — that is a feature, not a bug.
#   3. The gate is REAL. It fails the build. A gate that cannot fail is a
#      comment nobody reads. The throughput floor that passed cheerfully through
#      a 4.5× decode regression proves this.
#   4. Thresholds are derived from measured variance, not chosen as round numbers.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Cancel in-progress benchmark runs for the same PR when new commits arrive.
concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  micro-benchmarks:
    name: Kernel micro-benchmarks
    # macOS arm64 runner to exercise the Apple Silicon path.
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # Fetch enough history to find the merge-base.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache for benchmarks to avoid polluting the main CI cache.
          prefix-key: bench-v1

      # ── Benchmark the MERGE-BASE FIRST (eats cold-start) ──────────────
      - name: Determine merge-base
        id: merge-base
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Merge-base: $BASE"

      - name: Checkout merge-base
        run: git checkout ${{ steps.merge-base.outputs.sha }}

      - name: Benchmark merge-base (ep-cpu kernels)
        run: cargo bench -p onnx-runtime-ep-cpu --bench kernels -- --noplot

      - name: Benchmark merge-base (genai-bench no_model)
        run: cargo bench -p onnx-genai-bench --bench no_model -- --noplot

      - name: Save base criterion results
        run: cp -R target/criterion base-criterion

      # ── Benchmark the PR head SECOND (warm runner) ────────────────────
      - name: Checkout PR head
        run: git checkout ${{ github.event.pull_request.head.sha }}

      - name: Benchmark PR head (ep-cpu kernels)
        run: cargo bench -p onnx-runtime-ep-cpu --bench kernels -- --noplot

      - name: Benchmark PR head (genai-bench no_model)
        run: cargo bench -p onnx-genai-bench --bench no_model -- --noplot

      - name: Save PR criterion results
        run: cp -R target/criterion pr-criterion

      # ── Compare, comment, and gate ────────────────────────────────────
      - name: Collect host info
        id: host
        run: |
          {
            echo 'info<<EOF'
            echo "CPU: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
            echo "Cores: $(sysctl -n hw.logicalcpu 2>/dev/null || echo unknown)"
            echo "OS: $(uname -srm)"
            echo "Rust: $(rustc --version)"
            echo "Load avg: $(sysctl -n vm.loadavg 2>/dev/null || uptime | sed 's/.*load averages: //')"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate comparison
        id: compare
        # Do not fail here — post the comment first for visibility.
        run: |
          python3 scripts/ci_bench_compare.py \
            --base-dir base-criterion \
            --pr-dir pr-criterion \
            --output benchmark-comment.md \
            --host-info "${{ steps.host.outputs.info }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Find existing comment
        id: find-comment
        run: |
          COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq '.[] | select(.body | startswith("## ")) | select(.body | contains("Benchmark")) | .id' \
            | head -1)
          echo "id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update PR comment
        run: |
          BODY=$(cat benchmark-comment.md)
          if [ -n "${{ steps.find-comment.outputs.id }}" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${{ steps.find-comment.outputs.id }}" \
              -f body="$BODY"
            echo "Updated existing comment ${{ steps.find-comment.outputs.id }}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
            echo "Posted new comment"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── THE GATE: fail the check if regression detected ───────────────
      - name: Fail on regression
        if: steps.compare.outcome == 'failure'
        run: |
          echo "::error::Benchmark regression detected — check failed."
          echo ""
          cat benchmark-comment.md
          exit 1
