name: Benchmarks

# Informational micro-benchmark comparison, posted as a PR comment.
# Does NOT block CI — the real regression gates live in
# crates/onnx-genai-bench/tests/profile_native.rs (throughput floors +
# dispatch-reachability tests on real hardware).
#
# MANUAL ONLY — the automatic `pull_request` trigger was removed.
#
# Why: a GitHub-hosted runner is not a quiet machine. It is shared, its
# neighbours are invisible to us, and we cannot verify it was idle for the
# window we timed. Under that noise this job posted "🔴 Benchmark Regression
# Detected" on PRs that had changed nothing relevant, so the header stopped
# carrying information: a red flag that fires on noise trains readers to
# ignore it, which is worse than not publishing the number at all.
#
# Timing base-then-PR in one job and reporting % change does cancel some
# runner-to-runner variation, but it cannot cancel *within-job* contention —
# the two halves still run at different moments against different neighbours.
# The thresholds were calibrated against ~27% worst-case measured noise, and
# real regressions worth catching are often smaller than that, so the signal
# sits below the noise floor rather than above it.
#
# Nothing is lost by making this manual: it never gated anything. Run it by
# hand when you actually want the comparison, and treat any single result as
# unadjudicable unless a control arm the change cannot touch stayed put.
# See docs/benchmarks/README.md for the verify-a-quiet-box methodology.
#
# Design (unchanged, for manual runs):
#   - Base benchmarked FIRST (eats cold-start), PR SECOND (warm runner).
#   - Reports % change as the reliable signal; absolutes are informational.
#   - Measured run-to-run variance included so readers can judge signal vs noise.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to benchmark (head vs its merge-base)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  micro-benchmarks:
    name: Kernel micro-benchmarks
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bench-v1

      # ── Resolve the PR under test ─────────────────────────────────────
      # workflow_dispatch checks out the default branch, not the PR, so the
      # head sha and base ref have to be looked up and the head fetched.
      - name: Resolve PR
        id: pr
        run: |
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          BASE_REF=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          git fetch --no-tags origin "pull/$PR/head:pr-head" "$BASE_REF"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "PR #$PR head=$HEAD_SHA base=$BASE_REF"
        env:
          PR: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Benchmark the merge-base FIRST (eats cold-start) ──────────────
      - name: Determine merge-base
        id: merge-base
        run: |
          BASE=$(git merge-base ${{ steps.pr.outputs.head_sha }} origin/${{ steps.pr.outputs.base_ref }})
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Merge-base: $BASE"

      - name: Checkout merge-base
        run: git checkout ${{ steps.merge-base.outputs.sha }}

      - name: Benchmark merge-base (ep-cpu kernels)
        run: cargo bench -p onnx-runtime-ep-cpu --bench kernels -- --noplot

      - name: Benchmark merge-base (genai-bench no_model)
        run: cargo bench -p onnx-genai-bench --bench no_model -- --noplot

      - name: Save base criterion results
        run: cp -R target/criterion base-criterion

      # ── Benchmark the PR head SECOND (warm runner) ────────────────────
      - name: Checkout PR head
        run: git checkout ${{ steps.pr.outputs.head_sha }}

      - name: Benchmark PR head (ep-cpu kernels)
        run: cargo bench -p onnx-runtime-ep-cpu --bench kernels -- --noplot

      - name: Benchmark PR head (genai-bench no_model)
        run: cargo bench -p onnx-genai-bench --bench no_model -- --noplot

      - name: Smoke-check PR model benchmarks
        run: cargo bench -p onnx-genai-bench --features bench-ort --bench model -- --test

      - name: Save PR criterion results
        run: cp -R target/criterion pr-criterion

      # ── Compare and comment ────────────────────────────────────────────
      - name: Collect host info
        id: host
        run: |
          {
            echo 'info<<EOF'
            echo "CPU: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
            echo "Cores: $(sysctl -n hw.logicalcpu 2>/dev/null || echo unknown)"
            echo "OS: $(uname -srm)"
            echo "Rust: $(rustc --version)"
            echo "Load avg: $(sysctl -n vm.loadavg 2>/dev/null || uptime | sed 's/.*load averages: //')"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate comparison
        run: |
          python3 scripts/ci_bench_compare.py \
            --base-dir base-criterion \
            --pr-dir pr-criterion \
            --output benchmark-comment.md \
            --host-info "${{ steps.host.outputs.info }}"

      - name: Find existing comment
        id: find-comment
        run: |
          COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments" \
            --paginate --jq '.[] | select(.body | startswith("## ")) | select(.body | contains("Benchmark")) | .id' \
            | head -1)
          echo "id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update PR comment
        run: |
          BODY=$(cat benchmark-comment.md)
          if [ -n "${{ steps.find-comment.outputs.id }}" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${{ steps.find-comment.outputs.id }}" \
              -f body="$BODY"
            echo "Updated existing comment ${{ steps.find-comment.outputs.id }}"
          else
            gh pr comment "${{ inputs.pr_number }}" --body "$BODY"
            echo "Posted new comment"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
