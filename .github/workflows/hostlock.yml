name: Host lock

# `scripts/hostlock.sh` is the advisory benchmark-host lock (#1803, #1806) and
# `scripts/hostlock_test.sh` is its conformance suite: 278 assertions (249
# before #1910, 252 before #1869, 265 before the unit/reason work) covering
# mutual exclusion, atomic publish, stale-holder reaping, fail-closed
# admission, the CPU-efficiency verdict and the unit it is reported in.
# Until this workflow existed, **nothing ran it.** It was run by hand, by me,
# on the box it locks -- which is the same "assigned, never executed" shape
# the suite itself exists to prevent, one level up. A suite nobody runs is a
# suite that is green because it is stale.
#
# It has already earned its place more than once. Three of the defects it
# caught were introduced by the fix for the previous one:
#
#   * an acquire that `mkdir`ed and then wrote its metadata handed the host to
#     THREE simultaneous winners, because a competitor reading in the window
#     between the two steps sees a lock with no anchor pid and reaps it;
#   * the reaper's own mutex could be orphaned by a SIGKILL between `mkdir`
#     and `rmdir`, after which no stale lock could ever be reaped again;
#   * `reaper_release` compared only `$$`, so on a box cycling ~1.5M pids in
#     four days it could delete a live successor's guard.
#
# Path-filtered on purpose. The suite spends about ten core-seconds on real
# load -- six spinners for the occupancy reading, three ~1.5s single-cpu cells
# for the efficiency verdict -- which is cheap but not free, and it is
# irrelevant to a PR that does not touch the lock. So it runs only when
# `scripts/hostlock*.sh` or this file changes, on PRs and on pushes to main.
# It is deliberately NOT one of the required checks: the required set is
# `Fast (Linux x86_64)` and `Rust quality`, and adding a fourth-minute shell
# job to every PR's critical path would buy nothing for the ~99% of PRs that
# do not touch these two files.
#
# Linux-only by construction, matching the tool: `hostlock.sh` reads
# `/proc/<pid>/stat` for pid start times, relies on `mv -T` for its atomic
# publish, and uses `stat -c`. Its PORTABILITY block says so.
#
# Timing, measured rather than assumed. The suite contains fixed sleeps and
# several bounded waits, so its wall time is dominated by waiting, not by
# work. Under `taskset -c 30,31` on the development host -- two cores, the
# shape of a GitHub-hosted runner -- it passes 278/278 in 208s while consuming
# 57% of a single core averaged over that window, i.e. it is mostly waiting.
# Both figures are re-measured, not carried forward: 118.7s cpu over 208.3s
# wall, taken the same way after the assertion count changed.
# The 20-minute timeout is ~5x the measured wall time, which leaves room for a
# slower runner without letting a genuinely hung wait sit for the six-hour
# default.
#
# The suite is required to pass on a co-tenanted host (#1802): every cell that
# needs to know what a run achieved measures this host and derives its
# threshold, rather than asserting a number only an idle box can produce. That
# is what makes it safe to run on shared CI infrastructure at all, and the
# two-core run above is the evidence for it rather than the claim.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/hostlock.sh"
      - "scripts/hostlock_test.sh"
      - ".github/workflows/hostlock.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/hostlock.sh"
      - "scripts/hostlock_test.sh"
      - ".github/workflows/hostlock.yml"

permissions:
  contents: read

jobs:
  conformance:
    name: Host lock conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck scripts/hostlock.sh scripts/hostlock_test.sh

      # The suite pins its own total (`every assertion in this file ran`), so a
      # refactor that silently drops assertions fails here rather than passing
      # with fewer of them. That assertion is the reason this job can be
      # trusted to mean what its name says.
      - name: Conformance suite
        run: bash scripts/hostlock_test.sh
