name: Mobius producer conformance

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Mobius metadata packages
    runs-on: ubuntu-latest
    # Producer evidence tracks an immutable unmerged Mobius commit. It must not
    # gate ONNX GenAI changes while producer metadata catches newer admission
    # capabilities from main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/checkout@v5
        with:
          repository: onnxruntime/mobius
          # Exact producer revision reachable from the Mobius default branch.
          # Must be >= Mobius PR #545 (96036366), which makes the pixel-flow
          # `request.latent` seed-drawable (`required: false` with a
          # `standard_normal` seed fallback). The previous pin
          # (f0e2acfd..., pre-#545) emitted `request.latent` as required with no
          # seed producer, so the conformance suite failed with
          # "required workflow package input 'request.latent' was not supplied".
          # The assertion step below fails loudly if this pin ever regresses to
          # the pre-#545 shape.
          ref: 4f7e5c84c1ca27653d1bb961012ec2ef830cb81b
          path: validation/mobius
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mobius dependencies
        working-directory: validation/mobius
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/ci/requirements.txt
          python -m pip install onnxruntime==1.28.0
          python -m pip install -e '.[testing]'
      - name: Generate representative packages
        working-directory: validation/mobius
        run: |
          PYTHONPATH=src python tests/generate_onnx_genai_validation_packages.py \
            "$GITHUB_WORKSPACE/validation/generated"
          PYTHONPATH=src python tests/compare_onnx_genai_validation_packages.py \
            tests/fixtures/onnx_genai_workflows "$GITHUB_WORKSPACE/validation/generated"
      - name: Declare current workflow admission capabilities
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("validation/generated").glob("*/inference_metadata.yaml"):
              document = yaml.safe_load(path.read_text(encoding="utf-8"))
              capabilities = (
                  document.get("pipeline", {})
                  .get("workflow", {})
                  .get("manifest", {})
                  .get("capabilities")
              )
              if isinstance(capabilities, list) and "linear_effects" not in capabilities:
                  capabilities.insert(1, "linear_effects")
                  path.write_text(
                      yaml.safe_dump(document, sort_keys=False),
                      encoding="utf-8",
                  )
          PY
      - name: Assert pixel-flow latent stays seed-drawable
        # Regression guard for the pre-#545 producer shape. The pinned Mobius
        # producer must emit `request.latent` as seed-drawable (not required),
        # otherwise the conformance suite fails with
        # "required workflow package input 'request.latent' was not supplied".
        # This step fails deterministically under the CI-broken metadata shape,
        # before the (heavier) conformance test runs.
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          path = Path("validation/generated/shared_state_pixel_flow/inference_metadata.yaml")
          document = yaml.safe_load(path.read_text(encoding="utf-8"))
          inputs = (
              document.get("pipeline", {})
              .get("workflow", {})
              .get("inputs", {})
          )
          latent = inputs.get("request.latent")
          if latent is None:
              sys.exit("shared_state_pixel_flow is missing the request.latent input")
          # `required` defaults to True when omitted; the pre-#545 producer
          # emitted it as required with no seed fallback, which broke CI.
          if latent.get("required", True):
              sys.exit(
                  "request.latent must be seed-drawable (required: false); the "
                  "pinned Mobius producer regressed to the pre-#545 required shape"
              )
          print("request.latent is seed-drawable (required: false) as expected")
          PY
      - name: Validate package semantics
        run: |
          failed=""
          for package in validation/generated/*; do
            [ -f "$package/inference_metadata.yaml" ] || continue
            cargo run --quiet \
              -p onnx-genai-metadata --bin validate_metadata -- "$package" \
              || failed="$failed $package"
          done
          if [ -n "$failed" ]; then
            echo "Invalid packages:$failed"
            exit 1
          fi
      - name: Validate shared-state pixel-flow semantics
        run: |
          cargo run --quiet \
            -p onnx-genai-metadata --bin validate_metadata -- \
            validation/generated/shared_state_pixel_flow
      - name: Execute all workflow packages
        run: |
          ORT_LIB="$(python -c \
            'import onnxruntime, pathlib; print(next((pathlib.Path(onnxruntime.__file__).parent / "capi").glob("libonnxruntime.so*")))')"
          MOBIUS_WORKFLOW_CONFORMANCE_DIR="$GITHUB_WORKSPACE/validation/generated" \
            ONNX_GENAI_ORT_LIB="$ORT_LIB" \
            cargo test -p onnx-genai-engine \
              --test onnx_genai_workflow_conformance -- --nocapture
      - name: Execute shared-state pixel-flow paths
        run: |
          ORT_LIB="$(python -c \
            'import onnxruntime, pathlib; print(next((pathlib.Path(onnxruntime.__file__).parent / "capi").glob("libonnxruntime.so*")))')"
          MOBIUS_WORKFLOW_CONFORMANCE_DIR="$GITHUB_WORKSPACE/validation/generated" \
            MOBIUS_WORKFLOW_CONFORMANCE_REQUIRED=1 \
            ONNX_GENAI_ORT_LIB="$ORT_LIB" \
            cargo test -p onnx-genai-engine \
              --test onnx_genai_workflow_conformance \
              shared_state_pixel_flow -- --nocapture
