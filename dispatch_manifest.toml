# ═══════════════════════════════════════════════════════════════════════════════
# BatchNormalization — fusion elimination (not a dispatch tier)
# ═══════════════════════════════════════════════════════════════════════════════
# BatchNorm's optimization is graph-level: the optimizer's Conv+BN fusion pass
# eliminates it entirely from the executed graph. This is NOT a dispatch tier —
# it's "this op should not execute at all for standard CNN models."
#
# The manifest's (op, platform) → minimum_tier schema cannot express "op should
# be fused away" without lying about what tier means. A [[fusion]] table is the
# honest extension, but today it has no enforcement mechanism (no counter that
# proves fusion fired). Rather than force BatchNorm into [[claim]] with a fake
# tier, we document it as a known-good-but-unguarded optimization.
#
# When the optimizer gains a FUSION_FIRED_TEST_HITS counter for Conv+BN folding,
# add a [[fusion]] row here and extend the lint to verify it.

# ═══════════════════════════════════════════════════════════════════════════════
# Deliberate exclusions (not optimized — by design)
# ═══════════════════════════════════════════════════════════════════════════════

[[claim]]
op = "Conv"
variant = "depthwise_neon_direct"
platform = "aarch64"
minimum_tier = "tier2"
counter = "CONV_NEON_DEPTHWISE_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/conv_ref.rs"
description = "Depthwise Conv (groups==IC==OC) uses direct NEON kernel, no im2col buffer"

[[claim]]
op = "Conv"
variant = "grouped_not_depthwise"
platform = "all"
minimum_tier = "tier2"
counter = "CONV_IM2COL_GEMM_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/conv_ref.rs"
description = "Grouped-but-not-depthwise Conv dispatches to im2col+GEMM"

[[exclusion]]
op = "MatMul"
variant = "bf16_m_ge2"
platform = "aarch64-apple-darwin"
reason = "bf16 M>=2 does not use BNNS — BNNS bf16 support is incomplete on current macOS"

[[exclusion]]
op = "MaxPool"
variant = "dilated"
platform = "aarch64-apple-darwin"
reason = "Dilated pooling deliberately falls to scalar reference — BNNS does not support dilation"

[[exclusion]]
op = "BatchNormalization"
variant = "fusion_elimination"
platform = "all"
reason = "Optimization is graph-level Conv+BN fusion (elimination), not dispatch tier. Unguarded pending optimizer-level counter."

[[claim]]
op = "Clip"
variant = "contiguous_f32"
platform = "all"
minimum_tier = "tier1"
counter = "CLIP_F32_FAST_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/selection.rs"
description = "Contiguous f32 Clip uses zero-copy NEON SIMD clamp (aarch64) or scalar loop, avoiding allocating to_dense"
