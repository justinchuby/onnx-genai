# Dispatch Manifest — Claimed Optimizations
#
# Each [[claim]] declares: "On this platform, this op dispatches to at least
# this tier, proved by this TEST_HITS counter."
#
# The CI lint (scripts/check_dispatch_manifest.py) verifies:
#   1. The counter exists as a `static ...: Atomic{Usize,U64}` in the declared file.
#   2. The counter has a paired test (delegated to check_dispatch_reachability.py).
#
# A missing row means "no claimed optimization" — the op may run on scalar
# reference without CI complaint. This is intentional: the manifest guards
# only what we explicitly claim.
#
# Adding a row is a commitment: from that point forward, CI blocks any change
# that removes the counter or breaks the test. Removing a row is a conscious
# un-claim — legitimate when an optimization is deprecated or superseded.
#
# Tier vocabulary (ordered, highest = most optimized):
#   tier1 — Hardware-accelerated framework (BNNS, AMX, cuBLAS, Metal MPS)
#   tier2 — Explicit SIMD / optimized library (NEON GEMV, im2col+cblas, AVX2)
#   tier3 — Scalar reference (always correct, never fast)
#
# "minimum_tier" means "the dispatch MUST reach at least this tier." A claim
# of tier2 is satisfied by tier1 or tier2, but NOT by tier3.
#
# ─── Exclusions ──────────────────────────────────────────────────────────────
# Use [[exclusion]] to document cases we deliberately do NOT optimize.
# These are not enforced — they exist to prevent someone from adding a claim
# row for something we intentionally skip, and to distinguish "not yet done"
# from "decided against."

# ═══════════════════════════════════════════════════════════════════════════════
# MatMul (f16) — aarch64-apple-darwin
# ═══════════════════════════════════════════════════════════════════════════════

[[claim]]
op = "MatMul"
variant = "f16_m1"
platform = "aarch64-apple-darwin"
minimum_tier = "tier2"
counter = "GEMV_F16_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/matmul.rs"
description = "M=1 decode uses NEON GEMV, not half_gemm"
# Proves: fp16_m1_decode_reaches_neon_gemv_not_half_gemm

[[claim]]
op = "MatMul"
variant = "f16_m1_colmaj"
platform = "aarch64-apple-darwin"
minimum_tier = "tier2"
counter = "GEMV_F16_COLMAJ_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/matmul.rs"
description = "M=1 decode with column-major B uses NEON GEMV col-major path"

[[claim]]
op = "MatMul"
variant = "f16_m_ge2"
platform = "aarch64-apple-darwin"
minimum_tier = "tier1"
counter = "BNNS_F16_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/matmul.rs"
description = "M>=2 prefill uses BNNS/AMX"
# Proves: fp16_m_ge2_prefill_reaches_bnns_not_half_gemm

[[claim]]
op = "MatMul"
variant = "f32_thin_m"
platform = "aarch64-apple-darwin"
minimum_tier = "tier2"
counter = "THIN_M_GEMM_TEST_HITS"
file = "crates/onnx-runtime-ep-cpu/src/kernels/matmul.rs"
description = "M=2..16 f32 prefill with large B uses column-parallel NEON, not cblas_sgemm"
# Proves: f32_thin_m_prefill_reaches_neon_col_parallel

