# NVIDIA Nemotron 3.5 ASR Streaming 0.6B streaming RNN-T metadata.
# Obtain the inspected ONNX package from Foundry Local using catalog alias
# `nemotron-3.5-asr-streaming-0.6b` (artifact
# `nemotron-3.5-asr-streaming-0.6b-generic-cpu:3`).
# This is a METADATA-CONTRACT example: it shows what the schema can DESCRIBE,
# not a claim that the current engine executes streaming ASR end to end.
# See README.md, "Fit and gaps", for the difference between this contract and what runs.

# Multi-component pipeline. This document omits unrelated top-level LLM fields.
pipeline:
  # Named package components. Model filenames are relative to the package root.
  models:
    audio_features:
      filename: audio_processor_config.json # Frontend configuration, not an ONNX graph.
      type: audio_feature_extractor # Generic role for producing model-ready audio features.
    vad:
      filename: silero_vad.onnx # Real Silero voice-activity-detection graph.
      type: audio_vad # Generic role for optional speech-presence detection.
    audio_encoder:
      filename: encoder.onnx # Real streaming acoustic encoder graph.
      type: audio_encoder # Generic component role for encoded audio features.
      io:
        # Fixed-shape recurrent state; each output replaces its paired input on
        # the next chunk. These are not growing transformer KV caches.
        state_pairs:
          - input: cache_last_channel # Real encoder input f32 [1,24,56,1024].
            output: cache_last_channel_next # Matching next-state graph output.
            init: zeros # Materialize an all-zero tensor before the first chunk.
            update: replace # Feed the complete output back as the next input.
          - input: cache_last_time # Real encoder input f32 [1,24,1024,8].
            output: cache_last_time_next # Matching temporal-cache graph output.
            init: zeros # Zero-initialize the fixed cache for the first chunk.
            update: replace # Replace, rather than append to, the prior state.
          - input: cache_last_channel_len # Real encoder input int64 [1].
            output: cache_last_channel_len_next # Matching valid-length output.
            init: zeros # Initial cached-channel length is zero.
            update: replace # Carry the new length into the next chunk.
    prediction_network:
      filename: decoder.onnx # Real LSTM RNN-T prediction network.
      type: decoder # Decoder role enables an autoregressive child strategy.
      tokenizer: tokenizer.json # Tokenizer path relative to the package root.
      io:
        sequence_source: token_ids # Drive prediction with integer transcript symbols.
        token_input: targets # Matches decoder input int64 [batch,target_len].
        hidden_output: decoder_output # Matches output f32 [batch,640,target_len].
        # LSTM hidden and cell states are fixed recurrent tensors.
        state_pairs:
          - input: h_in # Real LSTM hidden-state input f32 [2,batch,640].
            output: h_out # Real next hidden-state output with the same shape.
            init: zeros # Start both LSTM layers with zero hidden state.
            update: replace # Use h_out as the complete h_in on the next symbol step.
          - input: c_in # Real LSTM cell-state input f32 [2,batch,640].
            output: c_out # Real next cell-state output with the same shape.
            init: zeros # Start both LSTM layers with zero cell state.
            update: replace # Use c_out as the complete c_in on the next symbol step.
    joiner:
      filename: joint.onnx # Real RNN-T joint network.
      type: decoder # Generic decoder-like role; it emits vocabulary logits.
      io:
        logits_output: joint_output # Real output f32 [batch,time,target_len,13088].

  # Whole-tensor routes. Edges declare endpoints, dtype, and optional device
  # movement only; they cannot declare transforms such as transpose.
  dataflow:
    - from: audio_features.audio_signal # Frontend output f32 [1,65,128].
      to: audio_encoder.audio_signal # Matches real encoder graph feature input.
      dtype: fp32 # Boundary tensor scalar dtype.
      device_transfer: false # Producer and consumer are expected on the same device.
    - from: audio_features.length # Frontend output containing valid feature length.
      to: audio_encoder.length # Matches real encoder input int64 [1].
      dtype: int64 # Boundary tensor scalar dtype.
      device_transfer: false # No cross-device copy is requested.
    - from: audio_encoder.outputs # Real encoded audio output f32 [1,7,1024].
      to: joiner.encoder_output # Matches joint.onnx encoder input [batch,time,1024].
      dtype: fp32 # Boundary tensor scalar dtype.
      device_transfer: false # No cross-device copy is requested.
    # No prediction_network.decoder_output -> joiner.decoder_output edge is
    # declared: the real ports require [B,640,T] -> [B,T,640], and DataflowEdge
    # has no layout-transform field. See README.md for this executable gap.

  # Ordered high-level plan; composite stages may use different loop strategies.
  phases:
    audio_encoder:
      run_on: every_step
    audio_features:
      run_on: every_step
    joiner:
      run_on: every_step
  strategy:
    kind: composite # Execute the named child stages as one pipeline.
    stages:
      - name: voice_activity_detection # Optional speech-detection stage.
        strategy:
          kind: single_pass # Invoke the VAD graph once per explicit request.
          model: vad # Component name from `pipeline.models`.
      - name: predict_transcript_symbol # RNN-T prediction-network stage.
        strategy:
          kind: autoregressive # Runtime-managed token/symbol loop declaration.
          decoder: prediction_network # Decoder component named above.
          max_tokens: 10 # Maximum generated symbols for this stage; count, not milliseconds.
  # Component-level phase and request-presence gates.
