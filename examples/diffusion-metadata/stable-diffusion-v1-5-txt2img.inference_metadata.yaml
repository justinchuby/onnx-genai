# Stable Diffusion v1.5 text-to-image latent-diffusion pipeline metadata.
# Obtain the source model from runwayml/stable-diffusion-v1-5 (also mirrored as
# stable-diffusion-v1-5/stable-diffusion-v1-5) and export its ONNX components
# with `optimum-cli export onnx` / `ORTStableDiffusionPipeline`.
# This is a METADATA-CONTRACT example: it shows what the schema can DESCRIBE.
# See README.md, "Known contract gaps", for what the current image path actually runs.
#
# There is no token-generation loop:
#   text_encoder (CLIP) --once--> conditioning
#   denoiser (UNet) --25 scheduler steps--> loop-carried latent
#   vae_decoder --once--> RGB image
#
# Standard 512x512 component interfaces (batch = 1):
#   text_encoder.input_ids            int64 [1,77]
#   text_encoder.last_hidden_state    fp32  [1,77,768]
#   denoiser.sample                   fp32  [1,4,64,64]
#   denoiser.timestep                 fp32  [] in the export
#   denoiser.encoder_hidden_states    fp32  [1,77,768]
#   denoiser.out_sample               fp32  [1,4,64,64]
#   vae_decoder.latent_sample         fp32  [1,4,64,64]
#   vae_decoder.sample                fp32  [1,3,512,512]

# Declarative multi-model pipeline and its tensor routes.
pipeline:
  # Named executable ONNX components; filenames are package-relative.
  models:
    text_encoder:
      filename: text_encoder/model.onnx # Real diffusers CLIP text-encoder path.
      type: encoder # Generic encoder role.
      tokenizer: tokenizer.json # Tokenizer path relative to the model package.
    denoiser:
      filename: unet/model.onnx # Real UNet2DConditionModel ONNX path.
      type: denoiser # Generic iterative noise-prediction role.
    vae_decoder:
      filename: vae_decoder/model.onnx # Real AutoencoderKL decode graph path.
      type: vae # Generic variational-autoencoder component role.

  # Directed whole-tensor connections in `component.port` form.
  dataflow:
    # CLIP conditioning feeds the UNet cross-attention on every denoise step.
    - from: text_encoder.last_hidden_state # Real CLIP output f32 [1,77,768].
      to: denoiser.encoder_hidden_states # Real UNet conditioning input.
      dtype: fp32 # Scalar dtype at the component boundary.
    # The scheduler converts each UNet noise prediction into the next latent;
    # the self-edge declares which output and input carry that loop state.
    - from: denoiser.out_sample # Real UNet epsilon/noise output [1,4,64,64].
      to: denoiser.sample # Real UNet latent input for the following step.
      dtype: fp32 # Scalar dtype of the loop-carried latent.
    # Route the final latent into the VAE decoder.
    - from: denoiser.sample # Final scheduler-updated latent endpoint.
      to: vae_decoder.latent_sample # Real VAE input [1,4,64,64].
      dtype: fp32 # Scalar dtype at the final decode boundary.

  # Bounded scheduler-driven loop rather than autoregressive token generation.
  strategy:
    kind: iterative # Repeated denoising/another bounded iterative strategy.
    denoiser: denoiser # Component name invoked on every loop iteration.
    num_steps: 25 # Number of inference denoise iterations.
    timestep_input: timestep # Matches UNet input `timestep`; receives per-step f32.
    # Classifier-free guidance performs conditional and unconditional denoiser
    # passes. The runtime supplies negative-prompt conditioning at
    # `denoiser.encoder_hidden_states.uncond`.
    cfg_conditioning_input: encoder_hidden_states # UNet port zeroed/replaced for uncond pass.
    guidance_scale: 7.5 # Non-negative CFG multiplier; 1.0 means no guidance combination.
    scheduler_config:
      kind: euler # Registry also includes ddpm/ddim/euler_ancestral/dpmpp_2m/flow_matching/masked.
      num_train_timesteps: 1000 # Training-time schedule length in discrete steps.
      beta_start: 0.00085 # First variance beta in the training noise schedule.
      beta_end: 0.012 # Last variance beta in the training noise schedule.
      beta_schedule: scaled_linear # Stable-Diffusion-style beta schedule shape.
      prediction_type: epsilon # Diffusion schedulers also support v_prediction and sample/x0.
      use_karras_sigmas: true # Use rho=7 Karras sigma spacing for Euler inference steps.

  # Per-component execution-phase gates.
  phases:
    text_encoder:
      run_on: prompt_only # Encode prompt text once before the denoise loop.
    denoiser:
      run_on: every_step # Invoke the UNet for every iterative scheduler step.
    vae_decoder:
      run_on: final_only # Decode pixels only after the last latent update.
