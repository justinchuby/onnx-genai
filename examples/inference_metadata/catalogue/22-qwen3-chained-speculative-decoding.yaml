# Canonical real-package shape for an autoregressive proposer whose next step
# consumes the previous token embedding, recycled hidden activation, and draft
# KV state. Names in the schema remain model-agnostic; artifact paths identify
# this concrete Qwen3 package.
schema_version: v1
pipeline:
  workflow:
    manifest:
      capabilities: [workflow_ssa, typed_emit, serving_service_contract]
    inputs:
      request.input_ids:
        contract: {dtype: int64, shape: [batch, sequence], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: runtime, version: '1.0', role: prompt_tokens}
        source: {kind: request}
        required: true
      request.active:
        contract: {dtype: bool, shape: [batch], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: active}
        required: true
      request.done:
        contract: {dtype: bool, shape: [batch], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: done}
        required: true
      request.accepted_len:
        contract: {dtype: int64, shape: [batch], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: accepted_len}
        required: true
      request.target_cache:
        contract: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: target_cache}
        required: true
      request.draft_cache:
        contract: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: draft_cache}
        required: true
      request.recycled_hidden:
        contract: {dtype: float16, shape: [batch, sequence, hidden], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: recycled_hidden}
        required: true
    outputs:
      logits:
        contract: {dtype: float16, shape: [batch, proposal, target_vocab], batch_layout: {kind: request_aligned, axis: 0}}
        role: tensor
        family: { kind: materialized }
        stage: pre_adapter
    components:
      proposer:
        implementation: {kind: onnx, artifact: proposer/model.onnx.textproto}
        ports:
          inputs:
            inputs_embeds: {dtype: float16, shape: [batch, sequence, hidden], batch_layout: {kind: request_aligned, axis: 0}}
            fused_hidden: {dtype: float16, shape: [batch, sequence, fused_hidden], batch_layout: {kind: request_aligned, axis: 0}}
            recycled_hidden: {dtype: float16, shape: [batch, sequence, hidden], batch_layout: {kind: request_aligned, axis: 0}}
            past_key_values: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
          outputs:
            draft_logits: {dtype: float16, shape: [batch, sequence, draft_vocab], batch_layout: {kind: request_aligned, axis: 0}}
            next_hidden: {dtype: float16, shape: [batch, sequence, hidden], batch_layout: {kind: request_aligned, axis: 0}}
            present_key_values: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
      verifier:
        implementation: {kind: onnx, artifact: verifier/model.onnx.textproto}
        ports:
          inputs:
            input_ids: {dtype: int64, shape: [batch, proposal], batch_layout: {kind: request_aligned, axis: 0}}
            past_key_values: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
          outputs:
            logits: {dtype: float16, shape: [batch, proposal, target_vocab], batch_layout: {kind: request_aligned, axis: 0}}
            present_key_values: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
          roles: {input_ids: token_ids, logits: logits}
    state:
      target_cache:
        contract: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        scope: invocation
        initializer: request.target_cache
        recurrence: {kind: invariant}
        management: runtime
        release_boundary: invocation
        service_group: target_cache
      draft_cache:
        contract: {dtype: float16, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        scope: invocation
        initializer: request.draft_cache
        recurrence: {kind: invariant}
        management: runtime
        release_boundary: invocation
        service_group: draft_cache
      recycled_hidden:
        contract: {dtype: float16, shape: [batch, sequence, hidden], batch_layout: {kind: request_aligned, axis: 0}}
        scope: invocation
        initializer: request.recycled_hidden
        recurrence: {kind: invariant}
        management: runtime
        release_boundary: invocation
        service_group: proposer_hidden
    steps:
    - kind: invoke
      component: proposer
      inputs:
        inputs_embeds: request.recycled_hidden
        fused_hidden: request.recycled_hidden
        recycled_hidden: request.recycled_hidden
        past_key_values: request.draft_cache
      outputs:
        draft_logits: draft.logits
        next_hidden: draft.next_hidden
        present_key_values: draft.present
    - kind: invoke
      component: verifier
      inputs: {input_ids: request.input_ids, past_key_values: request.target_cache}
      outputs: {logits: target.logits, present_key_values: target.present}
    - kind: emit
      value: target.logits
      output: logits
      mode: replace
    serving:
      active: request.active
      done: request.done
      accepted_len: request.accepted_len
      state_service:
        groups:
          target_cache:
            kind: full_attention
            sequence_axis: 2
            layout: bnsh
            update: {kind: append}
            capabilities: {rollback_positions: 6, snapshot: true, fork: true}
            ports:
              verifier:
                target_cache: {input: past_key_values, output: present_key_values}
          draft_cache:
            kind: full_attention
            sequence_axis: 2
            layout: bnsh
            update: {kind: append}
            capabilities: {rollback_positions: 6, snapshot: true, fork: true}
            ports:
              proposer:
                draft_cache: {input: past_key_values, output: present_key_values}
          proposer_hidden:
            kind: recurrent
            layout: bsh
            update: {kind: replace}
            capabilities: {rollback_positions: 6, snapshot: true, fork: true}
            ports:
              proposer:
                recycled_hidden: {input: recycled_hidden, output: next_hidden}
speculative:
  proposer: proposer
  target: verifier
  proposal_execution:
    kind: chained
    token_embedding_input: inputs_embeds
    logits_output: draft_logits
    recurrent:
    - {state: draft_cache, input: past_key_values, output: present_key_values}
    - {state: recycled_hidden, input: recycled_hidden, output: next_hidden}
  port_bindings:
    target_hidden_context: fused_hidden
  shared_weights: [target_embedding.f32]
  vocabulary: {kind: mapped, artifact: draft_to_target.i64}
  max_proposal_width: 6
  distribution_preserving: true
  rollback_state: [target_cache, draft_cache, recycled_hidden]
