<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ONNX GenAI inference metadata visualizer</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#5d687c;--line:#d8deea;--accent:#3157d5;--accent2:#e8edff;--good:#18794e;--warn:#9a6700;--bad:#c53434;--shadow:0 8px 28px #18305a18}
    @media(prefers-color-scheme:dark){:root{--bg:#0e1420;--panel:#171f2e;--text:#edf2fb;--muted:#a8b2c5;--line:#344056;--accent:#91a7ff;--accent2:#263356;--good:#64d99b;--warn:#f3c969;--bad:#ff8c8c;--shadow:0 8px 28px #0007}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,.button{font:inherit}
    .app-shell{max-width:1680px;min-height:100vh;margin:auto;display:grid;grid-template-columns:264px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
    header{padding:2px 4px 4px}header h1{font-size:20px;line-height:1.15;margin:0 0 6px}header p{margin:0;color:var(--muted);font-size:12px}
    .toolbar,.panel,.card,.dropzone{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.toolbar{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.toolbar button,.button{min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 9px;border-radius:8px;cursor:pointer;text-align:center}.toolbar button:hover,.toolbar button:focus-visible,.button:hover,.button:focus-visible{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent)}.toolbar .primary,.toolbar .status{grid-column:1/-1}.primary{background:var(--accent)!important;color:#fff!important;border-color:transparent!important}#fileInput{position:absolute;clip:rect(0 0 0 0)}.status{color:var(--muted);font-variant-numeric:tabular-nums}.toolbar .status{padding:5px 2px 0;font-size:12px;overflow-wrap:anywhere}
    .dropzone{padding:12px;text-align:left;border:1px dashed var(--line)}.dropzone.drag{border-color:var(--accent);background:var(--accent2)}.dropzone strong{display:block;font-size:13px}.dropzone span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.dropzone textarea{width:100%;min-height:120px;margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical}
    .nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow:auto;padding:8px 0 10px;background:var(--bg);border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:8px 10px;cursor:pointer}.nav button:hover{color:var(--text)}.nav button.active{color:var(--accent);border-color:var(--accent)}
    .content{min-width:0;padding:20px}.content>footer{color:var(--muted);text-align:center;padding:18px}main{display:grid;gap:16px}.view{display:none}.view.active{display:block}.panel{padding:18px;margin-bottom:16px}.panel h2{margin:0 0 14px;font-size:20px}.panel h3{margin:16px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{padding:14px;box-shadow:none;min-width:0}.card h3,.card h4{margin:0 0 8px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border-radius:999px;padding:3px 8px;background:var(--accent2);color:var(--text);font-size:12px}.kv{display:grid;grid-template-columns:minmax(90px,.7fr) minmax(0,1.3fr);gap:5px 10px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.value{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .capability-list{display:flex;flex-wrap:wrap;gap:7px}.capability{position:relative;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:999px;padding:5px 9px;background:var(--accent2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;cursor:help;overflow-wrap:anywhere}.capability:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent)}.capability-tooltip{position:absolute;left:0;top:calc(100% + 8px);z-index:20;width:max-content;max-width:min(340px,calc(100vw - 40px));padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s,transform .12s,visibility .12s}.capability-tooltip strong{display:block;margin-bottom:3px;color:var(--accent);text-transform:capitalize}.capability:hover .capability-tooltip,.capability:focus .capability-tooltip{opacity:1;visibility:visible;transform:none}
    .reference-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.reference-list{display:grid}.reference-item{padding:9px 0;border-top:1px solid var(--line)}.reference-item:first-child{border-top:0}.reference-item code{display:block;margin-bottom:3px;color:var(--accent);font-weight:650;overflow-wrap:anywhere}.reference-item p{margin:0;color:var(--muted);font-size:13px}
    .diag{border-left:4px solid var(--warn);padding:9px 12px;background:color-mix(in srgb,var(--warn) 10%,var(--panel));margin:7px 0}.diag.error{border-color:var(--bad)}.diag.note{border-color:var(--accent)}.good{color:var(--good)}
    .ports{display:grid;grid-template-columns:1fr 1fr;gap:12px}.port{border-left:3px solid var(--accent);padding-left:8px;margin:5px 0}.flow{overflow:auto;min-height:160px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#111}.flow svg{max-width:100%;height:auto}.fallback{white-space:pre-wrap;font-family:ui-monospace,monospace}.timeline{list-style:none;padding-left:16px;border-left:2px solid var(--line)}.timeline li{margin:10px 0;position:relative}.timeline li:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);left:-21px;top:6px}.timeline .timeline{margin-top:8px}
    .state-group{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.state-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;align-items:center;border-top:1px solid var(--line);padding:7px 0}.state-row:first-of-type{border-top:0}.geometry{font-family:ui-monospace,monospace;color:var(--muted);font-size:12px}
    .tree-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tree-toolbar input{flex:1;min-width:220px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.tree details{margin-left:16px}.tree summary{cursor:pointer}.tree-row{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(0,1.3fr);gap:10px;padding:4px 6px;border-radius:5px}.tree-row.match{background:var(--accent2)}.tree-key{font-family:ui-monospace,monospace;color:var(--accent)}.empty{font-style:italic;color:var(--muted)}.uncovered{color:var(--bad)}
    .help{border:1px solid var(--line);border-radius:8px;padding:10px}.help summary{font-weight:650;cursor:pointer}.hidden{display:none!important}
    @media(max-width:900px){.app-shell{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}header p{max-width:640px}.toolbar{grid-template-columns:repeat(3,1fr)}.toolbar .primary{grid-column:auto}.toolbar .status{grid-column:1/-1}.dropzone textarea{min-height:90px}.content{padding:12px}}
    @media(max-width:700px){.ports{grid-template-columns:1fr}.state-row{grid-template-columns:60px 1fr}.state-row .geometry{grid-column:2}.toolbar{grid-template-columns:1fr 1fr}.toolbar .primary{grid-column:1/-1}}
    @media print{.app-shell{display:block;max-width:none}.sidebar{display:none}.content{padding:0}#loadError{display:none!important}.view{display:block!important}.panel,.card{box-shadow:none;break-inside:avoid}.flow{max-height:none}}
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <header><h1>Inference metadata</h1><p>Inspect packages, workflows, state, and data contracts locally.</p></header>
    <div class="toolbar" aria-label="Document actions">
      <label class="button primary" for="fileInput">Open file</label><input id="fileInput" type="file" accept=".yaml,.yml,.json,application/json,text/yaml">
      <button id="sampleBtn">Sample</button><button id="pasteBtn">Load text</button><button id="exportBtn" disabled>Export</button><button id="printBtn">Print</button><button id="resetBtn">Reset</button>
      <span id="status" class="status" role="status">No document loaded</span>
    </div>
    <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Drop a metadata file or press Enter to choose a file">
      <strong>Drop YAML or JSON</strong><span>Processed only in this tab.</span>
      <textarea id="pasteArea" aria-label="Paste YAML or JSON metadata" placeholder="Or paste metadata here…"></textarea>
    </section>
  </aside>
  <div class="content">
    <div id="loadError" class="diag error hidden" role="alert"></div>
    <nav id="nav" class="nav hidden" aria-label="Visualizer views"></nav>
    <main id="main" class="hidden">
      <section id="overview" class="view"></section><section id="workflow" class="view"></section><section id="state" class="view"></section>
      <section id="contracts" class="view"></section><section id="advanced" class="view"></section><section id="document" class="view"></section><section id="reference" class="view"></section>
    </main>
    <footer>For authoritative schema and package validation, use the ONNX GenAI CLI.</footer>
  </div>
</div>

    renderedPaths=new Set();const root=clear($("document")),tree=el("div",{class:"tree"}),search=el("input",{type:"search",placeholder:"Filter by full path or value…","aria-label":"Filter full document paths"}),counter=el("strong",{}),uncovered=el("div",{class:"uncovered"});
    tree.append(treeNode(doc,"$","$"));const update=()=>{const q=search.value.toLowerCase();let shown=0;tree.querySelectorAll(".tree-row").forEach(row=>{const hit=!q||(row.dataset.path+" "+row.textContent).toLowerCase().includes(q);row.classList.toggle("hidden",!hit);row.classList.toggle("match",!!q&&hit);if(hit)shown++});counter.textContent=`${renderedPaths.size}/${f.leaves.length} leaves rendered · ${shown} visible`;};search.addEventListener("input",update);
    const missing=f.leaves.map(x=>x.path).filter(p=>!renderedPaths.has(p));uncovered.textContent=missing.length?"Uncovered: "+missing.join(", "):"Uncovered: none — recursive tree accounts for 100% of parsed leaves.";
    root.append(section("Full recursive document","Unknown future fields render automatically. Null, false, zero, empty string, empty objects and empty lists are preserved.",el("div",{class:"tree-toolbar"},search,counter),uncovered,tree));update();
  }
  function renderReference(){
    const root=clear($("reference")),capabilityGroups=new Map();
    for(const [name,help] of Object.entries(CAPABILITY_HELP)){if(!capabilityGroups.has(help.category))capabilityGroups.set(help.category,[]);capabilityGroups.get(help.category).push({term:name,description:help.description})}
    const capabilityGrid=el("div",{class:"reference-grid"});for(const [category,items] of capabilityGroups)capabilityGrid.append(referenceCard(category,items,"built-in capabilities"));
    root.append(section("Capability catalogue","All 29 built-in identifiers from docs/genai/INFERENCE_METADATA_DECISIONS.md §4.3a. Extension-defined strings remain valid but are documented by their producer.",capabilityGrid));
    const loopItems=[
      {term:"predicate (default)",description:"General pre-test loop. continue_when is evaluated before iteration zero; false produces a zero-trip loop. The predicate is always honored, and max_iterations remains a hard safety bound."},
      {term:"generation_eos",description:"Autoregressive generation loop whose predicate represents EOS completion. With stop_on_eos disabled, the loop ignores EOS and runs until max_iterations."},
      {term:"continue_when: bool[] | bool[B]",description:"Singleton or per-row continuation value. Inactive rows preserve their carried values while active rows advance."},
      {term:"max_iterations",description:"Required integer upper bound for every loop, independent of predicate termination."}
    ];
    const predicateContracts=[
      {term:"onnx-genai.termination-predicate@1",description:"Inputs tokens, eos_ids, iteration, and max_iterations; returns per-row done. Boolean inversion for loop continuation is an explicit workflow component."},
      {term:"onnx-genai.termination-predicate@2",description:"Batch-safe form with eos_lengths and active inputs; returns done, next_active, and singleton continue. Inactive rows cannot reactivate."}
    ];
    const workflowNodes=[
      {term:"sequence",description:"Orders child nodes."},
      {term:"invoke",description:"Binds named SSA values to a component's input and output ports."},
      {term:"loop",description:"Declares setup, repeated body, continuation, iteration bound/value, and carried state."},
      {term:"branch",description:"Selects one case and exports only declared phi results and effect joins."},
      {term:"emit",description:"Publishes a streaming or final package output."}
    ];
    const implementationKinds=[
      {term:"onnx",description:"Portable ONNX artifact, preferred when it enables graph composition and optimization."},
      {term:"binding",description:"Runtime-provided native implementation of a declared component contract."},
      {term:"adapter",description:"Versioned adapter ABI, optionally backed by an artifact."}
    ];
    const emitModes=[
      {term:"replace",description:"Replaces the output with the emitted value."},
      {term:"append",description:"Concatenates chunks along axis, defaulting to the final axis; rank-four or deeper values must declare axis."},
      {term:"event",description:"Publishes an incremental ordered event for an output in the events family."}
    ];
    const executionRules=[
      {term:"root steps",description:"Execute once per workflow invocation, in order."},
      {term:"loop.setup",description:"Executes once whenever that loop is entered."},
      {term:"loop.steps",description:"Execute once per active iteration."},
      {term:"state initializer",description:"Executes once when its session state cell is created."},
      {term:"SSA scope",description:"Values are produced once. Control-flow location defines lifetime; loop-carried values require an explicit carried cell."},
      {term:"transfer",description:"Planner-lowered internal IR only; authored metadata must not serialize transfer nodes."}
    ];
    root.append(section("Workflow quick reference","Loop behavior and structural workflow vocabulary from WORKFLOW_POLICY_COMPONENTS.md and INFERENCE_METADATA_DECISIONS.md.",el("div",{class:"reference-grid"},referenceCard("Loop termination",loopItems),referenceCard("Termination contracts",predicateContracts),referenceCard("Workflow nodes",workflowNodes),referenceCard("Component implementations",implementationKinds),referenceCard("Emit modes",emitModes),referenceCard("Execution & scope",executionRules))));
  }
  function activate(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));document.querySelectorAll("#nav button").forEach(b=>{const on=b.dataset.view===id;b.classList.toggle("active",on);b.setAttribute("aria-current",on?"page":"false")})}
  async function load(text,name){try{doc=H.parseMetadata(text);sourceName=name;const f=H.featureSummary(doc);$("loadError").classList.add("hidden");$("main").classList.remove("hidden");$("nav").classList.remove("hidden");$("exportBtn").disabled=false;renderOverview(f);renderWorkflow(f);renderState(f);renderContracts(f);renderAdvanced(f);renderDocument(f);renderReference();activate("overview");$("status").textContent=`${name} · ${f.leaves.length}/${f.leaves.length} leaves`;history.replaceState(null,"","#overview")}catch(err){$("loadError").textContent=String(err.message||err);$("loadError").classList.remove("hidden")}}
  const views=[["overview","Overview"],["workflow","Workflow"],["state","State & serving"],["contracts","Data contracts"],["advanced","Advanced"],["document","Full document"],["reference","Reference"]];
  for(const [id,label] of views)$("nav").append(el("button",{dataset:{view:id},onclick:()=>{activate(id);history.replaceState(null,"","#"+id)}},label));
  $("fileInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(t=>load(t,f.name))});$("sampleBtn").addEventListener("click",()=>load(sample,"built-in-sample.yaml"));$("pasteBtn").addEventListener("click",()=>load($("pasteArea").value,"pasted metadata"));
  $("printBtn").addEventListener("click",()=>window.print());$("resetBtn").addEventListener("click",()=>location.reload());$("exportBtn").addEventListener("click",()=>{if(!doc)return;const blob=new Blob([JSON.stringify(doc,null,2)],{type:"application/json"}),a=el("a",{download:(sourceName.replace(/\.(yaml|yml|json)$/i,"")||"inference_metadata")+".json",href:URL.createObjectURL(blob)});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)});
  const dz=$("dropzone");for(const type of ["dragenter","dragover"])dz.addEventListener(type,e=>{e.preventDefault();dz.classList.add("drag")});for(const type of ["dragleave","drop"])dz.addEventListener(type,e=>{e.preventDefault();dz.classList.remove("drag")});dz.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)f.text().then(t=>load(t,f.name));else{const t=e.dataTransfer.getData("text/plain");if(t)load(t,"dropped text")}});dz.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target===dz)$("fileInput").click()});window.addEventListener("paste",e=>{if(document.activeElement!==$("pasteArea")&&e.clipboardData?.getData("text/plain")){$("pasteArea").value=e.clipboardData.getData("text/plain")}});
})();
