# Tiny nested-autoregressive (multi-decoder TTS) pipeline fixture.
# Built by scripts/build_tiny_tts_nested.py; exercises the nested_autoregressive
# contract (DESIGN.md §20.3): an OUTER talker AR loop where each frame drives an
# INNER code_predictor AR loop of num_code_groups steps, seeded by the talker's
# last_hidden_state. Assembled codes are published as `talker.output_codes`
# [1, frames, num_code_groups] and vocoded into a waveform.
pipeline:
  models:
    talker:
      filename: talker.onnx.textproto
      type: decoder
      tokenizer: tokenizer.json
      io:
        token_input: decoder_input_ids
        position_ids_input: position_ids
        logits_output: logits
        kv_inputs:
          - past_key_values.0.key
          - past_key_values.0.value
        kv_outputs:
          - present.0.key
          - present.0.value
    code_predictor:
      filename: code_predictor.onnx.textproto
      type: decoder
      io:
        sequence_source: inputs_embeds
        inputs_embeds_input: inputs_embeds
        logits_output: logits
        kv_inputs:
          - past_key_values.0.key
          - past_key_values.0.value
        kv_outputs:
          - present.0.key
          - present.0.value
    vocoder:
      filename: vocoder.onnx.textproto
      type: vocoder
  dataflow:
    # Per-frame hidden binding: inner step 0 seed.
    - from: talker.last_hidden_state
      to: code_predictor.inputs_embeds
      dtype: fp32
      device_transfer: false
    # Assembled per-frame codes -> vocoder.
    - from: talker.output_codes
      to: vocoder.codes
      dtype: int64
      device_transfer: false
  strategy:
    kind: composite
    stages:
      - name: generate_codes
        strategy:
          kind: nested_autoregressive
          outer: talker
          inner: code_predictor
          inner_embedding_output: code_embeds
          num_code_groups: 4
          max_tokens: 3
      - name: vocode
        strategy:
          kind: single_pass
          model: vocoder
  phases:
    talker:
      run_on: every_step
    code_predictor:
      run_on: every_step
    vocoder:
      run_on: final_only
  audio:
    sample_rate: 16000
    output: vocoder.audio
