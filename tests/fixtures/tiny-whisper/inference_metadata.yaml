pipeline:
  models:
    encoder:
      filename: encoder.onnx.textproto
      type: encoder
    decoder:
      filename: decoder.onnx.textproto
      type: decoder
      tokenizer: tokenizer.json
      io:
        token_input: decoder_input_ids
        position_ids_input: position_ids
        logits_output: logits
        encoder_hidden_states_input: encoder_hidden_states
        kv_inputs:
          - past_key_values.0.key
          - past_key_values.0.value
        kv_outputs:
          - present.0.key
          - present.0.value
  dataflow:
    - from: encoder.encoder_hidden_states
      to: decoder.encoder_hidden_states
      dtype: fp32
      device_transfer: false
  strategy:
    kind: composite
    stages:
      - name: encode_audio
        strategy:
          kind: single_pass
          model: encoder
      - name: decode_transcript
        strategy:
          kind: autoregressive
          decoder: decoder
          max_tokens: 4
  phases:
    encoder:
      run_on: prompt_only
    decoder:
      run_on: every_step
