# Executable tiny Gemma4 target+assistant CHAINED speculative fixture.
#
# Reuses the proven tiny-gemma4-assistant graphs (hidden 16, 2H=32, vocab 32,
# kv_heads 2, head_dim 8, 2 target layers: layer 0 = sliding owner, layer 1 =
# full owner) and drives them via the onnx-genai #1716 `proposal_execution:
# chained` contract (metadata-driven), NOT the legacy SharedKvProposerConfig.
#
# Assistant is a borrowed-KV drafter: inputs_embeds [b,q,2H] + read_only
# shared_kv.{full,sliding}_attention.{key,value} -> logits + projected_state
# (folded carry). No own KV, no present.*. Greedy / logits-emit (external
# argmax), standard ops only (ORT ∩ native CPU EP). Both graphs are FLOAT (f32).
schema_version: v1
model:
  vocab_size: 32
  max_sequence_length: 16
pipeline:
  workflow:
    manifest:
      capabilities: [workflow_ssa, typed_emit, serving_service_contract, bounded_state_recurrence]
    inputs:
      request.active:
        contract: {dtype: bool, rank: 1, shape: [batch], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: active}
        required: true
      request.done:
        contract: {dtype: bool, rank: 1, shape: [batch], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: done}
        required: true
      request.accepted_len:
        contract: {dtype: int64, rank: 1, shape: [batch], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: accepted_len}
        required: true
      request.input_ids:
        contract: {dtype: int64, rank: 2, shape: [batch, sequence], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: runtime, version: '1.0', role: prompt_tokens}
        source: {kind: request}
        required: true
      request.attention_mask:
        contract: {dtype: int64, rank: 2, shape: [batch, sequence], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: attention_mask}
        required: true
      request.position_ids:
        contract: {dtype: int64, rank: 2, shape: [batch, sequence], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: position_ids}
        required: true
      request.inputs_embeds:
        contract: {dtype: float32, rank: 3, shape: [batch, sequence, fused_hidden], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: inputs_embeds}
        required: true
      request.past_key_values.0.key:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: past_key_values.0.key}
        required: true
      request.past_key_values.0.value:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: past_key_values.0.value}
        required: true
      request.past_key_values.1.key:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: past_key_values.1.key}
        required: true
      request.past_key_values.1.value:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: past_key_values.1.value}
        required: true
      request.shared_kv.full_attention.key:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: shared_kv.full_attention.key}
        required: true
      request.shared_kv.full_attention.value:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: shared_kv.full_attention.value}
        required: true
      request.shared_kv.sliding_attention.key:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: shared_kv.sliding_attention.key}
        required: true
      request.shared_kv.sliding_attention.value:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        role: {kind: opaque}
        source: {kind: application, name: shared_kv.sliding_attention.value}
        required: true
      package.max_context:
        contract: {dtype: int64, rank: 1, shape: [1]}
        role: {kind: opaque}
        source: {kind: literal}
        required: false
        default: 16
    outputs:
      logits:
        contract: {dtype: float32, rank: 3, shape: [batch, sequence, vocab], batch_layout: {kind: request_aligned, axis: 0}}
        role: tensor
        stage: pre_adapter
    state:
      past_key_values.0.key:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        class: semantic
        scope: invocation
        initializer: request.past_key_values.0.key
        recurrence: {kind: bounded, axis: 2, max: package.max_context}
        service_group: sliding_attention
        management: runtime
        release_boundary: invocation
      past_key_values.0.value:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        class: semantic
        scope: invocation
        initializer: request.past_key_values.0.value
        recurrence: {kind: bounded, axis: 2, max: package.max_context}
        service_group: sliding_attention
        management: runtime
        release_boundary: invocation
      past_key_values.1.key:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        class: semantic
        scope: invocation
        initializer: request.past_key_values.1.key
        recurrence: {kind: bounded, axis: 2, max: package.max_context}
        service_group: full_attention
        management: runtime
        release_boundary: invocation
      past_key_values.1.value:
        contract: {dtype: float32, rank: 4, shape: [batch, kv_heads, past_sequence, head_dim], batch_layout: {kind: request_aligned, axis: 0}}
        class: semantic
        scope: invocation
        initializer: request.past_key_values.1.value
        recurrence: {kind: bounded, axis: 2, max: package.max_context}
        service_group: full_attention
        management: runtime
        release_boundary: invocation
    components:
      assistant:
        implementation: {kind: onnx, artifact: assistant/model.onnx.textproto}
        ports:
          inputs:
            inputs_embeds:
              dtype: float32
              rank: 3
              shape: [batch, sequence, fused_hidden]
              batch_layout: {kind: request_aligned, axis: 0}
            position_ids:
              dtype: int64
              rank: 2
              shape: [batch, sequence]
              batch_layout: {kind: request_aligned, axis: 0}
            attention_mask:
              dtype: int64
              rank: 2
              shape: [batch, kv_sequence]
              batch_layout: {kind: request_aligned, axis: 0}
            shared_kv.full_attention.key:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            shared_kv.full_attention.value:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            shared_kv.sliding_attention.key:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            shared_kv.sliding_attention.value:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
          outputs:
            logits:
              dtype: float32
              rank: 3
              shape: [batch, sequence, vocab]
              batch_layout: {kind: request_aligned, axis: 0}
            projected_state:
              dtype: float32
              rank: 3
              shape: [batch, sequence, hidden]
              batch_layout: {kind: request_aligned, axis: 0}
      target:
        implementation: {kind: onnx, artifact: target/model.onnx.textproto}
        ports:
          inputs:
            input_ids:
              dtype: int64
              rank: 2
              shape: [batch, sequence]
              batch_layout: {kind: request_aligned, axis: 0}
            attention_mask:
              dtype: int64
              rank: 2
              shape: [batch, kv_sequence]
              batch_layout: {kind: request_aligned, axis: 0}
            position_ids:
              dtype: int64
              rank: 2
              shape: [batch, sequence]
              batch_layout: {kind: request_aligned, axis: 0}
            past_key_values.0.key:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, past_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            past_key_values.0.value:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, past_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            past_key_values.1.key:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, past_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            past_key_values.1.value:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, past_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
          outputs:
            logits:
              dtype: float32
              rank: 3
              shape: [batch, sequence, vocab]
              batch_layout: {kind: request_aligned, axis: 0}
            present.0.key:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            present.0.value:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            present.1.key:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            present.1.value:
              dtype: float32
              rank: 4
              shape: [batch, kv_heads, kv_sequence, head_dim]
              batch_layout: {kind: request_aligned, axis: 0}
            hidden_states.0:
              dtype: float32
              rank: 3
              shape: [batch, sequence, hidden]
              batch_layout: {kind: request_aligned, axis: 0}
    steps:
    - kind: invoke
      component: assistant
      inputs: {inputs_embeds: request.inputs_embeds, position_ids: request.position_ids, attention_mask: request.attention_mask, shared_kv.full_attention.key: request.shared_kv.full_attention.key, shared_kv.full_attention.value: request.shared_kv.full_attention.value, shared_kv.sliding_attention.key: request.shared_kv.sliding_attention.key, shared_kv.sliding_attention.value: request.shared_kv.sliding_attention.value}
      outputs: {logits: draft.logits, projected_state: draft.projected_state}
    - kind: invoke
      component: target
      inputs: {input_ids: request.input_ids, attention_mask: request.attention_mask, position_ids: request.position_ids, past_key_values.0.key: request.past_key_values.0.key, past_key_values.0.value: request.past_key_values.0.value, past_key_values.1.key: request.past_key_values.1.key, past_key_values.1.value: request.past_key_values.1.value}
      outputs: {logits: target.logits, present.0.key: target.past_key_values.0.key, present.0.value: target.past_key_values.0.value, present.1.key: target.past_key_values.1.key, present.1.value: target.past_key_values.1.value, hidden_states.0: target.hidden_states.0}
    - {kind: emit, value: target.logits, output: logits, mode: replace}
    serving:
      active: request.active
      done: request.done
      accepted_len: request.accepted_len
      state_service:
        groups:
          full_attention:
            kind: full_attention
            sequence_axis: 2
            layout: bnsh
            update: {kind: append}
            reuse: {prefix_reusable: true, evictable_prefix: false}
            capabilities: {rollback_positions: 4, snapshot: true, fork: true}
            ports:
              target:
                past_key_values.1.key: {input: past_key_values.1.key, output: present.1.key, role: key, layer: 1}
                past_key_values.1.value: {input: past_key_values.1.value, output: present.1.value, role: value, layer: 1}
              assistant:
                past_key_values.1.key: {input: shared_kv.full_attention.key, access: read_only, role: key}
                past_key_values.1.value: {input: shared_kv.full_attention.value, access: read_only, role: value}
          sliding_attention:
            kind: sliding_attention
            sequence_axis: 2
            layout: bnsh
            update: {kind: append}
            reuse: {prefix_reusable: true, evictable_prefix: true}
            capabilities: {rollback_positions: 4, snapshot: true, fork: true}
            ports:
              target:
                past_key_values.0.key: {input: past_key_values.0.key, output: present.0.key, role: key, layer: 0}
                past_key_values.0.value: {input: past_key_values.0.value, output: present.0.value, role: value, layer: 0}
              assistant:
                past_key_values.0.key: {input: shared_kv.sliding_attention.key, access: read_only, role: key}
                past_key_values.0.value: {input: shared_kv.sliding_attention.value, access: read_only, role: value}
speculative:
  proposer: assistant
  target: target
  proposal_execution: {kind: chained, token_embedding_input: inputs_embeds, logits_output: logits, folded_carry_output: projected_state}
  port_bindings: {target_hidden_context: inputs_embeds}
  shared_state: [full_attention, sliding_attention]
  vocabulary: {kind: identical}
  max_proposal_width: 4
  distribution_preserving: true
  rollback_state: [past_key_values.0.key, past_key_values.0.value, past_key_values.1.key, past_key_values.1.value]
