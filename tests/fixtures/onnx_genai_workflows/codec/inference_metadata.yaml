schema_version: v1
pipeline:
  workflow:
    manifest: {}
    inputs:
      request.waveform:
        contract:
          dtype: float32
          shape:
          - batch
          - 1
          - audio_samples
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: media
        source:
          kind: request
        required: true
    outputs:
      waveform:
        contract:
          dtype: float32
          shape:
          - batch
          - 1
          - audio_samples
          batch_layout:
            kind: request_aligned
            axis: 0
        role: audio
        stage: post_adapter
    components:
      encoder:
        implementation:
          kind: onnx
          artifact: encoder/model.onnx.textproto
      decoder:
        implementation:
          kind: onnx
          artifact: decoder/model.onnx.textproto
    steps:
    - kind: invoke
      component: encoder
      inputs:
        waveform: request.waveform
      outputs:
        codes: codec.codes
    - kind: invoke
      component: decoder
      inputs:
        codes: codec.codes
      outputs:
        waveform: codec.waveform
    - kind: emit
      value: codec.waveform
      output: waveform
      mode: replace
package:
  tokenizer:
    algorithm: bpe
    vocab_size: 32000
    byte_level: true
