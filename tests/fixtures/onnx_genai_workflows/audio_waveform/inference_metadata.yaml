          "output": "audio.mask",
          "mode": "replace"
        },
        {
          "kind": "emit",
          "value": "audio.valid_samples",
          "output": "audio.valid_samples",
          "mode": "replace"
        },
        {
          "kind": "emit",
          "value": "score",
          "output": "score",
          "mode": "replace"
        }
      ]
    }
  }
}
