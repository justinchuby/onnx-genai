          }
        }
      },
      "steps": [
        {
          "kind": "invoke",
          "component": "audio",
          "inputs": {
            "encoded": "encoded"
          },
          "outputs": {
            "raw": "audio.raw",
            "scaled": "audio.scaled",
            "normalized": "audio.normalized",
            "features": "audio.features",
            "mask": "audio.mask",
            "valid_samples": "audio.valid_samples"
          }
        },
        {
          "kind": "invoke",
          "component": "head",
          "inputs": {
            "features": "audio.features"
          },
          "outputs": {
            "score": "score"
          }
        },
        {
          "kind": "emit",
          "value": "audio.raw",
          "output": "audio.raw",
          "mode": "replace"
        },
        {
          "kind": "emit",
          "value": "audio.scaled",
          "output": "audio.scaled",
          "mode": "replace"
        },
        {
          "kind": "emit",
