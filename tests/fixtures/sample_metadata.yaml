model:
  attention:
    type: grouped_query
    num_kv_heads: 8
    num_attention_heads: 32
    head_dim: 128
    sliding_window: null
  max_sequence_length: 131072
  runtime_configurable:
    prefix_cache: true

hardware_requirements:
  min_memory_gb: 4.2
  required_dtypes: [fp16]
  beneficial_dtypes: [fp8_e4m3]
  kv_cache_memory_per_1k_tokens_mb: 128
