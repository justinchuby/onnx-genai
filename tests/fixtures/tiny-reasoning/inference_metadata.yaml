model:
  max_sequence_length: 16
  io:
    token_input: input_ids
    attention_mask_input: attention_mask
    position_ids_input: position_ids
    logits_output: logits
    kv_inputs:
      - past_key_values.0.key
      - past_key_values.0.value
    kv_outputs:
      - present.0.key
      - present.0.value

# Author-declared generation defaults. do_sample=true is what a reasoning
# model ships *because* greedy decoding degenerates; the runtime honors it
# unless the caller forces --greedy (sampling resolution order, #385/#392).
generation:
  do_sample: true
  temperature: 0.6
  top_k: 20
