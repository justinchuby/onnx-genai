# Tiny VLM that declares a full image-input contract: a typed preprocessing
# program bound to the encoder's pixel input, plus the placeholder expansion
# rules. Every number is fixture DATA; no model family is named.
schema_version: v1
preprocessing:
  image:
    transforms:
      - op: decode
        outputs: [decoded]
      - op: convert_rgb
        inputs: [decoded]
        outputs: [rgb]
      - op: resize
        inputs: [rgb]
        outputs: [resized]
        size: 2
        mode: fixed
        interpolation: bicubic
      - op: rescale
        inputs: [resized]
        outputs: [rescaled]
        scale: 0.00392156862745098
      - op: normalize
        inputs: [rescaled]
        outputs: [normalized]
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
    outputs:
      - source: normalized
        name: encoder.pixel_values
        content: pixels
        dtype: float32
pipeline:
  models:
    encoder:
      filename: encoder.onnx.textproto
      type: encoder
    decoder:
      filename: decoder.onnx.textproto
      type: decoder
      tokenizer: tokenizer.json
  dataflow:
    - from: encoder.image_features
      to: decoder.image_features
      dtype: fp32
      device_transfer: false
  strategy:
    kind: composite
    stages:
      - name: encode_image
        strategy:
          kind: single_pass
          model: encoder
      - name: decode_text
        strategy:
          kind: autoregressive
          decoder: decoder
          max_tokens: 4
  vision:
    image_placeholder_token_id: 3
    image_token_id: 4
    token_count_source: per_tile
    tokens_per_tile: 1
    placeholder_per_image: true
    image_correspondence: prompt_order
