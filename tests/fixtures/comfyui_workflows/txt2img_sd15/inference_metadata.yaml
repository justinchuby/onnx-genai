schema_version: v1.5
pipeline:
  workflow:
    manifest: {}
    inputs:
      request.input_ids:
        contract:
          dtype: int64
          shape:
          - batch
          - prompt_sequence
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: prompt_tokens
        source:
          kind: request
        required: true
      request.max_iterations:
        contract:
          dtype: int64
          shape:
          - 1
        role:
          kind: runtime
          version: '1.0'
          role: max_iterations
        source:
          kind: request
        required: false
        default: 4
      request.seed:
        contract:
          dtype: int64
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: seed
        source:
          kind: request
        required: false
        default: 20260821
      package.rng_offset:
        contract:
          dtype: int64
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0
      package.false:
        contract:
          dtype: bool
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: false
      package.loop_0_active:
        contract:
          dtype: bool
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      request.negative_input_ids:
        contract:
          dtype: int64
          shape:
          - batch
          - prompt_sequence
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: negative_prompt_tokens
        source:
          kind: application
          name: negative_input_ids
        required: true
      request.guidance_scale:
        contract:
          dtype: float32
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: guidance_scale
        source:
          kind: application
          name: guidance_scale
        required: false
        default: 7.5
    outputs:
      image:
        contract:
          dtype: float32
          shape:
          - batch
          - 3
          - height
          - width
          batch_layout:
            kind: request_aligned
            axis: 0
        role: image
        family:
          kind: materialized
        value_range: negative_one_to_one
        stage: pre_adapter
      latent:
        contract:
          dtype: float32
          shape:
          - batch
          - channels
          - latent_height
          - latent_width
          batch_layout:
            kind: request_aligned
            axis: 0
        role: tensor
        family:
          kind: materialized
        stage: pre_adapter
    components:
      diffusion_schedule:
        implementation:
          kind: onnx
          artifact: policies/diffusion_schedule.onnx.textproto
        ports:
          inputs: {}
          outputs:
            schedule:
              dtype: float32
              shape:
              - 5
        contract:
          id: onnx-genai.diffusion-schedule
          version: '1'
          bindings:
            schedule: schedule
          parameters:
            solver: euler
            spacing: karras
            prediction: epsilon
            steps: 4
      diffusion_timesteps:
        implementation:
          kind: onnx
          artifact: policies/diffusion_timesteps.onnx.textproto
        ports:
          inputs: {}
          outputs:
            schedule:
              dtype: float32
              shape:
              - 4
        contract:
          id: onnx-genai.diffusion-schedule
          version: '1'
          bindings:
            schedule: schedule
          parameters:
            solver: euler
            spacing: karras
            prediction: epsilon
            steps: 4
      schedule_lookup:
        implementation:
          kind: onnx
          artifact: policies/schedule_lookup.onnx.textproto
        ports:
          inputs:
            schedule:
              dtype: float32
              shape:
              - schedule_length
            step:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            timestep:
              dtype: float32
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
      model_input:
        implementation:
          kind: onnx
          artifact: policies/model_input.onnx.textproto
        ports:
          inputs:
            sample:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            step:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            schedule:
              dtype: float32
              shape:
              - schedule_length
          outputs:
            model_input:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
      continue_predicate:
        implementation:
          kind: onnx
          artifact: policies/continue_predicate.onnx.textproto
        ports:
          inputs:
            done:
              dtype: bool
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            continue:
              dtype: bool
              shape:
              - 1
      latent_row_shape:
        implementation:
          kind: onnx
          artifact: policies/latent_row_shape.onnx.textproto
        ports:
          inputs: {}
          outputs:
            shape:
              dtype: int64
              shape:
              - 3
      latent_noise:
        implementation:
          kind: onnx
          artifact: policies/latent_noise.onnx.textproto
        ports:
          inputs:
            seed:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            offset:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            row_shape:
              dtype: int64
              shape:
              - row_rank
          outputs:
            noise:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            next_offset:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
        contract:
          id: onnx-genai.counter-rng
          version: '1'
          bindings:
            seed: seed
            offset: offset
            row_shape: row_shape
            noise: noise
            next_offset: next_offset
      text_encoder:
        implementation:
          kind: onnx
          artifact: text_encoder/model.onnx.textproto
        ports:
          inputs:
            input_ids:
              dtype: int64
              shape:
              - batch
              - prompt_sequence
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            encoder_hidden_states:
              dtype: float32
              shape:
              - batch
              - prompt_sequence
              - hidden
              batch_layout:
                kind: request_aligned
                axis: 0
      denoiser:
        implementation:
          kind: onnx
          artifact: denoiser/model.onnx.textproto
        ports:
          inputs:
            sample:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            timestep:
              dtype: float32
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            encoder_hidden_states:
              dtype: float32
              shape:
              - batch
              - prompt_sequence
              - hidden
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            noise_pred:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
      guidance_combine:
        implementation:
          kind: onnx
          artifact: policies/guidance_combine.onnx.textproto
        ports:
          inputs:
            unconditional:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            conditional:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            scale:
              dtype: float32
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            estimate:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
        contract:
          id: onnx-genai.guidance-combine
          version: '1'
          bindings:
            unconditional: unconditional
            conditional: conditional
            scale: scale
            estimate: estimate
      solver_step:
        implementation:
          kind: onnx
          artifact: policies/solver_step.onnx.textproto
        ports:
          inputs:
            sample:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            estimate:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
            step:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            schedule:
              dtype: float32
              shape:
              - schedule_length
          outputs:
            next_state:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
        contract:
          id: onnx-genai.solver-step
          version: '1'
          bindings:
            state: sample
            estimate: estimate
            step: step
            schedule: schedule
            next_state: next_state
          parameters:
            solver: euler
            spacing: karras
            prediction: epsilon
      vae_decoder:
        implementation:
          kind: onnx
          artifact: vae_decoder/model.onnx.textproto
        ports:
          inputs:
            latent:
              dtype: float32
              shape:
              - batch
              - channels
              - latent_height
              - latent_width
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            image:
              dtype: float32
              shape:
              - batch
              - 3
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
    state:
      latent_state:
        contract:
          dtype: float32
          shape:
          - batch
          - channels
          - latent_height
          - latent_width
          batch_layout:
            kind: request_aligned
            axis: 0
        scope: invocation
        initializer: diffusion.noise
        recurrence:
          kind: invariant
      loop_0_active:
        contract:
          dtype: bool
          shape:
          - 1
        scope: invocation
        initializer: package.loop_0_active
        recurrence:
          kind: invariant
    steps:
    - kind: loop
      setup:
      - kind: invoke
        component: diffusion_schedule
        inputs: {}
        outputs:
          schedule: diffusion.schedule
      - kind: invoke
        component: diffusion_timesteps
        inputs: {}
        outputs:
          schedule: diffusion.timesteps
      - kind: invoke
        component: latent_row_shape
        inputs: {}
        outputs:
          shape: diffusion.latent_row_shape
      - kind: invoke
        component: latent_noise
        inputs:
          seed: request.seed
          offset: package.rng_offset
          row_shape: diffusion.latent_row_shape
        outputs:
          noise: diffusion.noise
          next_offset: diffusion.rng_offset
      - kind: invoke
        component: text_encoder
        inputs:
          input_ids: request.input_ids
        outputs:
          encoder_hidden_states: conditioning.conditional
      - kind: invoke
        component: text_encoder
        inputs:
          input_ids: request.negative_input_ids
        outputs:
          encoder_hidden_states: conditioning.unconditional
      - kind: invoke
        component: continue_predicate
        inputs:
          done: package.false
        outputs:
          continue: setup.continue
      steps:
      - kind: invoke
        component: schedule_lookup
        inputs:
          schedule: diffusion.timesteps
          step: loop.iteration
        outputs:
          timestep: diffusion.timestep
      - kind: invoke
        component: model_input
        inputs:
          sample: latent_state
          step: loop.iteration
          schedule: diffusion.schedule
        outputs:
          model_input: diffusion.model_input
      - kind: invoke
        component: denoiser
        inputs:
          sample: diffusion.model_input
          timestep: diffusion.timestep
          encoder_hidden_states: conditioning.unconditional
        outputs:
          noise_pred: denoiser.unconditional
      - kind: invoke
        component: denoiser
        inputs:
          sample: diffusion.model_input
          timestep: diffusion.timestep
          encoder_hidden_states: conditioning.conditional
        outputs:
          noise_pred: denoiser.conditional
      - kind: invoke
        component: guidance_combine
        inputs:
          unconditional: denoiser.unconditional
          conditional: denoiser.conditional
          scale: request.guidance_scale
        outputs:
          estimate: denoiser.estimate
      - kind: invoke
        component: solver_step
        inputs:
          sample: latent_state
          estimate: denoiser.estimate
          step: loop.iteration
          schedule: diffusion.schedule
        outputs:
          next_state: latent.body
      - kind: invoke
        component: continue_predicate
        inputs:
          done: package.false
        outputs:
          continue: loop.continue
      continue_when: loop_0_active
      max_iterations: request.max_iterations
      carried:
      - cell: latent_state
        next: latent.body
      - cell: loop_0_active
        next: loop.continue
      iteration:
        value: loop.iteration
        contract:
          dtype: int64
          shape:
          - batch
    - kind: invoke
      component: vae_decoder
      inputs:
        latent: latent_state
      outputs:
        image: vae.image
    - kind: emit
      value: vae.image
      output: image
      mode: replace
    - kind: emit
      value: latent_state
      output: latent
      mode: replace
