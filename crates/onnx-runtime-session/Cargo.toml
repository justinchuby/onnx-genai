[package]
name = "onnx-runtime-session"
description = "Session and inference API for the ORT 2.0 runtime: intent-based SessionBuilder and sequential executor (skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "session", "inference", "runtime"]
categories = ["science", "api-bindings"]

[features]
default = []
cuda = ["dep:onnx-runtime-ep-cuda"]
mlas = ["onnx-runtime-ep-cpu/mlas"]

[dependencies]
onnx-runtime-memory-governor = { workspace = true }
onnx-genai-runtime-config = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-runtime-loader = { workspace = true }
onnx-runtime-shape-inference = { workspace = true }
onnx-runtime-optimizer = { workspace = true }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ep-cpu = { workspace = true }
onnx-runtime-ep-cuda = { workspace = true, optional = true }
onnx-runtime-tracer = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true }

[dev-dependencies]
prost = { workspace = true }
# Test-only: the CUDA driver-path WAR regression test (cuda feature) launches a
# custom slow-read consumer kernel on the compute stream to open a write-after-
# read window across double-buffer reuse. Same spec as onnx-runtime-ep-cuda:
# dynamic-loading means no CUDA toolkit is needed at build time.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13000", "dynamic-loading"] }

[lints]
workspace = true
