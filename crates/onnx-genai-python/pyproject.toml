# Native-default Python engine wheel. Reference libraries are optional.
# Standard CPython ABI: abi3-py310, built on CPython 3.12.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "onnx-genai"
description = "Native text generation engine (same API as nxrt.genai)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Justin Chu" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
]
# Native CPU execution has no Python runtime dependency.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Reference testing only; ORT 1.32 wheels require Python 3.11+.
ort = ["onnxruntime>=1.32,<2"]
ort-cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.32,<2 ; platform_system == 'Windows' or platform_system == 'Linux'"]
mlx = ["onnxruntime-ep-mlx>=0.27 ; platform_system == 'Darwin'"]

[project.urls]
repository = "https://github.com/justinchuby/onnx-genai"

[tool.maturin]
# Mixed layout: the Python package lives in python/onnx_genai and the compiled
# extension is installed as its private `_onnx_genai` submodule.
python-source = "python"
module-name = "onnx_genai._onnx_genai"
# Standard CPython 3.10+ limited API; free-threaded wheels use a separate abi3t build.
features = ["pyo3/abi3-py310", "pyo3/extension-module"]
strip = true

[tool.cibuildwheel]
# Build once on CPython 3.12; the abi3 wheel supports standard CPython 3.10+.
build = "cp312-*"
skip = "*-musllinux_*"
test-command = 'python "{project}/tests/python_wheel_smoke.py" "{project}/../../tests/fixtures/tiny-llm"'

[tool.cibuildwheel.linux]
# Linux wheel builds run inside a manylinux container, so provision Rust and
# libclang (bindgen needs libclang.so to generate onnx-genai-ort-sys bindings).
# ONNX Runtime headers/import library for the build come from the ort-sys auto-download.
before-all = "dnf install -y clang || yum install -y clang; curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
