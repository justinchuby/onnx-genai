[package]
name = "onnx-runtime-ep-plugin"
description = "Outbound adapter: projects any nxrt ExecutionProvider through the ORT plugin-EP C ABI so upstream ORT can load it as a real EP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "execution-provider", "plugin", "ffi", "runtime"]
categories = ["science", "hardware-support"]

[features]
# Per-phase dispatch counters and optional timing for issue #1077. Off by
# default: with the feature disabled the guards are zero-sized and the counter
# calls are empty, so production builds carry none of it. Timing is gated a
# second time at runtime by ONNX_GENAI_PROFILE_DISPATCH=1.
dispatch_probe = []

[dependencies]
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-genai-ort-sys = { workspace = true }

[dev-dependencies]
onnx-runtime-ort-testkit = { workspace = true }
libloading = { workspace = true }
onnx-runtime-ep-cpu = { workspace = true }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-runtime-memory-governor = { workspace = true }

[[test]]
name = "trait_cabi_parity"
path = "tests/trait_cabi_parity.rs"

[lints]
workspace = true
