[package]
name = "onnx-runtime-ep-cpu"
description = "CPU execution provider for the ORT 2.0 runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "cpu", "execution-provider", "inference", "runtime"]
categories = ["science", "hardware-support"]

[features]
default = ["full"]
# Default-on compatibility umbrella. Minimal builds disable defaults and select
# only the capability groups emitted by the operator-selection manifest.
full = [
    "ops-core",
    "ops-elementwise",
    "ops-reduction",
    "ops-transformer",
    "ops-cnn",
    "ops-quantized",
    "ops-sequence",
]
ops-core = []
ops-elementwise = []
ops-reduction = []
ops-transformer = []
# Phase 1 representative fully-gated group.
ops-cnn = []
ops-quantized = []
ops-sequence = []
# Opt-in vendored MLAS f32/quantized kernels. Kept off by default, and it stays
# off: the production CPU EP is native. MLAS is a *research reference* we
# measure our own kernels against and absorb capability from — it is never
# linked into, activated in, or routed to by a default build. See
# `docs/performance/CPU_MLAS_MIGRATION.md`, and
# `crates/onnx-runtime-ep-cpu-plugin/tests/default_artifacts_are_mlas_free.rs`,
# which falsifies the claim rather than restating it.
mlas = ["dep:mlas-sys"]
# Temporary: within-GroupQueryAttention phase timing (widen/present/attn/out),
# gated further at runtime by ONNX_GENAI_PROFILE_GQA=1. Off by default; adds no
# code to production builds.
gqa_phase_profile = []
tracing = ["dep:onnx-runtime-tracer", "dep:tracing-crate"]

[dependencies]
onnx-runtime-ir = { workspace = true }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-memory-governor = { workspace = true }
onnx-runtime-optimizer = { workspace = true }
onnx-runtime-quantization = { workspace = true }
mlas-sys = { workspace = true, optional = true }
onnx-runtime-loader = { workspace = true }
onnx-runtime-tracer = { workspace = true, optional = true }
tracing-crate = { package = "tracing", version = "0.1", optional = true }
thiserror = { workspace = true }
half = { workspace = true }
rayon = "1"
libc = "0.2"
# Cross-platform futex (Linux FUTEX_WAIT/WAKE, macOS __ulock, Windows
# WaitOnAddress, spin fallback elsewhere) for the persistent SPMD decode pool's
# bounded-spin-then-park barrier: one `wake(&addr)` releases all a node's sleeping
# workers in a single syscall, instead of an O(workers) `unpark` fan-out. Vetted,
# ~200-line crate by the author of "Rust Atomics and Locks".
atomic-wait = "1"
# Pure-Rust libm (no FFI, no `cc`): supplies the correctly-rounded `erf` used by
# the `Erf` op and the fused `Gelu` kernel. A polynomial approximation was ~1e-9
# off near zero and failed the upstream conformance suite's tight tolerance.
libm = "0.2"

# Windows NUMA topology discovery (GetLogicalProcessorInformationEx) and
# per-thread pinning (SetThreadGroupAffinity), with the process's allowed CPU
# set read via GetThreadGroupAffinity. Already present transitively in the
# workspace lock; gated to Windows targets so no non-Windows build pulls it in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Kernel",
] }

[dev-dependencies]
criterion = "0.5"
onnx-runtime-operator-selection = { workspace = true }

[[bench]]
name = "half_prefill_route_ab"
harness = false

[[bench]]
name = "half_decode_gemv_ab"
harness = false

[[bench]]
name = "int4_prefill_route_ab"
harness = false

[[bench]]
name = "int4_decode_loop_ab"
harness = false

# The gap-aware companion to `int4_decode_loop_ab`: same workload, verbatim,
# with a configurable inter-token gap. `int4_decode_loop_ab` is its zero-gap
# row, which is the one workload where parking can never pay off -- so the
# blocktime window cannot be tuned from it.
[[bench]]
name = "decode_gap_park_ab"
harness = false

[[bench]]
name = "int4_acc0_attribution"
harness = false

[[bench]]
name = "int8_prefill_route_ab"
harness = false

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "activation_bench"
harness = false

[[bench]]
name = "gqa_decode"
harness = false

[[bench]]
name = "sdpa_simd"
harness = false

[[bench]]
name = "matmul_nbits_prefill_ab"

# The absorption gate. Native and the MLAS reference in one binary, interleaved,
# so a claimed native win is measured against the route it claims to replace.
# Requires `--features mlas`; with MLAS absent it reports native-only and says
# so rather than inventing a comparison.
[[bench]]
name = "native_vs_mlas"
harness = false

[lints]
workspace = true
