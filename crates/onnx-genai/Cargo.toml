[package]
name = "onnx-genai"
description = "Rust inference runtime for generative AI models on ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "llm", "inference", "genai"]
categories = ["science", "text-processing"]

[features]
default = ["cuda-13000"]
# Enable the ORT CUDA path. The CUDA API version is selected by exactly one
# `cuda-*` feature; this crate defaults to CUDA 13.0.
cuda = ["onnx-genai-ort/cuda", "onnx-genai-engine/ort-cuda"]
# CUDA API version passthroughs, forwarded to all CUDA-capable dependencies.
# Use `--no-default-features` and enable exactly one when overriding CUDA 13.0.
cuda-12060 = ["onnx-genai-ort/cuda-12060", "onnx-genai-engine/cuda-12060"]
cuda-12080 = ["onnx-genai-ort/cuda-12080", "onnx-genai-engine/cuda-12080"]
cuda-12090 = ["onnx-genai-ort/cuda-12090", "onnx-genai-engine/cuda-12090"]
cuda-13000 = ["onnx-genai-ort/cuda-13000", "onnx-genai-engine/cuda-13000"]

[dependencies]
onnx-genai-metadata = { workspace = true }
onnx-genai-comfyui-config = { workspace = true }
onnx-genai-kv = { workspace = true }
onnx-genai-scheduler = { workspace = true }
onnx-genai-engine = { path = "../onnx-genai-engine", version = "=0.1.0-dev.5", default-features = false }
onnx-genai-ort = { path = "../onnx-genai-ort", version = "=0.1.0-dev.5", default-features = false }
onnx-genai-preprocess = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
