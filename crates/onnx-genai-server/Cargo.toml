[package]
name = "onnx-genai-server"
description = "OpenAI-compatible HTTP server for onnx-genai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "llm", "inference", "server"]
categories = ["web-programming::http-server", "science"]

[features]
default = ["metrics", "cuda-13000"]
# Exposes the allocation-free atomic registry at GET /metrics in Prometheus format.
metrics = []
# Enables profiling integration hooks. Perfetto and OTLP exporters remain deferred.
profiling = []
# Our hand-written CUDA EP plus everything `ort-cuda` provides, and the native
# backend needed to reach it. Requires a CUDA host to build (e.g. H200).
native-cuda = [
    "native-backend",
    "ort-cuda",
    "onnx-genai-engine/native-cuda",
    "dep:onnx-runtime-ep-cuda",
    "onnx-runtime-ep-cuda/cuda",
]
# ONNX Runtime CUDA only: enable ONNX Runtime's built-in CUDAExecutionProvider
# (CUDA 13) plus the cudarc GPU sampler in `onnx-genai-ort`, WITHOUT the
# nxrt-native CUDA kernel crate. This is what the `onnx-genai-server` wheel's
# CUDA build uses; GPU ONNX Runtime comes from the `onnxruntime-gpu` wheel.
ort-cuda = ["onnx-genai-ort/cuda", "onnx-genai-engine/ort-cuda"]
# CUDA API version passthroughs, forwarded through every CUDA-capable dependency.
# Use `--no-default-features` and enable exactly one when overriding CUDA 13.0.
cuda-12060 = [
    "cudarc/cuda-12060",
    "onnx-genai/cuda-12060",
    "onnx-genai-ort/cuda-12060",
    "onnx-genai-engine/cuda-12060",
    "onnx-runtime-ep-cuda?/cuda-12060",
]
cuda-12080 = [
    "cudarc/cuda-12080",
    "onnx-genai/cuda-12080",
    "onnx-genai-ort/cuda-12080",
    "onnx-genai-engine/cuda-12080",
    "onnx-runtime-ep-cuda?/cuda-12080",
]
cuda-12090 = [
    "cudarc/cuda-12090",
    "onnx-genai/cuda-12090",
    "onnx-genai-ort/cuda-12090",
    "onnx-genai-engine/cuda-12090",
    "onnx-runtime-ep-cuda?/cuda-12090",
]
cuda-13000 = [
    "cudarc/cuda-13000",
    "onnx-genai/cuda-13000",
    "onnx-genai-ort/cuda-13000",
    "onnx-genai-engine/cuda-13000",
    "onnx-runtime-ep-cuda?/cuda-13000",
]
# Enables native decoder execution for models containing native-only operators.
native-backend = ["onnx-genai-engine/native-backend"]
mlas = ["native-backend", "onnx-genai-engine/mlas"]

[dependencies]
onnx-genai = { path = "../onnx-genai", version = "=0.1.0-dev.5", default-features = false }
onnx-genai-engine = { path = "../onnx-genai-engine", version = "=0.1.0-dev.5", default-features = false }
onnx-genai-metadata = { workspace = true }
# default-features = false so callers overriding the default CUDA 13.0 selector
# with `--no-default-features` do not accidentally unify in a second cudarc CUDA
# binding version from this inter-crate dependency.
onnx-genai-ort = { path = "../onnx-genai-ort", version = "=0.1.0-dev.5", default-features = false }
onnx-runtime-ep-cuda = { path = "../onnx-runtime-ep-cuda", version = "=0.1.0-dev.5", optional = true, default-features = false }
onnx-runtime-memory-governor = { workspace = true }
onnx-genai-preprocess = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
tokio-stream = { workspace = true }
getrandom = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
onnx-runtime-virtual-memory = { workspace = true }
tower = { workspace = true }
image = { workspace = true, features = ["png"] }
tempfile = "3"

[dev-dependencies.cudarc]
version = "0.19"
default-features = false
features = ["std", "driver", "dynamic-loading"]

[lints]
workspace = true
