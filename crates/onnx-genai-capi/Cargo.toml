[package]
name = "onnx-genai-capi"
description = "C ABI for onnx-genai: load a model, generate, and plug in a foreign (C) sampler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "capi", "ffi", "inference", "sampler"]
categories = ["science", "api-bindings"]

[lib]
# `cdylib`/`staticlib` produce the loadable C library; `lib` lets Rust tests and
# downstream crates link the same surface (e.g. to exercise `ForeignSampler`).
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# ONNX Runtime's CUDA EP. The C ABI has no native-backend path, and no code in
# this crate references `onnx-runtime-ep-cuda`, so forwarding the engine's
# `native-cuda` here would compile a whole CUDA EP that nothing can call and
# impose a CUDA toolkit on the build for nothing.
ort-cuda = ["onnx-genai-engine/ort-cuda"]

[dependencies]
onnx-genai-engine = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
