[package]
name = "onnx-genai-bench"
description = "Criterion benchmark suite for onnx-genai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["cuda-13000"]
bench-ort = ["dep:onnx-genai-ort"]
bench-native = [
    "onnx-genai-engine/native-backend",
    "dep:onnx-genai-ort",
    "dep:onnx-runtime-ep-cpu",
    "onnx-runtime-ep-cpu/tracing",
    "dep:onnx-runtime-ep-cuda",
    "dep:onnx-runtime-ir",
    "dep:onnx-runtime-session",
    "dep:onnx-runtime-tracer",
]
mlas = [
    "bench-native",
    "onnx-genai-engine/mlas",
    "onnx-runtime-ep-cpu/mlas",
]
gqa_phase_profile = ["onnx-runtime-ep-cpu/gqa_phase_profile"]
native-cuda = ["bench-native", "onnx-genai-engine/native-cuda", "onnx-runtime-session/cuda"]
# Host<->device bandwidth probe (`roofline_transfer` bin). Pulls in `cudarc`
# directly so the probe measures the raw link the runtime uses, independent of
# any EP. The CUDA API version tracks the crate's `cuda-*` feature (default
# 13.0) via the `cudarc?/cuda-*` mappings below, so it never build-depends on a
# toolkit — the driver is dlopen'd at runtime like the CUDA EP.
transfer-probe = ["dep:cudarc"]
# CPU int4 GEMV roofline probe (`roofline_gemv` bin). Drives the real symmetric
# int4 MatMulNBits decode kernel (the #979 borrowed zero-copy path) at lm_head
# shape to measure its effective memory bandwidth against the STREAM ceiling for
# #994's placement criterion. CPU-only and lean: it pulls in just the CPU EP,
# the EP API tensor types, and the IR — no CUDA, and no engine *features* — so
# it builds fast and measures the same kernel the runtime decodes with. `mlas`
# is deliberately NOT enabled: symmetric int4 accuracy_level=0 returns on the
# borrowed path before the MLAS SQNBit interception, so the measured path is
# identical.
gemv-probe = [
    "dep:onnx-runtime-ep-cpu",
    "dep:onnx-runtime-ep-api",
    "dep:onnx-runtime-ir",
]
# Device-sampler-only CUDA: enables the ORT built-in CUDA EP path plus the
# on-device argmax/sampler in `onnx-genai-ort` WITHOUT the pure-Rust
# `onnx-runtime-ep-cuda`. Use this to benchmark the captured decode / device
# sampling path. The default CUDA API version is 13.0.
#
# Pairs with `native-cuda` below: both pull their own backend, so either one
# alone is a complete, runnable arm of an A/B.
ort-cuda = ["bench-ort", "onnx-genai-ort/cuda"]
cuda-12060 = [
    "onnx-genai-engine/cuda-12060",
    "onnx-genai-ort?/cuda-12060",
    "onnx-runtime-ep-cuda?/cuda-12060",
    "onnx-runtime-session?/cuda-12060",
    "cudarc?/cuda-12060",
]
cuda-12080 = [
    "onnx-genai-engine/cuda-12080",
    "onnx-genai-ort?/cuda-12080",
    "onnx-runtime-ep-cuda?/cuda-12080",
    "onnx-runtime-session?/cuda-12080",
    "cudarc?/cuda-12080",
]
cuda-12090 = [
    "onnx-genai-engine/cuda-12090",
    "onnx-genai-ort?/cuda-12090",
    "onnx-runtime-ep-cuda?/cuda-12090",
    "onnx-runtime-session?/cuda-12090",
    "cudarc?/cuda-12090",
]
cuda-13000 = [
    "onnx-genai-engine/cuda-13000",
    "onnx-genai-ort?/cuda-13000",
    "onnx-runtime-ep-cuda?/cuda-13000",
    "onnx-runtime-session?/cuda-13000",
    "cudarc?/cuda-13000",
]

[dependencies]
onnx-runtime-hostmon = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# Pure-Rust CUDA bindings for the `roofline_transfer` H2D/D2H probe (behind the
# `transfer-probe` feature). `dynamic-loading` keeps the no-build-time-toolkit
# property: the driver is dlopen'd at runtime. Exactly one `cuda-*` version is
# selected transitively via this crate's `cuda-*` features (default 13.0).
half = { workspace = true }
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
], optional = true }
onnx-genai-engine = { path = "../onnx-genai-engine", version = "=0.1.0-dev.5", default-features = false }
onnx-genai-kv = { workspace = true }
onnx-genai-ort = { path = "../onnx-genai-ort", version = "=0.1.0-dev.5", default-features = false, optional = true }
onnx-genai-runtime-config = { workspace = true }
onnx-runtime-ep-cpu = { workspace = true, optional = true }
onnx-runtime-ep-api = { workspace = true, optional = true }
onnx-runtime-ep-cuda = { path = "../onnx-runtime-ep-cuda", version = "=0.1.0-dev.5", optional = true, default-features = false }
onnx-runtime-ir = { workspace = true, optional = true }
onnx-runtime-loader = { workspace = true }
prost = { workspace = true }
onnx-runtime-session = { path = "../onnx-runtime-session", version = "=0.1.0-dev.5", optional = true, default-features = false }
onnx-runtime-tracer = { workspace = true, optional = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = "0.5"
onnx-genai-metadata = { workspace = true }

[[bench]]
name = "no_model"
harness = false

[[bench]]
name = "model"
harness = false
required-features = ["bench-ort"]

[[bin]]
name = "profile_decode"
required-features = ["bench-ort"]

[[bin]]
name = "render_template"
required-features = ["bench-ort"]

[[bin]]
name = "profile_native"
required-features = ["bench-native"]

[[bin]]
name = "profile_vision"
required-features = ["bench-native"]

[[bin]]
name = "multiturn"
required-features = ["bench-native"]

[[bin]]
name = "batch_vision"
required-features = ["bench-native"]

[[bin]]
name = "bench_generic"
# `bench-native`, not `mlas`. This binary has no MLAS-specific code, and while
# it required the `mlas` feature it could only ever be built with MLAS linked -
# so every A/B ratio ever published from it measured the research arm, not the
# arm that ships. `mlas` is not a default feature of `onnx-runtime-ep-cpu`.
# Build the production arm with `--features bench-native`, and the reference
# arm with `--features mlas`.
required-features = ["bench-native"]

[[bin]]
name = "cuda_place"
required-features = ["bench-native"]

[[bin]]
name = "muse_decode"
required-features = ["bench-native"]

[[bin]]
name = "verify_logits_probe"
required-features = ["bench-native"]

[[bin]]
name = "marlin_bench"
required-features = ["native-cuda"]

[[bin]]
name = "roofline_transfer"
required-features = ["transfer-probe"]

[[bin]]
name = "roofline_gemv"
required-features = ["gemv-probe"]

[lints]
workspace = true
