[package]
name = "onnx-runtime-ir"
description = "Graph IR for the ORT 2.0 runtime: types, symbolic shapes, strided layouts, device placement, and a mutable graph model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "ir", "graph", "inference", "runtime"]
categories = ["science", "data-structures"]
# The nightly-only cargo-fuzz harness is its own workspace; never package it.
exclude = ["fuzz/"]

[dependencies]
thiserror = { workspace = true }
prost = { workspace = true }

[build-dependencies]
prost = { workspace = true }
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
onnx-runtime-einsum-conformance = { workspace = true }

[lints]
workspace = true
