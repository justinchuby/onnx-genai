domain: ""
name: Dropout
since_version: 22
doc: Randomly zero elements during training and optionally return the mask.
attributes:
  - { name: seed, type: int }
inputs:
  - { name: data, type_str: T }
  - { name: ratio, type_str: T1, optional: true }
  - { name: training_mode, type_str: T2, optional: true }
outputs:
  - { name: output, type_str: T }
  - { name: mask, type_str: T2, optional: true }
type_constraints:
  - { type_param: T, allowed: [bfloat16, float16, float32, float64] }
  - { type_param: T1, allowed: [float16, float32, float64] }
  - { type_param: T2, allowed: [bool] }
