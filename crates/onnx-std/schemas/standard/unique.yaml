domain: ""
name: Unique
since_version: 11
doc: Return unique elements and optional occurrence metadata.
attributes:
  - { name: axis, type: int }
  - { name: sorted, type: int, default: 1 }
inputs: [{ name: X, type_str: T }]
outputs:
  - { name: Y, type_str: T }
  - { name: indices, type_str: I, optional: true }
  - { name: inverse_indices, type_str: I, optional: true }
  - { name: counts, type_str: I, optional: true }
type_constraints:
  - { type_param: T, allowed: [uint8, uint16, uint32, uint64, int8, int16, int32, int64, bfloat16, float16, float32, float64, string, bool] }
  - { type_param: I, allowed: [int64] }
