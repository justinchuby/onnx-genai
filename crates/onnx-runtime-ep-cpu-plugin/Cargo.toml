[package]
name = "onnx-runtime-ep-cpu-plugin"
description = "CPU execution provider exported as an ORT plugin-EP cdylib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "cpu", "execution-provider", "plugin", "cdylib"]
categories = ["science", "hardware-support"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The vendored ONNX Runtime MLAS kernels, linked into the cdylib as an
# *internal* backend of our own CPU EP. This is **opt-in**: the default cdylib
# and the shipped wheel are our pure-Rust native kernels, and MLAS is enabled
# only with `--features mlas`, where it is used as a reference implementation
# and a graduation gate rather than as the shipped backend. A user who installs
# the wheel gets *our* kernels, so the native gap stays visible and absorption
# (see `docs/performance/ABSORBING_MLAS.md`) keeps a forcing function.
#
# The `onnx-runtime-ep-cpu` dependencies below pin `default-features = false`
# regardless: it drops the EP crate's own `full`/etc. defaults so this crate
# controls the feature set explicitly, and it means Cargo feature unification
# cannot silently re-enable MLAS through some other edge.
mlas = ["onnx-runtime-ep-cpu/mlas"]

[dependencies]
onnx-runtime-ep-cpu = { path = "../onnx-runtime-ep-cpu", version = "=0.1.0-dev.5", default-features = false, features = [
    "full",
] }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }

[dev-dependencies]
onnx-runtime-ort-testkit = { workspace = true }
libloading = { workspace = true }
onnx-genai-ort-sys = { workspace = true }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }
onnx-runtime-ep-cpu = { path = "../onnx-runtime-ep-cpu", version = "=0.1.0-dev.5", default-features = false, features = [
    "full",
] }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-std = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
