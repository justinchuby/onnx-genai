[package]
name = "onnx-runtime-ep-cpu-plugin"
description = "CPU execution provider exported as an ORT plugin-EP cdylib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "cpu", "execution-provider", "plugin", "cdylib"]
categories = ["science", "hardware-support"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link the vendored ONNX Runtime MLAS kernels into the cdylib. ORT's own CPU
# execution provider *is* MLAS, so a cdylib without this feature is not a
# like-for-like build: the quantized matmul paths measure an order of magnitude
# slower. The shipped wheel enables it on every target CI proves it builds on
# (see python/nxrt-ep-cpu/setup.py); it stays off by default so a host with no
# C++ toolchain can still build the cdylib.
mlas = ["onnx-runtime-ep-cpu/mlas"]

# Compile the dispatch probe into the cdylib, so a harness can resolve its
# entry points across the ORT boundary. Never enabled for a shipped build: the
# probe's `no_mangle` exports exist only under this feature precisely so the
# shipped cdylib keeps exporting the ORT plugin ABI and nothing else
# (`plugin_export_abi::l1_no_symbol_leakage` pins that).
dispatch_probe = ["onnx-runtime-ep-plugin/dispatch_probe"]

[dependencies]
onnx-runtime-ep-cpu = { workspace = true }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }

[dev-dependencies]
onnx-runtime-ort-testkit = { workspace = true }
libloading = { workspace = true }
onnx-genai-ort-sys = { workspace = true }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }
onnx-runtime-ep-cpu = { workspace = true }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-std = { workspace = true }
serde_yaml = { workspace = true }

[lints]
workspace = true
