[package]
name = "onnx-runtime-ep-cpu-plugin"
description = "CPU execution provider exported as an ORT plugin-EP cdylib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "cpu", "execution-provider", "plugin", "cdylib"]
categories = ["science", "hardware-support"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The vendored ONNX Runtime MLAS kernels, linked into the cdylib as an
# *internal* backend of our own CPU EP. ORT's built-in CPU EP is MLAS, so a
# cdylib without this is not a like-for-like build: the quantized matmul paths
# measure an order of magnitude slower. On by default (repository direction,
# 2026-08-17); `--no-default-features` builds the pure-Rust cdylib for a host
# with no C++ toolchain or a target the vendored sources do not cover.
#
# The `onnx-runtime-ep-cpu` dependencies below pin `default-features = false`
# precisely so this switch works: with the EP's own defaults on, Cargo feature
# unification would re-enable MLAS and `--no-default-features` would silently
# be a no-op.
default = ["mlas"]
mlas = ["onnx-runtime-ep-cpu/mlas"]

[dependencies]
onnx-runtime-ep-cpu = { path = "../onnx-runtime-ep-cpu", version = "=0.1.0-dev.5", default-features = false, features = [
    "full",
] }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }

[dev-dependencies]
onnx-runtime-ort-testkit = { workspace = true }
libloading = { workspace = true }
onnx-genai-ort-sys = { workspace = true }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }
onnx-runtime-ep-cpu = { path = "../onnx-runtime-ep-cpu", version = "=0.1.0-dev.5", default-features = false, features = [
    "full",
] }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-std = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
