# Native-default CLI/server wheel. ORT libraries are optional reference/test
# dependencies and are discovered without loading their Python packages.
# Standard wheel: abi3-py310, built on CPython 3.12.
[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "onnx-genai-server"
description = "Native ONNX command-line generation tool and OpenAI-compatible server"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Justin Chu" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
]
# Native CPU execution has no Python runtime dependency.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Reference testing only. ORT 1.32 wheels require Python 3.11+.
ort = ["onnxruntime>=1.32,<2"]
ort-cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.32,<2 ; platform_system == 'Windows' or platform_system == 'Linux'"]
# Explicit plugin installation; the launcher discovers its path without import.
mlx = ["onnxruntime-ep-mlx>=0.27 ; platform_system == 'Darwin'"]

[project.scripts]
# The compiled CLI selects the backend; Python supplies optional path hints.
onnx-genai = "onnx_genai_server:main"

[project.urls]
repository = "https://github.com/justinchuby/onnx-genai"

[tool.maturin]
# Embed the maintained MPL reader's exact build-source snapshot, not a second source tree.
include = [{ path = "onnx-genai-symphonia-mkv-*/**/*", from = "out-dir", to = "onnx_genai_server/_third_party", crate_name = "onnx-genai-symphonia-mkv" }]
# Mixed layout: the Python launcher package lives in python/onnx_genai_server and
# the compiled CLI is installed as its private `_onnx_genai_server` submodule.
python-source = "python"
module-name = "onnx_genai_server._onnx_genai_server"
# `python` turns on the crate's PyO3 module; the rest builds the abi3 extension.
features = ["python", "pyo3/abi3-py310", "pyo3/extension-module"]
strip = true

[tool.cibuildwheel]
# One CPython 3.12 build, usable on standard CPython 3.10+ via abi3.
build = "cp312-*"
skip = "*-musllinux_*"
# Smoke-test the installed Native-default command with no ORT dependency.
test-command = 'python "{project}/tests/python_wheel_smoke.py" "{project}/../../tests/fixtures/tiny-llm"'

[tool.cibuildwheel.linux]
# Linux wheel builds run inside a manylinux container, so provision Rust and
# libclang (bindgen needs libclang.so to generate onnx-genai-ort-sys bindings).
# ONNX Runtime headers/import library for the build come from the ort-sys auto-download.
before-all = "dnf install -y clang || yum install -y clang; curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
