[package]
name = "onnx-runtime-ep-cuda-plugin"
description = "CUDA execution provider exported as an ORT plugin-EP cdylib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["onnx", "cuda", "execution-provider", "plugin", "cdylib"]
categories = ["science", "hardware-support"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The `cuda` feature gates anything that requires a CUDA toolkit on the build
# host. Without it the crate compiles (for workspace-check CI) but the cdylib
# is a no-op stub returning zero factories.
cuda = ["onnx-runtime-ep-cuda"]

[dependencies]
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-runtime-ep-cuda = { workspace = true, optional = true }

[dev-dependencies]
onnx-genai-ort-sys = { workspace = true }
onnx-runtime-ort-testkit = { workspace = true }
onnx-runtime-ep-plugin = { path = "../onnx-runtime-ep-plugin", version = "=0.1.0-dev.5" }
onnx-runtime-ep-api = { workspace = true }
onnx-runtime-ir = { workspace = true }
onnx-std = { workspace = true }
libloading = { workspace = true }

[lints]
workspace = true
