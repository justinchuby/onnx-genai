# Stable Diffusion v1.5 text-to-image latent-diffusion pipeline.
#
# This is the canonical NON-autoregressive generality stress test for the
# inference_metadata pipeline contract: there is no token loop. Instead a
# CONDITION ENCODER runs once, an iterative DENOISER (UNet) is driven by a
# scheduler over N steps with a loop-carried latent, and a VAE DECODER runs once
# at the end.
#
#   text_encoder (CLIP)  --run once (prompt_only)-->  encoder_hidden_states
#        │
#        ▼
#   denoiser (UNet2DConditionModel)  --run num_steps times (every_step)-->
#        │   loop-carried latent:  denoiser.out_sample -> denoiser.sample
#        │   scheduler (Euler + Karras sigmas) maps the epsilon prediction to
#        │   the next latent each step, feeding the per-step timestep in.
#        ▼
#   vae_decoder (AutoencoderKL.decode)  --run once (final_only)-->  image
#
# Provenance: component names, filenames, and port names follow the diffusers
# ONNX export layout of runwayml/stable-diffusion-v1-5 (a.k.a.
# stable-diffusion-v1-5/stable-diffusion-v1-5) as produced by
# `optimum-cli export onnx` / `ORTStableDiffusionPipeline`. The numeric noise
# schedule (num_train_timesteps / beta_start / beta_end / scaled_linear) is the
# published SD-1.x scheduler config. This file is a hand-authored DESCRIPTION of
# that pipeline for the metadata contract; it is not itself a model export.
#
# Tensor shapes for the standard 512x512 configuration (batch = 1):
#   text_encoder.input_ids            int64  [1, 77]
#   text_encoder.last_hidden_state    fp32   [1, 77, 768]
#   denoiser.sample                   fp32   [1, 4, 64, 64]   (loop-carried latent)
#   denoiser.timestep                 fp32   []               (per-step scalar)
#   denoiser.encoder_hidden_states    fp32   [1, 77, 768]     (constant conditioning)
#   denoiser.out_sample               fp32   [1, 4, 64, 64]   (epsilon / noise prediction)
#   vae_decoder.latent_sample         fp32   [1, 4, 64, 64]
#   vae_decoder.sample                fp32   [1, 3, 512, 512] (RGB image, [-1, 1])

pipeline:
  models:
    text_encoder:
      filename: text_encoder/model.onnx
      type: encoder
      tokenizer: tokenizer.json
    denoiser:
      filename: unet/model.onnx
      type: denoiser
    vae_decoder:
      filename: vae_decoder/model.onnx
      type: vae

  dataflow:
    # Conditioning: CLIP hidden states feed the UNet cross-attention every step.
    - from: text_encoder.last_hidden_state
      to: denoiser.encoder_hidden_states
      dtype: fp32
    # Loop-carried self-edge: the UNet's noise prediction is turned into the next
    # latent by the scheduler and fed back into `sample` on the following step.
    - from: denoiser.out_sample
      to: denoiser.sample
      dtype: fp32
    # Final decode: the last latent is decoded to an RGB image by the VAE.
    - from: denoiser.sample
      to: vae_decoder.latent_sample
      dtype: fp32

  strategy:
    kind: iterative
    denoiser: denoiser
    num_steps: 25
    # Per-step timestep/sigma scalar port on the UNet.
    timestep_input: timestep
    # Classifier-free guidance: on the unconditional pass the cross-attention
    # conditioning is replaced by the negative-prompt encoding (supplied at
    # runtime as `denoiser.encoder_hidden_states.uncond`).
    cfg_conditioning_input: encoder_hidden_states
    guidance_scale: 7.5
    scheduler_config:
      kind: euler
      num_train_timesteps: 1000
      beta_start: 0.00085
      beta_end: 0.012
      beta_schedule: scaled_linear
      prediction_type: epsilon
      use_karras_sigmas: true

  phases:
    text_encoder:
      run_on: prompt_only
    denoiser:
      run_on: every_step
    vae_decoder:
      run_on: final_only
