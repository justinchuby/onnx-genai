coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, tree"

ignore:
  - "**/tests/**"
  - "**/build.rs"
  - "target/**"
  - "crates/onnx-genai-ort/ort-sys/**"
  - "**/*_generated.rs"

flags:
  offline:
    carryforward: false
  cli-ort-linux:
    carryforward: true
  cli-ort-windows:
    carryforward: true
  mlas:
    carryforward: true
