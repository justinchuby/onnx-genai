[package]
name = "packed-activation-study"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
onnx-runtime-ep-cpu = { path = "../../../../crates/onnx-runtime-ep-cpu" }
onnx-runtime-ep-api = { path = "../../../../crates/onnx-runtime-ep-api" }
onnx-runtime-ir = { path = "../../../../crates/onnx-runtime-ir" }
onnx-runtime-memory-api = { path = "../../../../crates/onnx-runtime-memory-api" }
onnx-runtime-memory-governor = { path = "../../../../crates/onnx-runtime-memory-governor" }
onnx-runtime-optimizer = { path = "../../../../crates/onnx-runtime-optimizer" }
half = "2"
rayon = "1"
libc = "0.2"
serde_json = "1"

# Match the production workspace's package override, which a nested workspace
# does not inherit. All arithmetic arms are linked into this one executable.
[profile.release.package.onnx-runtime-ep-cpu]
codegen-units = 1
