[package]
name = "native-workspace-memo-study"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[dependencies]
onnx-runtime-session = { path = "../../../../crates/onnx-runtime-session", default-features = false }
onnx-runtime-ep-cpu = { path = "../../../../crates/onnx-runtime-ep-cpu" }
onnx-runtime-ep-api = { path = "../../../../crates/onnx-runtime-ep-api" }
onnx-runtime-ir = { path = "../../../../crates/onnx-runtime-ir" }
onnx-runtime-loader = { path = "../../../../crates/onnx-runtime-loader" }
onnx-runtime-memory-api = { path = "../../../../crates/onnx-runtime-memory-api" }
onnx-runtime-memory-governor = { path = "../../../../crates/onnx-runtime-memory-governor" }
half = "2"
rayon = "1"
libc = "0.2"
serde_json = "1"

# Nested workspaces do not inherit the production CPU package override.
[profile.release.package.onnx-runtime-ep-cpu]
codegen-units = 1
