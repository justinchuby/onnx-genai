\* Negative model. The failed node is allowed to keep executing work it had
\* merely queued, which is what filtering purely on submission time does. This
\* configuration must violate FailedNodeStopsAtFault, so the module keeps
\* proving that stopping the failed node is what buys the property.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    NumOperations = 6
    FaultAt = 1
    QuiesceTimeout = 5
    MaxTime = 12
    EnforceFailedNodeStop = FALSE

INVARIANT TypeOK
INVARIANT SettledExactlyOnce
INVARIANT FailedNodeStopsAtFault
INVARIANT SurvivorWorkIsNotDiscarded
INVARIANT NoCompletionAfterFailure
INVARIANT QuiescenceBoundedByDeadline
INVARIANT QuiescenceAfterFault
