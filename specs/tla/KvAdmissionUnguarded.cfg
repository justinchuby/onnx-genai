\* Negative model. The admission guard is disabled, so this configuration must
\* violate ProgressPossible: without the guard the scheduler can fill the KV
\* pool with prefill extents that leave no resident request able to decode,
\* release, and let the pool drain. check.sh asserts this violation so the
\* module keeps proving that the guard is what buys deadlock freedom.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    NumRequests = 6
    Capacity = 10
    MaxChunk = 3
    MaxDecodeWidth = 3
    EnforceAdmissionGuard = FALSE

INVARIANT TypeOK
INVARIANT CapacityRespected
INVARIANT ExtentsConserved
INVARIANT TerminalReleasesAll
INVARIANT NoOverCharge
INVARIANT ProgressPossible
INVARIANT ResidentCanDrain
