\* Negative model. Eviction is allowed before a model has retired anything, so
\* the device can load a model and evict it again having achieved nothing. This
\* configuration must violate NoWastedResidency, keeping the module honest
\* about which rule buys the progress guarantee.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    NumModels = 4
    Capacity = 5
    NumPinned = 1
    RequestsPerModel = 2
    EnforceRetireBeforeEvict = FALSE

INVARIANT TypeOK
INVARIANT CapacityRespected
INVARIANT PinnedStaysResident
INVARIANT ServedOnlyWhenResident
INVARIANT ProgressPossible
INVARIANT NoWastedResidency
