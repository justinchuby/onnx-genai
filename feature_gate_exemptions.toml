# Feature Gate Exemptions — deliberate decisions not to optimize
#
# Each [[exemption]] records a case where a cfg-gated fast path exists but the
# fallback is *intentionally* left unoptimized. This is not an allowlist — it
# is a claim: "we evaluated this and the scalar fallback is acceptable."
#
# An exemption must carry substantive Amdahl reasoning (≥20 chars) explaining
# WHY the fallback is acceptable. An exemption without reasoning fails the lint
# — "we chose not to" must be distinguishable from "we forgot".
#
# Semantics (modelled on dispatch_manifest.toml [[exclusion]]):
#   - Adding an exemption is a deliberate claim: "this does not need a fast path."
#   - Removing an exemption re-enables the lint for that site.
#   - A stale exemption (no longer matches a violation) fails CI — the exemption
#     must be cleaned up when the underlying code changes.
#   - Periodic review of this file is expected; exemptions can become wrong as
#     models evolve (an op that was 1 node becomes 35 nodes in a new model).
#
# Required fields:
#   file    — path to the source file (relative to repo root)
#   line    — line number of the cfg gate
#   feature — the unreachable feature name
#   reason  — substantive justification with Amdahl reasoning (≥20 chars)
#
# Optional fields:
#   op          — op name for human readability
#   reviewed_by — who made this decision
#   date        — when the exemption was added

[[exemption]]
op = "GlobalPool"
file = "crates/onnx-runtime-ep-cpu/src/kernels/pooling.rs"
line = 481
feature = "mlas"
reason = "GlobalPool: 1 node per model (MobileNetV2, ResNet), operates on small spatial tensors (typically 7×7 or 1×1) at network end. Scalar iteration over ≤49 elements is negligible share of runtime — LLVM auto-vectorizes the sum/max reduction. Not worth a dedicated SIMD path."
reviewed_by = "resch"
date = "2026-07-28"
