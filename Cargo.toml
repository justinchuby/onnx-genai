# External
# `default` pulls `onig` (a vendored C regex engine), `esaxx_fast` (a C++ suffix
# array), and `progressbar` (indicatif). None are reachable from how this
# workspace uses tokenizers, and the two native builds cost more than the Rust
# crate itself. `fancy-regex` is the pure-Rust regex backend, which is what
# llguidance's `toktrie_hf_tokenizers` already selects.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
schemars = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
tower = { version = "0.5", features = ["util"] }
hound = "3.5"
rustfft = "6.4"
half = "2"
prost = "0.13"
image = { version = "0.25", default-features = false }
libloading = "0.8"
memmap2 = "0.9"
prost-reflect = { version = "0.14" }