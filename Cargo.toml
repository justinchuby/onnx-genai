    "crates/onnx-std",
    "crates/onnx-std-python",

    # ── Outbound ORT plugin-EP export (not in default-members — requires ort-sys) ──
    "crates/onnx-runtime-ep-plugin",
    "crates/onnx-runtime-ep-cpu-plugin",
    "crates/onnx-runtime-ep-cuda-plugin",
    # Test-only: CPU-backed shared-EP plugin used for real-ORT conformance of
    # the shared-EP (CUDA-shaped) ownership path on GPU-less hosts.
    "crates/onnx-runtime-ep-shared-mock-plugin",
    # Test-only helper crate (publish = false): real-ORT + cdylib discovery.
    "crates/onnx-runtime-ort-testkit",

    # ── Native nxrt dynamic EP ABI (§524 native half) ──
    "crates/onnx-runtime-ep-nxrt-abi",
    "crates/onnx-runtime-ep-nxrt-host",
    "crates/onnx-runtime-ep-nxrt-testplugin",

    # ── Vendored ONNX Runtime MLAS bindings ──
    # Registered as a member so `cargo build -p mlas-sys` resolves. Nothing
    # reaches it by default: only `--features onnx-runtime-ep-cpu/mlas` pulls it
    # in, and that build is a research reference, never a shipped artifact.
    "crates/mlas-sys",
]

# Bare `cargo build`/`cargo test` operate on this set only. No member's default
