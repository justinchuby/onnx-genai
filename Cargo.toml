[workspace.package]
version = "0.1.0-dev.5"
edition = "2024"
license = "MIT"
authors = ["Justin Chu"]
repository = "https://github.com/justinchuby/onnx-genai"

# The CPU EP's elementwise kernels are AVX2 `#[target_feature]` functions whose
# hot loops only vectorise when the compiler can see the dispatcher, the chunk
# loop and the per-vector body together. The default sixteen codegen units split
# that chain and the loops come out scalar, at a cost of up to 2.65x on the
# elementwise family (`Sqrt` f32 at 4096 elements: 0.639 ns/elem against 0.241;
# 77 of 105 measured cases move by more than 1.15x).
# The failure is silent -- identical source, identical tests, no runtime-path
# difference -- so it is pinned here rather than left to whichever partition the
# compiler happens to pick. See `docs/performance/CPU_ACTIVATION_GAPS.md`.
#
# Scoped to this package alone: the rest of the workspace keeps parallel codegen
# and only this crate pays the serial build (~19 s -> ~65 s).
[profile.release.package.onnx-runtime-ep-cpu]
codegen-units = 1

# `bench` does not inherit a per-package override from `release`, so `cargo
# bench` would rebuild the crate as sixteen units and measure the de-vectorized
# code -- the one thing a benchmark must not do.
[profile.bench.package.onnx-runtime-ep-cpu]
codegen-units = 1

# Central workspace lint policy (rico audit #11). Keep this SMALL, WARN-only,
# and defensible: it is a shared, extensible anchor, not a cleanup crusade.
# Member crates opt in via `[lints] workspace = true`. Do NOT add `deny`/`forbid`
# or noisy pedantic/nursery groups here without team sign-off.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Widely-satisfied hygiene lints only.
uninlined_format_args = "warn"
# rustc/clippy 1.98.0 (2026-08-18) added `chunks_exact_to_as_chunks`, a warn-by-default
# lint that fires at 201 call sites across 12 crates here and so turns every
# `-D warnings` gate red the moment a runner picks up the new stable. This repo pins no
# toolchain, so that is not opt-in.
#
# It is also not uniformly auto-fixable: where the chunk size is an associated const of
# a type parameter (`onnx-runtime-ir::read_vec_le` uses `T::BYTE_SIZE`), the suggested
# `as_chunks::<T::BYTE_SIZE>()` fails to compile — "generic parameters may not be used
# in const operations". Verified directly against rustc 1.98.0.
#
# Allowed centrally so a toolchain bump cannot gate unrelated work. Migrating the sites
# that do benefit (`as_chunks` yields `&[T; N]`, dropping fallible `try_into` and helping
# codegen) is worth doing per-crate by each owner, not as one 201-site emergency rewrite:
# tracked in #1606, which also owns deleting this line. #1605 covers pinning the toolchain
# so the next new stable lint is not an outage.
chunks_exact_to_as_chunks = "allow"

