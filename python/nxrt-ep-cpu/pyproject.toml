# nxrt-ep-cpu — packaging for the ORT plugin-EP (CPU) shared library.
#
# The wheel bundles the compiled `onnx-runtime-ep-cpu-plugin` cdylib
# (`libonnx_runtime_ep_cpu_plugin.{so,dll,dylib}`), which exports the ORT
# plugin-EP C ABI (`CreateEpFactories` / `ReleaseEpFactory`). It is NOT a PyO3
# extension, so we build it with plain cargo (see setup.py) and vendor the
# shared library as package data. A thin pure-Python `__init__` exposes
# `get_library_path()` and `register()`. This avoids the dual-symbol linker
# problem that a maturin dual-purpose (PyO3 + C-ABI) module would introduce.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxrt-ep-cpu"
version = "0.1.0.dev5"
description = "ONNX Runtime plugin execution provider (CPU) — bundled cdylib for register_execution_provider_library"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Justin Chu" }]
readme = "README.md"
keywords = ["onnx", "onnxruntime", "execution-provider", "cpu", "plugin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# `onnxruntime` is an optional runtime peer: nxrt_ep_cpu.register() uses it, but
# get_library_path() works without it. Pin to a release exposing the plugin-EP
# registration API.
onnxruntime = ["onnxruntime>=1.22"]

[project.urls]
repository = "https://github.com/justinchuby/onnx-genai"

[tool.setuptools]
# Binary-only distribution: the .so/.dll/.dylib is copied in by setup.py's
# build_py, and there are no compiled Python extensions to discover.
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle whichever platform cdylib was produced for this wheel.
nxrt_ep_cpu = ["*.so", "*.dll", "*.dylib"]

[tool.cibuildwheel]
# One build per platform is enough: the wheel is tagged py3-none-<platform>
# (the bundled cdylib has no CPython ABI dependency), so cp310 covers all.
# EXCEPTION: Windows ARM64 (win_arm64) has no CPython 3.10 build, so the CI
# workflow overrides CIBW_BUILD to cp311-* for that row only (see
# .github/workflows/publish-ep-plugins.yml). Any single CPython drives the
# ABI-less build.
build = "cp310-*"
skip = "*-musllinux_*"
# Also asserts the bundled cdylib is the build this platform asked for: the
# wheel is expected to carry the MLAS kernels wherever setup.py enables them,
# and a silently-pure-Rust wheel is an order of magnitude slower on quantized
# matmul. `_mlas_features()` is the single source of truth for both.
test-command = 'python {project}/check_wheel.py'

[tool.cibuildwheel.linux]
# manylinux container needs libclang (bindgen, via onnx-genai-ort-sys) and Rust.
before-all = "dnf install -y clang-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
